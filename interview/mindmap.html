g cũng là bug nghiêm trọng, vì kế toán đối soát không khớp và khách khiếu nại. Chọn sai kiểu dữ liệu ở đầu dự án thì về sau rất khó sửa. \"Vì sao không dùng float cho tiền\" là câu hỏi gần như chắc chắn gặp.", "checks": ["Chứng minh được <code>0.1 + 0.2 != 0.3<\/code> trong PHP và giải thích bằng biểu diễn nhị phân", "Thiết kế được cột và JSON cho số tiền đa tiền tệ"], "children": [{"label": "Kiểu dữ liệu cho tiền", "kind": "topic", "children": []}, {"label": "Mã tiền tệ và số chữ số thập phân", "kind": "topic", "children": []}, {"label": "Tiền trong API", "kind": "topic", "children": []}, {"label": "Khi nào float vẫn dùng được", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Chuỗi và UTF-8 cơ bản", "kind": "module", "file": "22-practical-data.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "App tiếng Việt thì chuỗi có dấu có mặt ở mọi nơi: tên người, địa chỉ, tiêu đề bài viết. Emoji bị thành <code>????<\/code>, tên bị cắt ra ký tự rác, slug mất chữ <code>đ<\/code> đều là bug hay gặp. Người phỏng vấn thường hỏi \"vì sao MySQL không lưu được emoji\" và \"độ dài chuỗi tính thế nào\".", "checks": ["Liệt kê được mọi chỗ trong một app Laravel + MySQL phải khai UTF-8 để emoji lưu và hiển thị đúng", "Nói được độ dài theo byte, code point, grapheme của <code>\"Việt 👨‍👩‍👧\"<\/code>"], "children": [{"label": "UTF-8 ở mọi nơi", "kind": "topic", "children": []}, {"label": "Ba đơn vị độ dài", "kind": "topic", "children": []}, {"label": "Slug", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Thông báo qua queue", "kind": "module", "file": "22-practical-data.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Gần như app nào cũng gửi email xác nhận đơn, OTP, thông báo. Gửi sai cách làm request chậm, hoặc tệ hơn là gửi \"đặt hàng thành công\" cho một đơn không tồn tại. Đây là bug rất hay gặp trong Laravel và hay được hỏi cùng chủ đề transaction.", "checks": ["Tái hiện được bug \"email gửi cho đơn đã rollback\" trong Laravel và sửa bằng <code>afterCommit<\/code>", "Nói được <code>afterCommit<\/code> còn thiếu gì so với outbox"], "children": [{"label": "Vì sao gửi qua queue", "kind": "topic", "children": []}, {"label": "Gửi sau commit", "kind": "topic", "children": []}, {"label": "Job có thể chạy lại", "kind": "topic", "children": []}, {"label": "Môi trường dev và staging", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Timezone, DST, kiểu cột, cron, báo cáo", "kind": "module", "file": "22-practical-data.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là module có nhiều bug production nhất trong file: báo cáo doanh thu theo ngày bị lệch, cron chạy sai giờ, job chạy hai lần khi đổi giờ mùa hè. Dev ở Việt Nam ít gặp DST nên hay bị bất ngờ khi có khách nước ngoài. Người phỏng vấn thường hỏi \"viết query doanh thu theo ngày\" để xem bạn có nghĩ tới timezone không.", "checks": ["Viết được query doanh thu theo ngày giờ VN trên cột UTC, dùng được index (bài tập 2)", "Giải thích được bug \"lệch 7 tiếng\" xảy ra ở đâu giữa PHP, MySQL session và cột dữ liệu", "Lên lịch được job \"8h sáng giờ của từng user\" cho khách ở Sydney, chạy đúng qua ngày đổi giờ"], "children": [{"label": "Kiểu cột thời gian trong MySQL", "kind": "topic", "children": []}, {"label": "Đối chiếu Postgres", "kind": "topic", "children": []}, {"label": "Timezone là tên vùng, không phải offset", "kind": "topic", "children": []}, {"label": "DST", "kind": "topic", "children": []}, {"label": "Đồng hồ giữa các máy", "kind": "topic", "children": []}, {"label": "Cron và scheduler", "kind": "topic", "children": []}, {"label": "Báo cáo theo ngày", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Tiền: làm tròn, đa tiền tệ, chia tiền", "kind": "module", "file": "22-practical-data.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Làm tròn và chia tiền là nơi các hệ thống thương mại điện tử, ví điện tử hay lệch một vài đồng khi đối soát. Mỗi đồng lệch đều phải giải trình với kế toán. Người  "module", "file": "22-practical-data.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Ví điện tử, điểm thưởng, số dư tài khoản, công nợ đều cần một cách ghi tiền mà kiểm tra lại được và không bao giờ \"mất dấu\" một đồng. Cách ngây thơ (một cột <code>balance<\/code> rồi <code>UPDATE<\/code>) không trả lời được câu \"vì sao số dư là con số này\". Phỏng vấn senior ở công ty fintech hay thương mại điện tử gần như chắc chắn hỏi thiết kế ví hoặc ledger.", "checks": ["Thiết kế được schema ví điện tử (accounts, transactions, entries) và viết được luồng chuyển tiền an toàn với đồng thời", "Viết được query kiểm tra bất biến \"tổng bút toán bằng 0\" và giải thích dùng nó khi nào"], "children": [{"label": "Ledger: ghi giao dịch, không chỉ ghi số dư", "kind": "topic", "children": []}, {"label": "Bút toán kép", "kind": "topic", "children": []}, {"label": "Sửa sai", "kind": "topic", "children": []}, {"label": "Số dư", "kind": "topic", "children": []}, {"label": "Đồng thời và idempotency", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Thanh toán qua cổng", "kind": "module", "file": "22-practical-data.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Tích hợp VNPay, Momo, Stripe là việc gần như mọi app bán hàng phải làm, và lỗi ở đây là mất tiền thật: đơn chưa trả mà thành đã trả, khách bị trừ tiền hai lần, hoàn tiền hai lần. Người phỏng vấn hay hỏi \"vì sao không tin return URL\" và \"gọi cổng bị timeout thì làm gì\".", "checks": ["Vẽ được sequence diagram thanh toán có IPN đến trước return URL, IPN đến trễ, và IPN không bao giờ đến", "Xử lý được đúng kịch bản \"gọi API hoàn tiền timeout, dev retry, khách được hoàn hai lần\""], "children": [{"label": "Luồng chung", "kind": "topic", "children": []}, {"label": "Xử lý IPN", "kind": "topic", "children": []}, {"label": "Timeout không rõ kết quả", "kind": "topic", "children": []}, {"label": "Đối soát", "kind": "topic", "children": []}, {"label": "Thiết kế cho nhiều cổng", "kind": "topic", "children" de>php file.php<\/code> để kiểm (bài tập 1)", "Giải thích được \"object được truyền by reference\" sai ở chỗ nào", "Nói được <code>['1' =&gt; 'a', 1 =&gt; 'b', true =&gt; 'c']<\/code> có mấy phần tử và vì sao"], "children": [{"label": "Array là hash table có thứ tự", "kind": "topic", "children": []}, {"label": "Gộp và kiểm tra array", "kind": "topic", "children": []}, {"label": "Gán giá trị: array copy, object là handle", "kind": "topic", "children": []}, {"label": "Reference &", "kind": "topic", "children": []}, {"label": "Chi phí bộ nhớ", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "1.3 OOP trong PHP", "kind": "module", "file": "05-php-laravel.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Laravel dựa rất nhiều vào những tính năng OOP riêng của PHP: trait, <code>static::<\/code>, magic method, closure. Không hiểu chúng thì đọc source Laravel như đọc phép thuật, và không trả lời được câu \"<code>User::where()<\/code> gọi được dù <code>where<\/code> không phải static method là vì sao\".", "checks": ["Viết được ví dụ <code>self<\/code> và <code>static<\/code> cho ra kết quả khác nhau", "Giải thích được <code>User::where(...)<\/code> gọi được dù <code>where<\/code> không phải static method", "Nêu được một ca trait là lựa chọn đúng và một ca nên thay bằng composition"], "children": [{"label": "Interface, abstract class, trait", "kind": "topic", "children": []}, {"label": "Late static binding: self:: và static::", "kind": "topic", "children": []}, {"label": "Magic method", "kind": "topic", "children": []}, {"label": "Closure và arrow function", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "1.4 Exception và xử lý lỗi", "kind": "module", "file": "05-php-laravel.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Bắt exception sai tầng hoặc bắt sai loại là nguồn của các bug \"job chết im lặng\", \"lỗi bị nuốt, log không có gì\". Người phỏng vấn hay hỏi <code>Exception<\/code> khác <code>Error<\/code> thế nào, và nhờ đó biết bạn có hiểu cây <code>Throwable<\/code> của PHP 7+ không.", "checks": ["Vẽ được cây <code>Throwable<\/code> và nói <code>TypeError<\/code> bắt bằng <code>catch<\/code> nào", "Giải thích được vì sao job Laravel \"chết im lặng\" khi code chỉ <code>catch (Exception)<\/code>"], "children": [{"label": "Cây Throwable", "kind": "topic", "children": []}, {"label": "try/catch/finally", "kind": "topic", "children": []}, {"label": "Warning, notice và fatal error", "kind": "topic", "children": []}, {"label": "Trong Laravel", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "1.5 Composer và PSR", "kind": "module", "file": "05-php-laravel.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi project PHP hiện đại đều đứng trên Composer. Lỗi deploy kiểu \"máy dev chạy, production vỡ\" rất hay đến từ việc không commit <code>composer.lock<\/code> hoặc chạy nhầm <code>update<\/code>. Người phỏng vấn thường hỏi <code>install<\/code> khác <code>update<\/code>, class được nạp thế nào, và PSR là gì.", "checks": ["Giải thích được <code>composer install<\/code> và <code>composer update<\/code> khác nhau thế nào và khi nào chạy lệnh nào trên CI", "Nói được class <code>App\\Models\\User<\/code> được nạp từ file nào qua từng bước autoload", "Viết đúng ràng buộc cho \"nhận mọi bản 2.x từ 2.4 trở lên\""], "children": [{"label": "Autoload và PSR-4", "kind": "topic", "children": []}, {"label": "Tối ưu autoloader", "kind": "topic", "children": []}, {"label": "composer.json, composer.lock và semver", "kind": "topic", "children": []}, {"label": "Các PSR cần biết", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "1.6 Laravel cơ bản", "kind": "module", "file": "05-php-laravel.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là phần dùng hằng ngày, nhưng cũng là nơi có những lỗ hổng bảo mật phổ biến nhất của app Laravel: mass assignment, IDOR, validation có race condition. Câu hỏi phỏng vấn ở mức này thường là \"chỉ ra lỗ hổng trong đoạn code này\".", "checks": ["Tạo được project mới, đổi sang MySQL và queue Redis, giải thích từng biến <code>.env<\/code> đã đổi", "Viết được route <code>/users/{user}/posts/{post}<\/code> đảm bảo post thuộc user <strong>và<\/strong> user hiện tại được xem", "Chỉ ra được lỗ hổng trong <code>User::create($request-&gt;all())<\/code> khi model có <code>$guarded = []<\/code>"], "children": [{"label": "Skeleton từ Laravel 11", "kind": "topic", "children": []}, {"label": "Routing và route model binding", "kind": "topic", "children": []}, {"label": "Middleware", "kind": "topic", "children": []}, {"label": "Validation và Form Request", "kind": "topic", "children": []}, {"label": "Eloquent cơ bản và mass assignment", "kind": "topic", "children": []}, {"label": "Artisan và công cụ đi kèm", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.1 PHP hiện đại: 8.0 tới 8.5", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Codebase PHP thật thường kẹt ở 7.x hoặc 8.0 và cần nâng cấp. Người phỏng vấn muốn biết bạn theo kịp ngôn ngữ, biết tính năng nào giải bài toán gì, và biết cái gì sẽ vỡ khi nâng bản. Kể được tính năng của 8.4/8.5 kèm ví dụ dùng thật là điểm cộng rõ.", "checks": ["Viết lại một value object PHP 7 (private property + getter + <code>withX()<\/code>) bằng readonly class, property hooks hoặc clone with, và nói cách nào hợp khi nào", "Liệt kê được 3 deprecation sẽ gặp khi nâng một codebase từ 8.1 lên 8.4/8.5", "Giải thích được vì sao Fibers không làm <code>PDO::query()<\/code> thành non-blocking"], "children": [{"label": "Bảng tính năng theo bản (chỉ liệt kê cái hay bị hỏi)", "kind": "topic", "children": []}, {"label": "Enum", "kind": "topic", "children": []}, {"label": "Object bất biến: readonly, property hooks, asymmetric visibility, clone with", "kind": "topic", "children": []}, {"label": "Lazy objects và dynamic property", "kind": "topic", "children": []}, {"label": "Attributes", "kind": "topic", "children": []}, {"label": "Generator và iterator", "kind": "topic", "children": []}, {"label": "Fibers", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.2 PHP-FPM và mô hình share-nothing", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Gần như mọi app PHP production chạy sau PHP-FPM. Sự cố \"502/504 lúc cao điểm\", \"server swap\", \"request treo không bị cắt\" đều nằm ở tầng này. Người phỏng vấn hỏi cách tính <code>pm.max_children<\/code> để xem bạn đã từng vận hành thật hay chỉ viết code.", "checks": ["Tính được <code>pm.max_children<\/code> cho server 8 GB chạy Nginx + FPM + Redis từ số đo thật (bài tập 2)", "Đọc được một dòng slow log và chỉ ra request chậm ở hàm nào", "Giải thích được vì sao request gọi API treo 10 phút mà <code>max_execution_time = 30<\/code> không cắt"], "children": [{"label": "Kiến trúc master, pool, worker", "kind": "topic", "children": []}, {"label": "Mô hình share-nothing", "kind": "topic", "children": []}, {"label": "Process manager (pm)", "kind": "topic", "children": []}, {"label": "Tính pm.max_children", "kind": "topic", "children": []}, {"label": "Timeout và giới hạn", "kind": "topic", "children": []}, {"label": "Quan sát", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.3 OPcache và deploy", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "OPcache là lý do PHP đủ nhanh cho production, và cũng là thủ phạm quen thuộc của sự cố \"deploy xong vẫn chạy code cũ\". Câu hỏi hay gặp: OPcache làm gì, vì sao sau deploy phải reload FPM, vì sao <code>env()<\/code> trả <code>null<\/code>.", "checks": ["Viết được script deploy Laravel đủ bước, giải thích bỏ bước nào thì hỏng gì", "Liệt kê được 5 lý do \"sau deploy vẫn chạy code cũ\" và cách kiểm tra từng lý do", "Đọc được output <code>opcache_get_status()<\/code> và nói cache đã đầy chưa"], "children": [{"label": "PHP chạy một file thế nào", "kind": "topic", "children": []}, {"label": "OPcache", "kind": "topic", "children": []}, {"label": "Deploy kiểu symlink và realpath cache", "kind": "topic", "children": []}, {"label": "Quy trình deploy Laravel", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.4 Lõi Laravel: lifecycle, container, provider, facade", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Service container là trái tim của Laravel: mọi thứ từ controller, facade tới queue job đều đi qua nó. Người phỏng vấn senior Laravel gần như chắc chắn hỏi \"container resolve một class thế nào\", \"facade hoạt động ra sao bên dưới\", và \"<code>register<\/code> khác <code>boot<\/code> thế nào\".", "checks": ["Vẽ được lifecycle từ <code>index.php<\/code> tới terminable middleware, đánh dấu <code>register<\/code>/<code>boot<\/code> ở đâu (bài tập 3)", "Tự viết được container mini 30 dòng có auto-wiring bằng Reflection", "Giải thích được <code>Cache::get()<\/code> đi qua những hàm nào tới Redis", "Nói được singleton trong FPM và trong Octane khác nhau thế nào về vòng đời"], "children": [{"label": "Request lifecycle", "kind": "topic", "children": []}, {"label": "Service container: đăng ký", "kind": "topic", "children": []}, {"label": "Service container: auto-wiring", "kind": "topic", "children": []}, {"label": "Service provider", "kind": "topic", "children": []}, {"label": "Facade", "kind": "topic", "children": []}, {"label": "Chạy sau khi gửi response", "kind": "topic", "children": []}, {"label": "Laravel 13", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.5 Eloquent ở mức làm chủ", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Eloquent là nơi code Laravel dành nhiều thời gian nhất, và cũng là nơi có nhiều hành vi ngầm nhất: event không bắn, scope lọc mất dữ liệu, accessor gây N+1. Người phỏng vấn hay đưa một tình huống \"observer không chạy\" hoặc \"báo cáo thiếu dữ liệu\" để xem bạn biết Eloquent làm gì bên dưới.", "checks": ["Chỉ ra được vì sao observer gửi email khi <code>updated<\/code> không chạy với <code>Order::where(...)-&gt;update()<\/code>", "Bật <code>shouldBeStrict()<\/code> trên một project thật và sửa hết lỗi nó bắn ra", "Thiết kế được polymorphic <code>comments<\/code> có morph map, và nói được cái giá (không có khoá ngoại)"], "children": [{"label": "Relationship nâng cao", "kind": "topic", "children": []}, {"label": "Eager loading nâng cao và strict mode", "kind": "topic", "children": []}, {"label": "Cast, accessor, mutator", "kind": "topic", "children": []}, {"label": "Scope", "kind": "topic", "children": []}, {"label": "Model event và observer", "kind": "topic", "children": []}, {"label": "Soft delete", "kind": "topic", "children": []}, {"label": "Query builder, Eloquent, và kiến trúc", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.6 Queue", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Mọi việc chậm hoặc có thể lỗi (gửi email, gọi API đối tác, xử lý file) đều nên đưa vào queue. Queue cũng là nơi sinh ra các bug khó nhất: job chạy hai lần, job chết không ai biết, worker chạy code cũ. Người phỏng vấn rất hay hỏi quan hệ giữa <code>retry_after<\/code> và <code>timeout<\/code>.", "checks": ["Giải thích được từng bước vì sao job 120 giây với <code>retry_after = 90<\/code> bị chạy hai lần", "Thiết kế được job gọi API bị giới hạn 60 request/phút, idempotent, không chạy trùng theo <code>order_id<\/code> (bài tập 4)", "Viết được cấu hình supervisor cho worker và giải thích <code>stopwaitsecs<\/code>"], "children": [{"label": "Driver và worker", "kind": "topic", "children": []}, {"label": "Cấu hình trên job", "kind": "topic", "children": []}, {"label": "retry_after và timeout", "kind": "topic", "children": []}, {"label": "Idempotent và job thất bại", "kind": "topic", "children": []}, {"label": "Điều phối job: chain, batch, unique job, job middleware", "kind": "topic", "children": []}, {"label": "Model trong job và transaction", "kind": "topic", "children": []}, {"label": "Horizon, restart và supervisor", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.7 Các thành phần khác của Laravel", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Scheduler, cache, event, auth là những phần gần như app nào cũng dùng, và lỗi của chúng chỉ lộ ra khi scale lên nhiều server: task chạy ba lần, session mất, cache stampede. Người phỏng vấn thường hỏi theo kiểu tình huống \"sau khi thêm server thì X bị hỏng\".", "checks": ["Giải thích được vì sao scheduler gửi báo cáo 3 lần sau khi scale lên 3 server và sửa được theo 2 cách", "Chọn đúng giữa <code>defer()<\/code>, queued job và <code>Concurrency::run()<\/code> cho 3 ca: ghi metric, gửi email, gọi 3 API cùng lúc", "Giải thích được Sanctum SPA mode và token mode khác nhau thế nào, khi nào cần Passport"], "children": [{"label": "Scheduler", "kind": "topic", "children": []}, {"label": "Cache", "kind": "topic", "children": []}, {"label": "Session và rate limiting", "kind": "topic", "children": []}, {"label": "Event, notification, broadcasting", "kind": "topic", "children": []}, {"label": "Auth", "kind": "topic", "children": []}, {"label": "Tiện ích mới từ Laravel 11", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "2.8 Chất lượng code PHP: PHPStan, Rector, Pint", "kind": "module", "file": "05-php-laravel.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "PHP không có bước compile kiểm kiểu, nên lỗi kiểu chỉ lộ ra khi code chạy tới, thường là trên production. Static analysis và formatter là cách team PHP giữ chất lượng khi codebase lớn. Câu hỏi hay gặp: \"đưa PHPStan vào codebase cũ thế nào mà không bắt cả team dừng lại\".", "checks": ["Đưa PHPStan + Larastan vào một project, tạo baseline, đặt CI chặn lỗi mới (bài tập 6)", "Chạy Rector nâng một thư mục lên PHP 8.4 và đọc được diff nó sinh ra", "Giải thích được vì sao level 9–10 hay bắn lỗi ở code dùng <code>$request-&gt;input()<\/code> và cách xử lý"], "children": [{"label": "Vì sao cần static analysis", "kind": "topic", "children": []}, {"label": "PHPStan", "kind": "topic", "children": []}, {"label": "Rector", "kind": "topic", "children": []}, {"label": "Formatter", "kind": "topic", "children": []}, {"label": "Kiểm tra khi nâng cấp và test", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.1 Bên trong Zend Engine: zval, refcount, copy-on-write", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Đây là tầng người phỏng vấn senior PHP hay đào tới: \"array được copy khi nào\", \"vì sao <code>&amp;<\/code> không làm nhanh hơn\", \"vì sao gán array 100 MB mà RAM không tăng\". Hiểu zval và copy-on-write giúp bạn đoán đúng chi phí bộ nhớ của code, và là nền để hiểu GC (3.2) và leak trong process sống lâu (3.5).", "checks": ["Vẽ được refcount của một array qua 4 bước: tạo, gán cho biến khác, truyền vào hàm, sửa trong hàm", "Giải thích được vì sao <code>memory_get_usage()<\/code> gần như không tăng khi gán array 100 MB sang biến khác", "Giải thích được vì sao PHP 7 dùng ít RAM hơn PHP 5 hẳn cho cùng một array"], "children": [{"label": "zval: một biến PHP trông thế nào bên trong", "kind": "topic", "children": []}, {"label": "Refcount và copy-on-write", "kind": "topic", "children": []}, {"label": "Reference và vì sao & thường chậm hơn", "kind": "topic", "children": []}, {"label": "Interned string", "kind": "topic", "children": []}, {"label": "Object: handle, không COW", "kind": "topic", "children": []}, {"label": "Hashtable, opcode và VM", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.2 Bộ nhớ và garbage collection", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "PHP quản lý bộ nhớ khác hẳn Java và Go. Trong FPM điều này hầu như vô hình, nhưng trong queue worker hay Octane nó quyết định worker có leak hay không. Câu hỏi hay gặp: \"PHP dọn vòng tham chiếu thế nào, so với GC của Java/Go\".", "checks": ["Viết được script tạo vòng tham chiếu trong vòng lặp, đo memory có và không có <code>gc_collect_cycles()<\/code>", "So sánh được refcount + cycle collector của PHP với tracing GC của Java/Go: ưu, nhược, khi nào mỗi cái gây đau", "Viết được cache theo object bằng <code>WeakMap<\/code> và giải thích vì sao mảng thường thì leak"], "children": [{"label": "Reference counting là cơ chế chính", "kind": "topic", "children": []}, {"label": "Vòng tham chiếu", "kind": "topic", "children": []}, {"label": "Cycle collector", "kind": "topic", "children": []}, {"label": "Weak reference", "kind": "topic", "children": []}, {"label": "Đo bộ nhớ", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.3 OPcache chuyên sâu, preloading, JIT", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Người phỏng vấn hay hỏi \"PHP 8 có JIT rồi, sao app không nhanh hơn\" để xem bạn phân biệt được các tầng tối ưu và biết đo trước khi bật. Preloading và JIT cũng có cái giá vận hành khi deploy mà nhiều người không để ý.", "checks": ["Giải thích được OPcache và JIT khác nhau ở tầng nào, và vì sao JIT ít giúp app CRUD", "Viết được cấu hình ini bật JIT đúng cho PHP 8.4+ và nói cách đo xem có lợi không", "Nói được khi nào preloading đáng dùng và cái giá khi deploy"], "children": [{"label": "OPcache làm thêm những gì", "kind": "topic", "children": []}, {"label": "Preloading", "kind": "topic", "children": []}, {"label": "JIT", "kind": "topic", "children": []}, {"label": "Đối chiếu Java", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.4 PHP-FPM ở mức vận hành", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Module 2.2 là cấu hình FPM. Module này là chẩn đoán khi FPM gặp sự cố trên production: 502 lúc cao điểm, timeout lệch nhau giữa các tầng, chạy FPM trên Kubernetes. Người phỏng vấn senior thường đưa một tình huống sự cố và hỏi bạn xem gì trước, sửa gì trước.", "checks": ["Từ status page và slow log, chẩn đoán được sự cố 502 và đề xuất sửa theo thứ tự ưu tiên", "Vẽ được chuỗi timeout từ load balancer tới HTTP client và giải thích vì sao thứ tự quan trọng", "Nói được một pod FPM trên K8s nên cấu hình <code>pm<\/code> thế nào và vì sao"], "children": [{"label": "Lifecycle ở mức engine", "kind": "topic", "children": []}, {"label": "Đọc status page theo thời gian", "kind": "topic", "children": []}, {"label": "Chẩn đoán 502/504 lúc cao điểm khi CPU không cao", "kind": "topic", "children": []}, {"label": "Chuỗi timeout", "kind": "topic", "children": []}, {"label": "Tách pool và chạy trên container", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.5 Process sống lâu: queue worker, Octane, daemon", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi app lớn, PHP không còn chỉ chạy trong FPM: queue worker, Horizon, Octane, consumer Kafka đều là process sống hàng giờ tới hàng ngày. Ở đó các lợi thế của share-nothing mất đi, và bug kiểu \"user A thấy dữ liệu user B\" hay \"worker RAM tăng tới OOM\" xuất hiện. Đây là chủ đề phân biệt senior với mid rõ nhất.", "checks": ["Liệt kê được 5 chỗ trong codebase của mình sẽ gây state leak nếu bật Octane (bài tập 5)", "Viết được một singleton gây leak user giữa hai request Octane rồi sửa bằng <code>scoped<\/code>", "Mô tả được quy trình tìm leak của queue worker: đo, cô lập job, tìm gốc"], "children": [{"label": "Mất lợi thế share-nothing", "kind": "topic", "children": []}, {"label": "Nguồn leak hay gặp", "kind": "topic", "children": []}, {"label": "Phòng và tìm leak", "kind": "topic", "children": []}, {"label": "Signal và dừng êm", "kind": "topic", "children": []}, {"label": "Octane", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.6 Hiệu năng và profiling", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "\"Endpoint này chậm, bạn làm gì\" là câu hỏi hiệu năng phổ biến nhất. Người phỏng vấn muốn nghe quy trình đo trước sửa sau, biết chọn công cụ nào, và xử lý được bài toán dữ liệu lớn (import/export triệu dòng) mà không hết RAM.", "checks": ["Profile được một endpoint chậm bằng SPX hoặc Xdebug và chỉ ra hàm tốn nhất", "Viết được export 2 triệu dòng với RAM dưới 50 MB và giải thích từng tầng buffer", "Thiết kế được import CSV 5 triệu dòng chạy tiếp được khi lỗi giữa chừng"], "children": [{"label": "Quy trình", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}, {"label": "Đọc file lớn", "kind": "topic", "children": []}, {"label": "Import dữ liệu lớn", "kind": "topic", "children": []}, {"label": "Export dữ liệu lớn", "kind": "topic", "children": []}, {"label": "Gọi nhiều API", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.7 Bảo mật đặc thù PHP", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "PHP có những lỗ hổng mang đặc thù ngôn ngữ mà OWASP chung chung không nói kỹ: object injection qua <code>unserialize<\/code>, magic hash, include file theo input. Người phỏng vấn senior thường hỏi \"vì sao <code>unserialize<\/code> dữ liệu người dùng nguy hiểm\" hoặc đưa đoạn code xác thực webhook để bạn chỉ lỗi.", "checks": ["Giải thích được chuỗi từ <code>unserialize($_COOKIE[...])<\/code> tới RCE qua một gadget cụ thể", "Viết được hàm xác thực chữ ký webhook HMAC đúng (so sánh, encoding, raw body)", "Rà được một cấu hình Nginx + upload và chỉ ra chỗ có thể chạy file PHP bị upload lên"], "children": [{"label": "unserialize và object injection", "kind": "topic", "children": []}, {"label": "APP_KEY", "kind": "topic", "children": []}, {"label": "Include file và upload", "kind": "topic", "children": []}, {"label": "So sánh an toàn: magic hash", "kind": "topic", "children": []}, {"label": "Mật khẩu và số ngẫu nhiên", "kind": "topic", "children": []}, {"label": "Những chỗ khác cần nhớ", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}, {"label": "3.8 So sánh kiến trúc: Laravel, Symfony và ngôn ngữ khác", "kind": "module", "file": "05-php-laravel.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Câu \"vì sao team chọn Laravel\" hay \"Laravel hay Symfony cho dự án này\" kiểm tra bạn có nhìn được điểm mạnh và điểm yếu thật của công cụ mình dùng hằng ngày không. Đối chiếu với Java/Go cũng hay được hỏi khi team dùng nhiều ngôn ngữ.", "checks": ["Trả lời được trong 3 phút \"vì sao team bạn chọn Laravel\" với ít nhất một điểm yếu thật của Laravel", "Giải thích được vì sao container compile của Symfony bắt lỗi wiring sớm hơn Laravel"], "children": [{"label": "Laravel so với Symfony", "kind": "topic", "children": []}, {"label": "Chọn thế nào", "kind": "topic", "children": []}, {"label": "Đối chiếu ngôn ngữ", "kind": "topic", "children": []}], "knowledge": "kien-thuc/05-php-laravel.md"}], "questions": 30, "knowledge": "kien-thuc/05-php-laravel.md", "prio": "★★★ ngôn ngữ chính"}, {"label": "OOP, SOLID, design pattern và clean code", "kind": "file", "file": "08-oop-design.md", "children": [{"label": "1.1 Bốn tính chất OOP và composition over inheritance", "kind": "module", "file": "08-oop-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là câu mở đầu của gần như mọi vòng phỏng vấn OOP. Người phỏng vấn không cần định nghĩa sách vở, họ muốn nghe ví dụ từ nghiệp vụ, rồi hỏi vặn \"vậy getter/setter cho mọi field có phải encapsulation không\". Trong dự án Laravel, hiểu composition giúp bạn tránh dựng các <code>BaseController<\/code>, <code>BaseService<\/code> nhiều tầng mà về sau không ai dám sửa.", "checks": ["Cho một class có setter cho mọi field, chỉ ra được invariant nào có thể bị phá và sửa bằng method nghiệp vụ", "Viết lại được một hierarchy kế thừa để tái dùng code thành composition, và nói được cái được cái mất", "Kể được một trường hợp kế thừa là lựa chọn đúng"], "children": [{"label": "Encapsulation (đóng gói)", "kind": "topic", "children": []}, {"label": "Abstraction (trừu tượng hoá)", "kind": "topic", "children": []}, {"label": "Inheritance (kế thừa)", "kind": "topic", "children": []}, {"label": "Polymorphism (đa hình)", "kind": "topic", "children": []}, {"label": "Composition over inheritance", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Interface, abstract class, trait; overloading và overriding", "kind": "module", "file": "08-oop-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Với dev PHP, câu \"interface, abstract class và trait khác nhau thế nào\" gần như chắc chắn gặp. Chọn sai có hậu quả thật: trait chứa logic nghiệp vụ rải khắp dự án làm code rất khó lần theo. Câu về overloading hay được dùng để hỏi vặn, vì PHP không có overloading.", "checks": ["Chọn được interface, abstract class hay trait cho 3 tình huống cụ thể và giải thích lý do", "Viết được ví dụ hai trait xung đột tên method và giải bằng <code>insteadof<\/code>", "Giải thích được vì sao PHP không có overloading và 3 cách giả lập, kèm nhược điểm của <code>__call<\/code>"], "children": [{"label": "Interface và abstract class", "kind": "topic", "children": []}, {"label": "Interface trong PHP", "kind": "topic", "children": []}, {"label": "Trait trong PHP", "kind": "topic", "children": []}, {"label": "Overloading và overriding", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 SOLID", "kind": "module", "file": "08-oop-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Câu hỏi kinh điển ở mức mid, và người phỏng vấn muốn nghe ví dụ từ code bạn từng viết chứ không phải đọc năm định nghĩa. Laravel được xây quanh các nguyên tắc này (contracts, service provider), nên hiểu SOLID cũng là hiểu vì sao framework trông như vậy.", "checks": ["Với mỗi chữ, lấy được một ví dụ vi phạm <strong>từ code mình từng viết<\/strong> và cách sửa", "Viết được ví dụ vi phạm LSP không dùng hình học", "Refactor được <code>match ($type)<\/code> gọi cổng thanh toán thành interface + registry qua container (bài tập 2)"], "children": [{"label": "S: Single Responsibility Principle (SRP)", "kind": "topic", "children": []}, {"label": "O: Open/Closed Principle (OCP)", "kind": "topic", "children": []}, {"label": "L: Liskov Substitution Principle (LSP)", "kind": "topic", "children": []}, {"label": "I: Interface Segregation Principle (ISP)", "kind": "topic", "children": []}, {"label": "D: Dependency Inversion Principle (DIP)", "kind": "topic", "children": []}, {"label": "SOLID trong Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 DRY, KISS, YAGNI; cohesion và coupling", "kind": "module", "file": "08-oop-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là nhóm nguyên tắc bị hiểu sai nhiều nhất, đặc biệt là DRY. Comment review \"chỗ này trùng, gộp lại đi\" rất phổ biến và cũng rất hay sai. Ở mức senior hay bị hỏi \"vì sao trùng lặp rẻ hơn abstraction sai\".", "checks": ["Phân biệt được trùng lặp ngẫu nhiên và trùng lặp tri thức trên một ví dụ thật", "Kể được một lần gộp code sai và cách tháo ra (inline lại rồi tách theo đúng lý do thay đổi)"], "children": [{"label": "DRY (Don't Repeat Yourself)", "kind": "topic", "children": []}, {"label": "Khi nào không nên gộp", "kind": "topic", "children": []}, {"label": "KISS và YAGNI", "kind": "topic", "children": []}, {"label": "Cohesion và coupling", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 OOP hiện đại trong PHP", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Nhiều câu hỏi như \"getter/setter hay public property\", \"value object viết thế nào\" có câu trả lời khác hẳn từ PHP 8.1 trở đi. Người phỏng vấn dùng chúng để xem bạn có cập nhật ngôn ngữ không, và code Laravel mới (enum cast, DTO readonly) dùng các tính năng này hằng ngày.", "checks": ["Viết được enum <code>OrderStatus<\/code> backed string, có method <code>canTransitionTo()<\/code>, dùng làm cast Eloquent", "Viết được value object readonly có method <code>withX()<\/code> trả object mới, theo cả cách PHP 8.2 và PHP 8.5", "Bảo vệ được lựa chọn giữa public property + hook, asymmetric visibility và method nghiệp vụ cho một entity cụ thể", "Chỉ ra được vì sao một readonly class chứa <code>array<\/code> hoặc object vẫn chưa thật sự immutable"], "children": [{"label": "Enum (8.1)", "kind": "topic", "children": []}, {"label": "readonly property (8.1) và readonly class (8.2)", "kind": "topic", "children": []}, {"label": "Viết gọn: constructor promotion, named argument, first-class callable", "kind": "topic", "children": []}, {"label": "Property hooks và asymmetric visibility (8.4)", "kind": "topic", "children": []}, {"label": "Getter/setter hay public property", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Creational patterns", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là nhóm pattern về cách tạo object. Hai câu hay gặp nhất là \"Singleton tốt hay xấu\" và \"<code>Carbon::parse()<\/code> có phải Factory Method không\". Nếu dự án chạy Laravel Octane, hiểu singleton sai nghĩa là rò dữ liệu của user này sang user khác, không còn là chuyện lý thuyết.", "checks": ["Giải thích được vì sao <code>Calendar.getInstance()<\/code> là static factory chứ không phải Factory Method, và chỉ ra một Factory Method thật trong Laravel", "Chỉ ra được một singleton trong app Laravel của mình sẽ rò dữ liệu giữa request khi chạy Octane", "Viết được functional options trong Go và builder trong PHP cho cùng một object cấu hình"], "children": [{"label": "Design pattern và nhóm creational", "kind": "topic", "children": []}, {"label": "Singleton", "kind": "topic", "children": []}, {"label": "Octane và state theo request", "kind": "topic", "children": []}, {"label": "Factory Method và static factory", "kind": "topic", "children": []}, {"label": "Abstract Factory và Builder", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Structural patterns", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Nhóm pattern về cách ghép object, gặp hằng ngày khi bọc SDK bên thứ ba hay thêm cache cho repository mà không sửa code gọi. Người phỏng vấn rất hay hỏi \"Decorator và Proxy khác gì\", \"Facade của Laravel có phải Facade GoF không\", \"middleware là pattern gì\".", "checks": ["Viết được <code>CachedOrderRepository<\/code> bọc repository thật và đăng ký bằng <code>extend()<\/code> mà không sửa code gọi", "Giải thích được <code>Cache::get()<\/code> đi qua những bước nào để tới object thật", "Viết cùng một middleware log thời gian bằng Go (Decorator) và PHP (Pipeline), rồi so sánh (bài tập 3)"], "children": [{"label": "Adapter", "kind": "topic", "children": []}, {"label": "Facade (theo GoF)", "kind": "topic", "children": []}, {"label": "Decorator", "kind": "topic", "children": []}, {"label": "Proxy", "kind": "topic", "children": []}, {"label": "Composite", "kind": "topic", "children": []}, {"label": "Hai chữ dễ nhầm trong Laravel", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Behavioral patterns", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Nhóm pattern về cách chia hành vi, và Laravel dùng gần như tất cả: queue job, event, middleware, driver. Hay bị hỏi \"Strategy và State khác gì\", \"Observer có bẫy gì\". Ở mức senior, Visitor và cách Java 21 thay thế nó là câu phân loại ứng viên.", "checks": ["Nhận ra được 5 pattern trong mã nguồn Laravel và ghi đường dẫn file (bài tập 4)", "Viết được cùng một phép tính (diện tích, hoặc tính phí cho các loại đơn) theo Visitor và theo sealed + pattern matching / enum + <code>match<\/code>, và nói hướng mở rộng nào dễ ở mỗi cách", "Mô hình hoá được trạng thái đơn hàng bằng State pattern hoặc enum có <code>canTransitionTo()<\/code>, và chọn được cách nào cho bài toán cụ thể"], "children": [{"label": "Strategy và Template Method", "kind": "topic", "children": []}, {"label": "State", "kind": "topic", "children": []}, {"label": "Observer", "kind": "topic", "children": []}, {"label": "Command và Chain of Responsibility", "kind": "topic", "children": []}, {"label": "Iterator", "kind": "topic", "children": []}, {"label": "Visitor và cách thay thế hiện đại", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Pattern tầng dữ liệu", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Có nên dùng Repository trong Laravel không\" là tranh luận gặp ở hầu hết các đội PHP, và là câu phỏng vấn phổ biến. Hiểu Eloquent thiếu gì so với Doctrine hay Hibernate giúp bạn tránh bug khi một nghiệp vụ sửa nhiều model cùng lúc.", "checks": ["Tranh luận được \"có nên dùng Repository trong Laravel\" với cả hai phía, gắn với một dự án cụ thể", "Giải thích được hệ quả của việc Eloquent không có Unit of Work và Identity Map khi sửa nhiều model trong một nghiệp vụ", "Viết được DTO readonly cho một request tạo đơn và map từ FormRequest sang DTO"], "children": [{"label": "Active Record và Data Mapper", "kind": "topic", "children": []}, {"label": "Repository", "kind": "topic", "children": []}, {"label": "Unit of Work và Identity Map", "kind": "topic", "children": []}, {"label": "DTO", "kind": "topic", "children": []}, {"label": "Specification", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 DI, IoC container và Service Locator", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Service container là trái tim của Laravel: controller, job, listener đều được nó tạo ra. Hiểu nó giúp bạn viết code test được và đọc được framework. Câu hỏi hay gặp là \"DI và Service Locator khác gì\" và \"Facade thuộc loại nào\".", "checks": ["Phân biệt được DIP, DI và IoC container trong một câu mỗi cái", "Viết được contextual binding: hai controller nhận hai implementation khác nhau của cùng interface", "Chỉ ra được chỗ dùng Facade trong domain logic của dự án mình và viết lại bằng constructor injection"], "children": [{"label": "IoC và DI", "kind": "topic", "children": []}, {"label": "Các cách inject", "kind": "topic", "children": []}, {"label": "Laravel container", "kind": "topic", "children": []}, {"label": "Service Locator", "kind": "topic", "children": []}, {"label": "Facade và helper của Laravel", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Value object, immutability, Law of Demeter", "kind": "module", "file": "08-oop-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Tiền, email, khoảng thời gian là nơi bug nghiệp vụ hay xảy ra nhất, và value object là cách chặn bug ngay khi tạo dữ liệu. Carbon mutable là bẫy mà hầu như dev Laravel nào cũng từng dính. Law of Demeter và tell don't ask hay được hỏi để xem bạn giữ invariant ở đâu.", "checks": ["Viết được <code>Money<\/code> chia đều cho N người không mất đồng nào, không dùng <code>float<\/code> (bài tập 5)", "Tái hiện được bug do Carbon mutable trong một hàm tính hạn thanh toán", "Viết lại được một đoạn \"ask then set\" thành method nghiệp vụ giữ invariant"], "children": [{"label": "Value object", "kind": "topic", "children": []}, {"label": "Immutability", "kind": "topic", "children": []}, {"label": "Hai bẫy trong PHP", "kind": "topic", "children": []}, {"label": "Law of Demeter", "kind": "topic", "children": []}, {"label": "Tell don't ask và command-query separation", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Clean code và code smell", "kind": "module", "file": "08-oop-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Ở mức senior, bạn là người review code của người khác, và cần gọi đúng tên vấn đề thay vì nói \"code này khó đọc\". Câu phỏng vấn thường cho một đoạn controller dài rồi hỏi \"bạn thấy gì và sửa theo thứ tự nào\".", "checks": ["Liệt kê được code smell trong controller/service dài nhất dự án mình và kế hoạch refactor từng bước (bài tập 1)", "Gọi đúng tên smell và kỹ thuật refactoring tương ứng khi review PR của người khác"], "children": [{"label": "Đặt tên", "kind": "topic", "children": []}, {"label": "Hàm", "kind": "topic", "children": []}, {"label": "Tham số", "kind": "topic", "children": []}, {"label": "Code smell và hướng sửa", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Refactoring và code legacy", "kind": "module", "file": "08-oop-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Hầu hết dự án PHP lâu năm có những file không ai dám sửa. Senior được kỳ vọng cải thiện chúng mà không làm hỏng production. Câu \"refactor module legacy không có test thế nào\" rất hay gặp, và trả lời \"viết lại từ đầu\" là red flag.", "checks": ["Viết được characterization test cho một hàm legacy không hiểu hết, rồi refactor nó qua ít nhất 5 commit nhỏ", "Chỉ ra được 3 loại seam trong một class gọi thẳng <code>new StripeClient()<\/code> và <code>DB::table()<\/code>", "Lập được kế hoạch tách <code>OrderService<\/code> 2.500 dòng mà mỗi bước một PR deploy được"], "children": [{"label": "Refactoring là gì", "kind": "topic", "children": []}, {"label": "Các kỹ thuật cơ bản", "kind": "topic", "children": []}, {"label": "Kỷ luật khi refactor", "kind": "topic", "children": []}, {"label": "Code legacy không có test", "kind": "topic", "children": []}, {"label": "Thay đổi lớn và công cụ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Anti-pattern và over-engineering", "kind": "module", "file": "08-oop-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Người phỏng vấn senior ít hỏi định nghĩa SOLID, họ hỏi \"khi nào bạn quyết định <strong>không<\/strong> dùng nó\". Over-engineering làm dự án Laravel nhỏ thành 15 file cho một tính năng CRUD, và senior phải biết cân chi phí đó với lợi ích.", "checks": ["Kể được một lần mình <strong>không<\/strong> áp SOLID/pattern vì chi phí lớn hơn lợi ích, và kết quả sau đó", "Đề xuất được quy ước đội về khi nào tạo interface, có tiêu chí cụ thể", "Bảo vệ được cả hai phía của tranh luận anemic domain model trong 3 phút"], "children": [{"label": "SOLID để quản lý thay đổi", "kind": "topic", "children": []}, {"label": "Dấu hiệu áp quá tay", "kind": "topic", "children": []}, {"label": "Premature abstraction", "kind": "topic", "children": []}, {"label": "Anemic domain model", "kind": "topic", "children": []}, {"label": "God object", "kind": "topic", "children": []}, {"label": "Khi nào interface đáng có", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Đối chiếu thiết kế giữa PHP, Java và Go", "kind": "module", "file": "08-oop-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Người làm PHP chuyển sang hoặc làm thêm Java, Go rất dễ mang nguyên thói quen cũ sang (ví dụ viết interface lớn phía cung cấp trong Go). Người phỏng vấn đa ngôn ngữ hay hỏi \"Go không có kế thừa thì bạn viết pattern X thế nào\".", "checks": ["Viết được Template Method và Decorator bằng Go mà không có kế thừa", "Giải thích được vì sao interface trong Go nên do bên dùng định nghĩa, còn PHP/Java thường do bên cung cấp"], "children": [{"label": "Bảng so sánh", "kind": "topic", "children": []}, {"label": "Interface trong Go", "kind": "topic", "children": []}, {"label": "Pattern là cách bù cho thứ ngôn ngữ thiếu", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 27, "knowledge": "", "prio": "★★"}, {"label": "Java, JVM và Spring", "kind": "file", "file": "06-java-spring.md", "children": [{"label": "1.1 Ngôn ngữ cốt lõi", "kind": "module", "file": "06-java-spring.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Các câu vặn kiểu <code>==<\/code> với <code>Integer<\/code> hay <code>equals<\/code>/<code>hashCode<\/code> là bộ lọc junior kinh điển của phỏng vấn Java. Với người từ PHP, nhiều chỗ ngược trực giác: ở PHP <code>==<\/code>/<code>===<\/code> với số và chuỗi là so giá trị, còn ở Java <code>==<\/code> với object là so xem có phải cùng một object không.", "checks": ["Giải thích được vì sao <code>Integer a = 128, b = 128; a == b<\/code> là <code>false<\/code>", "Viết được một class làm key <code>HashMap<\/code> đúng hợp đồng, rồi chứng minh bằng code rằng sửa field sau khi put làm <code>get<\/code> trả <code>null<\/code>", "Giải thích được \"Java pass-by-value\" bằng ví dụ gán lại tham số so với sửa field"], "children": [{"label": "Primitive và wrapper", "kind": "topic", "children": []}, {"label": "Tiền: BigDecimal", "kind": "topic", "children": []}, {"label": "String", "kind": "topic", "children": []}, {"label": "equals và hashCode", "kind": "topic", "children": []}, {"label": "Truyền tham số", "kind": "topic", "children": []}, {"label": "final, static, inner class, interface", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Exception, lambda, Stream, Optional", "kind": "module", "file": "06-java-spring.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Code Java hiện đại dày đặc lambda và Stream, và review code hay bắt lỗi ở đây. Checked exception là khác biệt lớn nhất so với PHP, và ảnh hưởng trực tiếp tới việc <code>@Transactional<\/code> có rollback hay không (module 2.4).", "checks": ["Viết được try-with-resources với hai resource và nói thứ tự <code>close()<\/code> cùng chỗ exception phụ nằm", "Chỉ ra được 3 lỗi trong một đoạn Stream có side effect, <code>toMap<\/code> trùng key và <code>orElse<\/code> tốn kém"], "children": [{"label": "Cây exception", "kind": "topic", "children": []}, {"label": "try-with-resources và finally", "kind": "topic", "children": []}, {"label": "Lambda và Stream", "kind": "topic", "children": []}, {"label": "Optional", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Collections cơ bản", "kind": "module", "file": "06-java-spring.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "PHP chỉ có một kiểu <code>array<\/code> làm mọi việc. Java tách thành nhiều cấu trúc riêng, chọn sai thì chậm hoặc sai hành vi. Các câu hay gặp: <code>ArrayList<\/code> hay <code>LinkedList<\/code>, viết LRU cache, vì sao có <code>ConcurrentModificationException<\/code> khi chỉ có một thread.", "checks": ["Viết được LRU cache bằng <code>LinkedHashMap<\/code> trong 10 dòng (bài tập 1)", "Tái hiện được <code>ConcurrentModificationException<\/code> trong một thread và sửa theo hai cách (bài tập 2)"], "children": [{"label": "List và queue", "kind": "topic", "children": []}, {"label": "Map và Set", "kind": "topic", "children": []}, {"label": "ConcurrentModificationException", "kind": "topic", "children": []}, {"label": "Collection không sửa được", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Spring và Spring Boot cơ bản", "kind": "module", "file": "06-java-spring.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Spring Boot là fra 5 database/sql và JSON", "kind": "module", "file": "07-go.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Gần như service Go nào cũng dùng hai package này. Pool DB cạn vì quên đóng <code>rows<\/code>, và ID lớn bị sai khi decode JSON, là hai lỗi production kinh điển.", "checks": ["Đọc <code>db.Stats()<\/code> (InUse, WaitCount) và chỉ ra được pool đang cạn vì đâu", "Chỉ ra được 3 lỗi trong một hàm transaction dùng lẫn <code>db<\/code> và <code>tx<\/code>, return sớm quên close rows"], "children": [{"label": "sql.DB là pool", "kind": "topic", "children": []}, {"label": "Query và rows", "kind": "topic", "children": []}, {"label": "Transaction", "kind": "topic", "children": []}, {"label": "Thư viện", "kind": "topic", "children": []}, {"label": "JSON", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Testing nâng cao", "kind": "module", "file": "07-go.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Go có sẵn benchmark, fuzzing và công cụ test code đồng thời ngay trong <code>go test<\/code>. Senior Go được kỳ vọng đo trước khi tối ưu, và test được code có timeout mà không làm test chậm.", "checks": ["Viết được benchmark so sánh <code>strings.Builder<\/code> với <code>+=<\/code> bằng <code>b.Loop<\/code>, đọc được <code>ns/op<\/code> và <code>allocs/op<\/code>", "Viết được một fuzz test tìm ra bug trong hàm parse tự viết", "Test được một hàm retry có backoff 30 giây bằng <code>synctest<\/code> mà test chạy dưới 1 giây"], "children": [{"label": "Benchmark", "kind": "topic", "children": []}, {"label": "Fuzzing", "kind": "topic", "children": []}, {"label": "testing/synctest", "kind": "topic", "children": []}, {"label": "Race, leak, coverage", "kind": "topic", "children": []}, {"label": "Integration test", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Logging với log/slog", "kind": "module", "file": "07-go.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Log có cấu trúc là điều kiện để tìm được log trên production. Go có sẵn <code>log/slog<\/code> từ 1.21, không cần thư viện ngoài như Monolog. Hay được hỏi cùng chuyện gắn request ID vào mọi dòng log.", "checks": ["Viết được middleware gắn request ID vào mọi dòng log của request đó, output JSON", "Che được field <code>password<\/code> trong log bằng <code>LogValuer<\/code>"], "children": [{"label": "slog cơ bản", "kind": "topic", "children": []}, {"label": "Handler", "kind": "topic", "children": []}, {"label": "Gắn request ID và trace ID", "kind": "topic", "children": []}, {"label": "Bẫy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Project layout và module", "kind": "module", "file": "07-go.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Go không có cấu trúc thư mục cố định như Laravel, nên câu \"bạn tổ chức project thế nào\" rất hay gặp. Go modules cũng giải dependency theo cách khác hẳn Composer.", "checks": ["Cho một cây thư mục có <code>internal/<\/code>, nói đúng package nào import được", "So sánh được MVS với cách Composer giải dependency và vai trò của <code>composer.lock<\/code>"], "children": [{"label": "Cấu trúc thư mục", "kind": "topic", "children": []}, {"label": "go.mod và go.sum", "kind": "topic", "children": []}, {"label": "Minimal version selection", "kind": "topic", "children": []}, {"label": "Lệnh và directive", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Scheduler G-M-P", "kind": "module", "file": "07-go.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "\"Vì sao 100.000 goroutine không cần 100.000 thread\" là câu senior Go kinh điển. Hiểu scheduler giải thích vì sao Go xử lý I/O tốt, và giúp đọc được trace ở module 3.3.", "checks": ["Vẽ được G-M-P và kể được chuyện gì xảy ra khi một goroutine gọi syscall đọc file chặn 2 giây", "Giải thích được vì sao 100.000 goroutine chờ HTTP không cần 100.000 thread"], "children": [{"label": "Ba thành phần G, M, P", "kind": "topic", "children": []}, {"label": "Phân việc", "kind": "topic", "children": []}, {"label": "Khi goroutine bị chặn", "kind": "topic", "children": []}, {"label": "Preemption", "kind": "topic", "children": []}, {"label": "Đối chiếu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Bộ nhớ: escape analysis và GC", "kind": "module", "file": "07-go.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Service Go tốn RAM hoặc CPU cao vì GC thường bắt nguồn từ allocation. Câu hỏi về <code>GOGC<\/code> và <code>GOMEMLIMIT<\/code> hay đi kèm chủ đề chạy trên Kubernetes. PHP-FPM ít cần biết chuyện này vì worker chết là trả hết RAM.", "checks": ["Đọc được output <code>-gcflags=-m<\/code> và giải thích vì sao một biến escape", "Nói được <code>GOGC=200<\/code> và <code>GOMEMLIMIT=900MiB<\/code> mỗi cái đổi gì, và khi nào kết hợp cả hai"], "children": [{"label": "Stack, heap và escape analysis", "kind": "topic", "children": []}, {"label": "GC của Go", "kind": "topic", "children": []}, {"label": "GOGC và GOMEMLIMIT", "kind": "topic", "children": []}, {"label": "Giảm áp lực GC", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Profiling và chẩn đoán", "kind": "module", "file": "07-go.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "\"Service chậm hoặc RAM tăng, bạn làm gì\" là câu senior rất phổ biến. Go có sẵn pprof và trace, nên người phỏng vấn mong bạn đo bằng công cụ chứ không đoán.", "checks": ["Từ goroutine profile của một service leak, chỉ ra được dòng code đang kẹt", "Phân biệt được khi nào nhìn <code>inuse_space<\/code> và khi nào nhìn <code>alloc_space<\/code>"], "children": [{"label": "pprof", "kind": "topic", "children": []}, {"label": "trace", "kind": "topic", "children": []}, {"label": "PGO", "kind": "topic", "children": []}, {"label": "Quy trình chẩn đoán", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Go trong container", "kind": "module", "file": "07-go.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Chuyển service Go lên Kubernetes rồi thấy p99 tăng là sự cố hay gặp và là câu hỏi senior phổ biến. Nguyên nhân nằm ở cách Go đếm CPU, và ở việc Go không tự biết memory limit.", "checks": ["Giải thích được vì sao p99 tăng gấp đôi khi chuyển từ VM sang pod limit 2 CPU trên Go 1.24, và vì sao Go 1.25+ thường không còn gặp", "Cấu hình được <code>GOMEMLIMIT<\/code> cho pod limit 1 GiB và nói lý do để khoảng trống"], "children": [{"label": "CPU và GOMAXPROCS", "kind": "topic", "children": []}, {"label": "Memory", "kind": "topic", "children": []}, {"label": "Image", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 22, "knowledge": "", "prio": "★ khi JD có Go"}]}, {"label": "Giao tiếp giữa các hệ thống", "kind": "group", "children": [{"label": "Thiết kế API", "kind": "file", "file": "09-api-design.md", "children": [{"label": "1.1 Resource và method semantics", "kind": "module", "file": "09-api-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mỗi route bạn khai trong <code>routes/api.php<\/code> là một quyết định thiết kế: đặt tên URL thế nào, dùng method nào. Chọn sai method không chỉ xấu mà còn gây bug thật, vì proxy, trình duyệt và thư viện HTTP tự retry hay cache dựa trên method. Câu \"PUT khác PATCH thế nào, cái nào idempotent\" gần như luôn có ở vòng đầu.", "checks": ["Thiết kế được bộ endpoint cho <code>orders<\/code> gồm huỷ, hoàn tiền, đổi địa chỉ mà không dùng động từ trong path tuỳ tiện", "Giải thích được vì sao PUT idempotent còn PATCH thì tuỳ, với ví dụ cụ thể", "Viết được cùng một thay đổi bằng Merge Patch và JSON Patch, chỉ ra trường hợp Merge Patch không diễn đạt được (sửa một phần tử mảng)"], "children": [{"label": "Resource và cách đặt URL", "kind": "topic", "children": []}, {"label": "Hành động không khớp CRUD", "kind": "topic", "children": []}, {"label": "Ba tính chất của method", "kind": "topic", "children": []}, {"label": "PUT và PATCH", "kind": "topic", "children": []}, {"label": "Đào sâu (🟡)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Status code", "kind": "module", "file": "09-api-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Status code là thứ đầu tiên mà monitoring, load balancer, SDK của client và code retry nhìn vào. Trả sai code thì dashboard báo \"mọi thứ ổn\" trong khi user đang lỗi, hoặc client retry một request không nên retry. Người phỏng vấn thích hỏi các cặp dễ nhầm như <code>401<\/code>/<code>403<\/code>, <code>400<\/code>/<code>422<\/code>.", "checks": ["Cho 15 tình huống lỗi, chọn đúng status code và giải thích được các cặp hay nhầm", "Nói được client nên retry những code nào và vì sao <code>500<\/code> của POST không được retry mù"], "children": [{"label": "Cách đọc nhóm code", "kind": "topic", "children": []}, {"label": "2xx: thành công", "kind": "topic", "children": []}, {"label": "3xx: chuyển hướng", "kind": "topic", "children": []}, {"label": "4xx: lỗi phía client", "kind": "topic", "children": []}, {"label": "5xx: lỗi phía server", "kind": "topic", "children": []}, {"label": "Các cặp hay nhầm", "kind": "topic", "children": []}, {"label": "Client nên retry code nào", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Format lỗi thống nhất", "kind": "module", "file": "09-api-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Khi mỗi endpoint trả lỗi một kiểu, frontend và mobile phải viết code xử lý riêng cho từng chỗ, và support không tra được lỗi khách báo. Trong Laravel, lỗi validation, lỗi 404 của model và exception tự viết mặc định ra ba hình dạng khác nhau. Người phỏng vấn hay hỏi \"client nên dựa vào đâu để xử lý lỗi\".", "checks": ["Viết được handler trong Laravel biến <code>ValidationException<\/code>, <code>ModelNotFoundException<\/code>, <code>AuthorizationException<\/code> thành problem+json", "Giải thích được vì sao client không nên <code>if (message == \"...\")<\/code>"], "children": [{"label": "Chuẩn RFC 9457 Problem Details", "kind": "topic", "children": []}, {"label": "Client dựa vào mã lỗi, không dựa vào câu chữ", "kind": "topic", "children": []}, {"label": "Trace id để tra log", "kind": "topic", "children": []}, {"label": "Không lộ chi tiết nội bộ", "kind": "topic", "children": []}, {"label": "Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Filtering, sorting, pagination", "kind": "module", "file": "09-api-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Gần như mọi màn hình danh sách đều gọi một endpoint có lọc, sắp xếp và phân trang. Làm sai thì trang sâu chậm dần theo dữ liệu, hoặc user thấy lặp và sót dòng khi cuộn feed. Câu \"offset khác cursor thế nào, cursor chứa gì\" rất hay gặp ở mức mid.", "checks": ["Thiết kế được cursor cho sort <code>-created_at<\/code> và viết query SQL tương ứng có tie-breaker", "Nói được khi nào vẫn chọn offset (admin cần nhảy trang) và cách giảm chi phí <code>COUNT(*)<\/code>"], "children": [{"label": "Quy ước tham số query", "kind": "topic", "children": []}, {"label": "Offset và cursor", "kind": "topic", "children": []}, {"label": "Cursor chứa gì", "kind": "topic", "children": []}, {"label": "Trả metadata phân trang", "kind": "topic", "children": []}, {"label": "Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Idempotency key và retry an toàn", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Mạng mobile chập chờn, Guzzle hay SDK tự retry, user bấm \"Thanh toán\" hai lần. Không có cơ chế idempotency thì hệ thống tạo trùng đơn hoặc trừ tiền hai lần. Câu \"user bấm thanh toán hai lần thì sao\" gần như chắc chắn gặp, và người phỏng vấn sẽ đào tới \"hai request trùng đến cùng lúc thì sao\".", "checks": ["Vẽ được luồng xử lý khi request thứ hai đến lúc request đầu còn <code>processing<\/code>, và khi server crash giữa chừng", "Thiết kế được bảng <code>idempotency_keys<\/code> (cột, unique, index, TTL) cho <code>POST /payments<\/code> (bài tập 2)", "Giải thích được vì sao idempotency key không thay được unique constraint nghiệp vụ"], "children": [{"label": "Vấn đề", "kind": "topic", "children": []}, {"label": "Idempotency key", "kind": "topic", "children": []}, {"label": "Server lưu gì", "kind": "topic", "children": []}, {"label": "Luồng xử lý", "kind": "topic", "children": []}, {"label": "Khi server crash giữa chừng", "kind": "topic", "children": []}, {"label": "Lưu bao lâu", "kind": "topic", "children": []}, {"label": "Các lớp phòng thủ khác", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Ghi đồng thời, bulk, long-running operation", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Trang admin có hai nhân viên cùng sửa một sản phẩm, import file Excel nghìn dòng, export báo cáo mất 10 phút: đây là việc hằng ngày của backend PHP. Làm sai thì mất dữ liệu âm thầm, hoặc request treo tới khi PHP-FPM và Nginx cắt ngang. Người phỏng vấn hay hỏi \"hai người cùng sửa, một người mất thay đổi\" và \"thiết kế API cho thao tác chạy lâu\".", "checks": ["Viết được luồng <code>ETag<\/code>/<code>If-Match<\/code> đầu-cuối từ API tới SQL, và nói UI hiển thị gì khi <code>412<\/code>", "Thiết kế được API export báo cáo 10 phút: endpoint, status, cách client biết khi xong, cách dọn file kết quả"], "children": [{"label": "Lost update khi hai người cùng sửa", "kind": "topic", "children": []}, {"label": "Optimistic concurrency bằng ETag và If-Match", "kind": "topic", "children": []}, {"label": "Bulk: nhiều item trong một request", "kind": "topic", "children": []}, {"label": "Long-running operation (LRO)", "kind": "topic", "children": []}, {"label": "Content negotiation", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Rate limiting, auth và CORS", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Ba thứ này nằm ở cửa vào của mọi API. Rate limit sai thì một client lỗi vòng lặp làm sập cả hệ thống. CORS là lỗi mà frontend báo backend nhiều nhất (\"GET chạy mà PUT lỗi CORS\"), và cũng là chủ đề hay bị hiểu nhầm là cơ chế bảo mật của server.", "checks": ["Tái hiện được lỗi CORS khi gọi <code>PUT<\/code> từ trình duyệt và sửa ở server", "Giải thích được vì sao cấu hình CORS sai không phải lỗ hổng phía server nhưng phản chiếu <code>Origin<\/code> kèm credentials lại là lỗ hổng"], "children": [{"label": "Rate limiting", "kind": "topic", "children": []}, {"label": "Auth: xác thực client", "kind": "topic", "children": []}, {"label": "Chống DoS ở tầng API", "kind": "topic", "children": []}, {"label": "CORS: là gì và không là gì", "kind": "topic", "children": []}, {"label": "Simple request và preflight", "kind": "topic", "children": []}, {"label": "Các header CORS", "kind": "topic", "children": []}, {"label": "Cạm bẫy CORS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Webhook", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Dự án PHP nào cũng nhận webhook (cổng thanh toán, vận chuyển, Zalo, Stripe) và nhiều dự án phải gửi webhook cho đối tác. Webhook là chỗ hay mất tiền: xử lý trùng một event thanh toán, hoặc tin một request giả mạo. Câu \"thiết kế webhook\" và \"đối tác nói không nhận được webhook\" rất hay gặp ở mức mid.", "checks": ["Viết được đặc tả webhook <code>order.paid<\/code> cho đối tác: payload, header, verify, retry, cam kết thứ tự (bài tập 3)", "Viết được endpoint nhận webhook trong Laravel verify trên raw body (<code>$request-&gt;getContent()<\/code>) và idempotent theo <code>event_id<\/code>"], "children": [{"label": "Webhook là gì", "kind": "topic", "children": []}, {"label": "Bên gửi: lưu và gửi", "kind": "topic", "children": []}, {"label": "Bên gửi: retry", "kind": "topic", "children": []}, {"label": "Bên gửi: ký request", "kind": "topic", "children": []}, {"label": "Bên gửi: cạm bẫy", "kind": "topic", "children": []}, {"label": "Bên nhận", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Gọi API bên thứ ba", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Cổng thanh toán, SMS, vận chuyển, AI: dự án nào cũng gọi API bên ngoài, và bên ngoài thì sớm muộn cũng chậm hoặc chết. Với PHP-FPM, một provider treo không có timeout sẽ giữ worker, hết worker là cả site đứng. Câu \"tích hợp một API hay chết thì thiết kế lớp gọi thế nào\" là câu thiết kế thực tế rất hay gặp.", "checks": ["Viết được lớp gọi một provider hay chết trong Laravel: timeout, retry có điều kiện, circuit breaker bằng cache, log, fake trong test", "Tính được thời gian tối đa một request có thể treo với cấu hình timeout và retry hiện tại của dự án mình"], "children": [{"label": "Timeout: luôn đặt", "kind": "topic", "children": []}, {"label": "Retry có điều kiện", "kind": "topic", "children": []}, {"label": "Các pattern chịu lỗi", "kind": "topic", "children": []}, {"label": "Quan sát và kiểm thử", "kind": "topic", "children": []}, {"label": "Timeout không có nghĩa là thất bại", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Tầng Laravel cho API", "kind": "module", "file": "09-api-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là module riêng cho người làm PHP. Người phỏng vấn hay hỏi \"trong Laravel bạn làm việc X thế nào\" để kiểm tra bạn hiểu framework hay chỉ copy mẫu. Các lỗi ở tầng này (lộ field <code>password<\/code>, mass assignment, rate limit đếm sai khi có nhiều server) đều là lỗi production thật.", "checks": ["Viết được <code>OrderResource<\/code> dùng <code>whenLoaded()<\/code> và chứng minh bằng query log là không có N+1", "Giải thích được khi nào chọn Sanctum token, Sanctum SPA cookie hay Passport cho 3 loại client", "Viết được middleware idempotency cho một route <code>POST<\/code>, xử lý đủ 4 nhánh ở 2.1", "Cấu hình được rate limit khác nhau cho user thường, user trả phí và IP chưa đăng nhập"], "children": [{"label": "API Resources: tách hình dạng API khỏi model", "kind": "topic", "childre
