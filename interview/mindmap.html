<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap ôn phỏng vấn</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --text: #1f2328; --muted: #6b7078; --line: #d8d4cc;
  --accent: #b4532a; --hl: #fff1b8; --border: #e6e2da; --shadow: 0 6px 24px rgba(0,0,0,.08);
  --b0: #b4532a; --b1: #2f6f9f; --b2: #4d7c3a; --b3: #8a4f9e; --b4: #a8741a; --b5: #2e7d7a; --b6: #9c3d54; --b7: #5b6472;
  --lv1: #3f9a4a; --lv2: #d9a21b; --lv3: #d0493f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1f2227; --text: #e6e6e3; --muted: #9aa0a8; --line: #3a3e45;
    --accent: #e0835a; --hl: #5a4a12; --border: #30343b; --shadow: 0 6px 24px rgba(0,0,0,.4);
    --b0: #e0835a; --b1: #6aa8d8; --b2: #8cbf72; --b3: #c08fd4; --b4: #d9a948; --b5: #5fb8b3; --b6: #d77a92; --b7: #9aa3b2;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --panel: #1f2227; --text: #e6e6e3; --muted: #9aa0a8; --line: #3a3e45;
  --accent: #e0835a; --hl: #5a4a12; --border: #30343b; --shadow: 0 6px 24px rgba(0,0,0,.4);
  --b0: #e0835a; --b1: #6aa8d8; --b2: #8cbf72; --b3: #c08fd4; --b4: #d9a948; --b5: #5fb8b3; --b6: #d77a92; --b7: #9aa3b2;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 3; padding: 10px 16px 8px;
  background: var(--bg); border-bottom: 1px solid var(--border); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
.stats { color: var(--muted); font-size: 12px; margin-right: auto; }
.search { position: relative; }
input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel); color: var(--text); width: 240px; max-width: 100%; }
#results { position: absolute; top: 36px; right: 0; width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); display: none; z-index: 5; }
#results.open { display: block; }
#results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border);
  border-radius: 0; padding: 8px 12px; background: none; }
#results button:hover, #results button:focus { background: var(--bg); }
#results small { display: block; color: var(--muted); font-size: 11px; }
button { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }
#crumbs { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#crumbs button { border: 0; background: none; padding: 2px 4px; color: var(--accent); font-size: 13px; }
#crumbs button:last-child { color: var(--text); font-weight: 600; cursor: default; }
#crumbs .sep { color: var(--muted); }
#crumbs .hint { margin-left: auto; font-size: 12px; }
#stage { position: fixed; left: 0; right: 0; bottom: 0; }
svg { width: 100%; height: 100%; display: block; }
#view.enter { animation: enter .28s ease-out; transform-origin: center; transform-box: fill-box; }
@keyframes enter { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view.enter { animation: none; } }
.link { fill: none; stroke-width: 1.4; opacity: .5; }
.n { cursor: pointer; }
.n text { fill: var(--text); }
.n .muted { fill: var(--muted); }
.n:hover text, .n:focus text { fill: var(--accent); }
.n:focus { outline: none; }
.n:focus-visible .pill, .n:focus-visible .dot { stroke-width: 3; }
.pill { fill: var(--panel); stroke-width: 1.5; }
.center .pill { stroke-width: 2.5; }
.dot { stroke-width: 2; fill: var(--bg); }
.dot.has { fill: currentColor; }
.leafdot { fill: currentColor; opacity: .7; }
#panel { position: fixed; z-index: 4; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 16px 18px; overflow: auto; display: none; }
#panel.open { display: block; }
#panel h2 { font-size: 16px; margin: 0 28px 4px 0; }
#panel .crumb { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
#panel h3 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
#panel .close { position: absolute; top: 10px; right: 10px; border: 0; background: none; font-size: 20px; line-height: 1; padding: 4px 8px; }
#panel ul { padding-left: 18px; margin: 0; }
#panel li { margin: 4px 0; }
#panel label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
#panel input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); }
#panel code { font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
#panel a { color: var(--accent); }
.progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.progress > div { height: 100%; background: var(--accent); }
@media (max-width: 640px) {
  header h1, .stats { width: 100%; margin: 0; }
  .search, input[type=search] { flex: 1 1 100%; width: 100%; }
  #crumbs .hint { display: none; }
  #panel { left: 16px; right: 16px; width: auto; height: 50vh; }
}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Mindmap ôn phỏng vấn Backend</h1>
    <span class="stats" id="stats"></span>
    <div class="search">
      <input type="search" id="q" placeholder="Tìm chủ đề… (gõ không dấu cũng được)" aria-label="Tìm chủ đề" autocomplete="off">
      <div id="results" role="listbox"></div>
    </div>
    <button id="theme" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">◐</button>
  </div>
  <nav id="crumbs" aria-label="Vị trí hiện tại"></nav>
</header>
<div id="stage"><svg id="svg" role="img" aria-label="Mindmap"><g id="view"></g></svg></div>
<aside id="panel" aria-live="polite"></aside>
<script>
const DATA = {"label": "Ôn phỏng vấn Backend (senior, PHP)", "kind": "root", "children": [{"label": "Nền tảng", "kind": "group", "children": [{"label": "Hệ điều hành và Linux", "kind": "file", "file": "01-os-linux.md", "children": [{"label": "1.1 Process và thread", "kind": "module", "file": "01-os-linux.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "PHP-FPM chạy mỗi request trong một process riêng, còn Java và Go chạy nhiều request trong cùng một process. Khác biệt này quyết định cách bạn tính RAM cho server, vì sao PHP ít gặp race condition trong code, và vì sao cache trong RAM của PHP khó dùng. Câu \"process khác thread thế nào\" gần như luôn được hỏi, và thường bị hỏi tiếp \"vậy PHP chọn cái nào, vì sao\".", "checks": ["Kể được 4 thứ thread dùng chung và 2 thứ riêng của mỗi thread", "Tạo được một zombie bằng code nhỏ, thấy nó trong <code>ps<\/code> và giải thích vì sao <code>kill -9<\/code> zombie không có tác dụng", "Giải thích được vì sao PHP chọn process còn Java/Go chọn thread/goroutine, và cái giá của mỗi bên"], "children": [{"label": "Hai khái niệm", "kind": "topic", "children": []}, {"label": "So sánh (phần hay bị hỏi nhất)", "kind": "topic", "children": []}, {"label": "Khi nào chọn cái nào", "kind": "topic", "children": []}, {"label": "Vòng đời của process", "kind": "topic", "children": []}, {"label": "Đào sâu (🔴, học sau khi đã vững phần trên)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Bộ nhớ cơ bản", "kind": "module", "file": "01-os-linux.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi câu hỏi \"server còn bao nhiêu RAM\", \"đặt <code>pm.max_children<\/code> bao nhiêu\", \"vì sao process Java chiếm 10 GB\" đều cần hiểu process dùng bộ nhớ thế nào. Người mới hay đọc sai <code>free<\/code> và <code>top<\/code> rồi kết luận \"hết RAM\" khi máy vẫn ổn, hoặc cộng RSS của 50 worker PHP-FPM ra một con số lớn hơn cả RAM máy. Phỏng vấn thường hỏi \"VSZ và RSS khác gì\", \"stack và heap khác gì\".", "checks": ["Giải thích được vì sao một process Java có VSZ 10 GB mà RSS chỉ 500 MB", "Nhìn <code>free -h<\/code> của một server thật và nói được còn bao nhiêu RAM dùng được", "Đo được PSS và RSS của một worker PHP-FPM, giải thích vì sao hai số khác nhau"], "children": [{"label": "Stack và heap", "kind": "topic", "children": []}, {"label": "Virtual memory: mỗi process tưởng mình có cả bộ nhớ", "kind": "topic", "children": []}, {"label": "Đọc đúng các con số bộ nhớ", "kind": "topic", "children": []}, {"label": "Page cache và lệnh free", "kind": "topic", "children": []}, {"label": "Overcommit", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 File system và permission", "kind": "module", "file": "01-os-linux.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Deploy Laravel bằng symlink, lỗi \"permission denied\" trên <code>storage/<\/code>, disk báo đầy mà <code>df<\/code> vẫn còn chỗ, xoá log mà disk không giảm: đều là kiến thức file system. Phỏng vấn hay hỏi qua sự cố (\"disk đầy mà <code>du<\/code> không thấy\") hoặc hỏi \"<code>chmod 777<\/code> sai ở đâu\".", "checks": ["Tái hiện được: xoá một file đang bị process mở, thấy <code>df<\/code> không giảm, tìm ra bằng <code>lsof +L1<\/code>", "Viết được lệnh đổi symlink <code>current<\/code> atomic và giải thích vì sao <code>ln -sfn<\/code> trực tiếp không atomic", "Đặt được quyền đúng cho thư mục <code>storage/<\/code> và <code>bootstrap/cache/<\/code> của Laravel mà không dùng <code>777<\/code>"], "children": [{"label": "Inode và tên file", "kind": "topic", "children": []}, {"label": "Hard link và symlink", "kind": "topic", "children": []}, {"label": "Permission", "kind": "topic", "children": []}, {"label": "Xoá file chỉ là xoá tên", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Linux thực hành", "kind": "module", "file": "01-os-linux.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Khi production có sự cố, bạn thường chỉ có một cửa sổ SSH và vài phút. Biết lệnh nào trả lời câu hỏi nào ( -linux.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Lỗi <code>too many open files<\/code> là sự cố production rất phổ biến, và gốc thường là leak chứ không phải thiếu limit. Phần epoll giải thích vì sao Nginx, Redis, Node phục vụ được hàng chục nghìn kết nối với vài thread, câu hỏi hay gặp khi so sánh PHP-FPM với các runtime khác.", "checks": ["Viết chương trình mở file không đóng, đặt <code>ulimit -n<\/code> thấp, quan sát lỗi và xác nhận bằng <code>/proc/&lt;pid&gt;/fd<\/code> (bài tập 1)", "Giải thích được edge-triggered treo thế nào nếu chỉ đọc một lần", "Phân biệt được \"tải thật cần nhiều fd\" và \"leak fd\" chỉ bằng đồ thị số fd theo thời gian"], "children": [{"label": "File descriptor và giới hạn", "kind": "topic", "children": []}, {"label": "Điều tra fd", "kind": "topic", "children": []}, {"label": "Ba kiểu I/O", "kind": "topic", "children": []}, {"label": "select, poll, epoll", "kind": "topic", "children": []}, {"label": "Vì sao event loop phục vụ được hàng nghìn kết nối", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Signal và graceful shutdown", "kind": "module", "file": "01-os-linux.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Mỗi lần deploy, scale xuống hay restart pod, process của bạn nhận signal. Xử lý sai là mất request đang chạy, job queue chạy dở, hoặc log bị mất. PHP-FPM còn hiểu signal khác Nginx, bẫy rất hay gặp. Phỏng vấn hay hỏi \"exit code 137 là gì\" và \"graceful shutdown làm thế nào\".", "checks": ["Nói ngay được signal nào cần gửi để PHP-FPM dừng graceful, và điều gì xảy ra nếu gửi SIGTERM", "Viết được cấu hình logrotate cho log Laravel theo cả hai kiểu, và nói kiểu nào có thể mất log", "Vẽ được timeline từ lúc Kubernetes xoá pod tới lúc process chết, ghi rõ mốc SIGTERM, grace period, SIGKILL"], "children": [{"label": "Signal là gì", "kind": "topic", "children": []}, {"label": "PHP-FPM hiểu signal khác Nginx", "kind": "topic", "children": []}, {"label": "Graceful shutdown", "kind": "topic", "children": []}, {"label": "Log rotation và signal", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Bộ nhớ khi vận hành: swap, OOM, leak", "kind": "module", "file": "01-os-linux.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Pod tự nhiên biến mất\", \"server chậm dần rồi đứng\", \"queue worker ăn RAM tăng mãi\": ba sự cố này đều là chuyện bộ nhớ khi vận hành. Người làm PHP còn cần biết <code>memory_limit<\/code> thật ra giới hạn cái gì và tính tổng RAM của PHP-FPM ra sao.", "checks": ["Tìm được dấu vết OOM killer trong <code>dmesg<\/code> trên một máy thật (hoặc tự gây OOM trong container)", "Lập được bảng sizing PHP-FPM cho server 4 GB (bài tập 5) có tính OPcache, OS, Nginx", "Phân biệt được leak thật và cache tăng tới ngưỡng rồi dừng, chỉ bằng đồ thị"], "children": [{"label": "Swap", "kind": "topic", "children": []}, {"label": "OOM killer", "kind": "topic", "children": []}, {"label": "Memory leak khi có GC", "kind": "topic", "children": []}, {"label": "RAM của PHP-FPM", "kind": "topic", "children": []}, {"label": "Điều tra leak", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 systemd, cron, shell script", "kind": "module", "file": "01-os-linux.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Queue worker, scheduler của Laravel, script deploy và backup đều chạy qua systemd, cron và shell. Đây là nơi các lỗi âm thầm nhất xảy ra: cron chạy sai giờ, job chạy hai lần trên hai server, script xoá nhầm cả thư mục gốc. Phỏng vấn hay hỏi \"cron của bạn chạy trên 3 server thì sao\".", "checks": ["Viết được unit file cho <code>queue:work<\/code> có restart, giới hạn fd, dừng graceful trong 60 giây", "Cài được cron chạy 2h sáng giờ Việt Nam trên máy UTC, không chạy trùng (bài tập 3)", "Chỉ ra được 3 lỗi trong một shell script cho sẵn mà không cần chạy nó"], "children": [{"label": "systemd", "kind": "topic", "children": []}, {"label": "cron và các bẫy", "kind": "topic", "children": []}, {"label": "Shell script an ợc ít nhất 3 vùng nhớ ngoài heap", "Đọc được <code>memory.stat<\/code> của một cgroup và chỉ ra phần nào là page cache, phần nào là anon"], "children": [{"label": "Container là gì", "kind": "topic", "children": []}, {"label": "Giới hạn bộ nhớ", "kind": "topic", "children": []}, {"label": "Runtime có thấy limit của container không", "kind": "topic", "children": []}, {"label": "PID 1 trong container", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 CPU khi vận hành: load average, steal, throttling", "kind": "module", "file": "01-os-linux.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "\"Load 20 là cao hay thấp?\", \"CPU chỉ 40% mà p99 tăng gấp đôi\": các câu này đều cần đọc đúng chỉ số CPU. Trên cloud và Kubernetes còn có hai nguyên nhân chậm mà máy dev không bao giờ gặp: CPU steal và CPU throttling. Đây là câu hỏi senior hay dùng để phân biệt người từng vận hành production thật.", "checks": ["Chạy một tác vụ CPU nặng và một tác vụ I/O nặng, giải thích các cột của <code>vmstat<\/code>/<code>iostat<\/code> thay đổi thế nào (bài tập 4)", "Với load 20 trên máy 8 core, nói được 3 hướng nguyên nhân và lệnh để phân biệt", "Tính được: CPU limit 0,5 core, request tốn 80 ms CPU liên tục, latency tệ nhất là bao nhiêu và vì sao"], "children": [{"label": "Load average", "kind": "topic", "children": []}, {"label": "CPU steal", "kind": "topic", "children": []}, {"label": "CPU throttling trong container", "kind": "topic", "children": []}, {"label": "Phương pháp USE", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 I/O nâng cao: fsync, zero-copy, io_uring", "kind": "module", "file": "01-os-linux.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Module này trả lời \"dữ liệu đã ghi thì có chắc còn không khi mất điện\", nền để hiểu cấu hình durability của MySQL và cách ghi file config an toàn. Phần zero-copy và io_uring giải thích vì sao Nginx, Kafka nhanh và runtime mới đang đi về đâu. Thường xuất hiện ở câu hỏi senior về database  "checks": ["Chạy <code>dig +trace<\/code> cho một domain và giải thích từng bước", "Lập được kế hoạch đổi IP của <code>api.example.com<\/code> không làm rơi request, có mốc thời gian theo TTL"], "children": [{"label": "Quá trình phân giải", "kind": "topic", "children": []}, {"label": "Các loại record", "kind": "topic", "children": []}, {"label": "TTL và cách đổi DNS an toàn", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 HTTP cơ bản", "kind": "module", "file": "02-networking.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi API bạn viết bằng Laravel đều là HTTP. Chọn sai method hay status làm client retry sai, cấu hình cookie sai là mất session hoặc lộ session. Câu \"safe khác idempotent thế nào\" và \"401 khác 403 thế nào\" rất hay bị hỏi.", "checks": ["Xếp được 7 method vào bảng safe/idempotent và cho ví dụ vì sao retry <code>POST<\/code> nguy hiểm", "Viết được <code>Set-Cookie<\/code> cho session cookie của Laravel với đủ thuộc tính an toàn, giải thích từng cái", "Gọi được một API bằng <code>curl -v<\/code> và đọc hết request/response header"], "children": [{"label": "Cấu trúc một request và response", "kind": "topic", "children": []}, {"label": "Safe và idempotent", "kind": "topic", "children": []}, {"label": "Status code", "kind": "topic", "children": []}, {"label": "Header quan trọng", "kind": "topic", "children": []}, {"label": "Stateless và cookie", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 HTTPS cơ bản", "kind": "module", "file": "02-networking.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi app production đều chạy HTTPS, và lỗi cert (thiếu intermediate, hết hạn) là nguyên nhân outage rất phổ biến. Người phỏng vấn hay hỏi \"HTTPS bảo vệ được gì\" và \"vì sao trình duyệt chạy mà <code>curl<\/code> báo lỗi cert\".", "checks": ["Dùng <code>openssl s_client<\/code> xem được chain của một site, chỉ ra leaf, intermediate, root", "Giải thích được với người không chuyên HTTPS chống được gì và không keep-alive\"", "kind": "topic", "children": []}, {"label": "Connection pool", "kind": "topic", "children": []}, {"label": "Quan sát", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 HTTP/1.1, HTTP/2, HTTP/3 và gRPC", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Bạn cần biết HTTP/2 và HTTP/3 giải quyết gì để quyết định bật ở đâu, và để không mang mẹo tối ưu cũ của HTTP/1.1 vào. Nếu công ty có service nội bộ dùng gRPC, bạn cần biết vì sao PHP-FPM không làm server gRPC được và vì sao load balancer thường \"cân bằng\" sai.", "checks": ["Giải thích được HOL blocking ở cả ba phiên bản, và vì sao HTTP/2 trên mạng mất gói có thể tệ hơn HTTP/1.1", "Viết được một file <code>.proto<\/code> nhỏ và nói được thay đổi nào phá tương thích", "Xác định được site đang dùng phiên bản HTTP nào bằng <code>curl -v --http3<\/code> hoặc devtools"], "children": [{"label": "Head-of-line blocking", "kind": "topic", "children": []}, {"label": "So sánh ba phiên bản", "kind": "topic", "children": []}, {"label": "Cạm bẫy khi triển khai", "kind": "topic", "children": []}, {"label": "gRPC (đại ý, chi tiết ở 09-api-design.md)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 HTTP caching, compression, range, CORS", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Header cache sai là nguyên nhân của hai loại sự cố: user không thấy bản deploy mới, và tệ hơn là CDN trả dữ liệu của user A cho user B. CORS thì là lỗi mà dev frontend hỏi backend nhiều nhất. Cả hai đều hay xuất hiện trong phỏng vấn.", "checks": ["Thiết kế được header cache cho JS có hash, trang HTML, API công khai, API <code>/me<\/code> (bài tập 4)", "Giải thích được một sự cố \"user thấy dữ liệu của người khác\" sau khi bật CDN từ góc header", "Tái hiện được <code>304<\/code> bằng <code>curl<\/code> với <code>If-None-Match<\/code>"], "children": [{"label": "Cache-Control", "kind": "topic", "children": []}, {"label": "Revalidate", "kind": "topic", "children": []}, {"label": "Vary và cache key", "kind": "topic", "children": []}, {"label": "Chính sách cho từng loại", "kind": "topic", "children": []}, {"label": "Compression", "kind": "topic", "children": []}, {"label": "Range và chunked", "kind": "topic", "children": []}, {"label": "CORS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 TLS nâng cao", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Bạn không cần tự cài TLS, nhưng phải quyết định TLS kết thúc ở đâu, vì sao Laravel sau load balancer sinh ra URL <code>http://<\/code>, và phải có quy trình gia hạn cert khi hạn cert sắp chỉ còn 47 ngày. Phỏng vấn senior hay hỏi TLS 1.3 nhanh hơn ở đâu và 0-RTT nguy hiểm thế nào.", "checks": ["Vẽ được handshake TLS 1.2 và 1.3, chỉ ra chỗ tiết kiệm 1 RTT", "Giải thích được vì sao 0-RTT không an toàn cho <code>POST /payments<\/code>", "Kể được quy trình quản lý cert của hệ thống mình khi hạn cert còn 47 ngày: cấp, gia hạn, alert, ai chịu trách nhiệm"], "children": [{"label": "TLS 1.2 và TLS 1.3", "kind": "topic", "children": []}, {"label": "0-RTT", "kind": "topic", "children": []}, {"label": "Post-quantum", "kind": "topic", "children": []}, {"label": "SNI, ECH, mTLS, HSTS", "kind": "topic", "children": []}, {"label": "Thu hồi cert", "kind": "topic", "children": []}, {"label": "Hạn cert ngắn dần", "kind": "topic", "children": []}, {"label": "TLS termination", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Reverse proxy, Nginx, X-Forwarded-For", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Gần như mọi app Laravel đều có Nginx đứng trước. Cấu hình proxy quyết định kết nối có được tái dùng không, upload lớn có bị chặn không, rate limit có chặn nhầm cả văn phòng không, và log có ghi đúng IP người dùng không. \"Lấy IP thật của client thế nào\" là câu hỏi hay gặp và hay trả lời sai.", "checks": ["Viết được thuật toán lấy IP thật từ XFF với một danh sách proxy tin cậy, và chỉ ra cách tấn công nếu lấy phần tử đầu", "Giải thích được <code>burst=20 nodelay<\/code> khác <code>burst=20<\/code> thế nào với một đợt 30 request cùng lúc", "Nhìn một cấu hình Nginx và nói được nó có giữ kết nối tới upstream không, dựa vào phiên bản"], "children": [{"label": "Forward proxy và reverse proxy", "kind": "topic", "children": []}, {"label": "Keepalive tới upstream", "kind": "topic", "children": []}, {"label": "Timeout, buffering, giới hạn body", "kind": "topic", "children": []}, {"label": "Rate limit", "kind": "topic", "children": []}, {"label": "Reload không downtime", "kind": "topic", "children": []}, {"label": "X-Forwarded-For và IP thật", "kind": "topic", "children": []}, {"label": "Cấu hình mẫu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Tầng PHP: Nginx + PHP-FPM qua FastCGI", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là module riêng cho người làm PHP. Phần lớn sự cố 502/504 của app Laravel nằm ở ranh giới giữa Nginx và PHP-FPM. Biết đọc một dòng error log của Nginx là biết ngay lỗi nằm ở FPM chết, hết worker hay request chạy quá lâu. Câu \"chuỗi timeout đặt thế nào\" rất hay gặp.", "checks": ["Nhìn 4 dòng error log Nginx ở trên, nói ngay được mã lỗi client thấy và hướng sửa", "Đặt được bộ timeout cho ALB, Nginx, FPM, PHP, Guzzle của một API có endpoint export chạy 2 phút, giải thích thứ tự", "Viết được cấu hình Nginx cho Laravel không cho chạy PHP trong <code>storage/app/public<\/code> (bài tập 3)"], "children": [{"label": "FastCGI", "kind": "topic", "children": []}, {"label": "Kết nối Nginx tới FPM", "kind": "topic", "children": []}, {"label": "Cấu hình an toàn", "kind": "topic", "children": []}, {"label": "Chuỗi timeout", "kind": "topic", "children": []}, {"label": "Đọc lỗi trong error log của Nginx", "kind": "topic", "children": []}, {"label": "Upload", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Load balancer, health check, CDN", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi app chạy nhiều server, load balancer quyết định request đi đâu, server nào bị coi là chết, và deploy có làm rơi request không. Cấu hình health check sai có thể làm cả cụm bị đánh dấu chết chỉ vì DB chậm. CDN cấu hình sai là lộ dữ liệu người dùng.", "checks": ["Giải thích được vì sao 3 pod gRPC sau NLB có một pod 100% CPU, hai pod rảnh", "Thiết kế được endpoint <code>/health<\/code> và <code>/ready<\/code> cho app Laravel, nói cái nào kiểm tra DB và vì sao"], "children": [{"label": "L4 và L7", "kind": "topic", "children": []}, {"label": "Thuật toán chia tải", "kind": "topic", "children": []}, {"label": "Health check", "kind": "topic", "children": []}, {"label": "Connection draining", "kind": "topic", "children": []}, {"label": "CDN", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Timeout và mã lỗi giữa proxy và app", "kind": "module", "file": "02-networking.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Timeout đặt sai là cách phổ biến nhất để một dependency chậm kéo sập cả hệ thống. 502, 504, 499 là ba mã bạn sẽ gặp khi trực sự cố, và mỗi mã chỉ về một nguyên nhân khác nhau. Câu \"đặt timeout và retry thế nào\" gần như luôn có ở vòng system design.", "checks": ["Tạo ra được lần lượt 502, 504, 499 với một app nhỏ sau Nginx, ghi lại cấu hình gây ra từng lỗi (bài tập 2)", "Giải thích được keep-alive race và chọn đúng idle timeout cho app sau ALB", "Tính được số request thực tế tới DB khi 3 tầng mỗi tầng retry 3 lần"], "children": [{"label": "Các loại timeout", "kind": "topic", "children": []}, {"label": "Mặc định nguy hiểm", "kind": "topic", "children": []}, {"label": "Timeout budget", "kind": "topic", "children": []}, {"label": "Retry", "kind": "topic", "children": []}, {"label": "Mã lỗi ở proxy", "kind": "topic", "children": []}, {"label": "Keep-alive race", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 TCP chuyên sâu: hiệu năng, port exhaustion, SYN flood", "kind": "module", "file": "02-networking.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Các sự cố ở module này hiếm nhưng rất khó chẩn đoán nếu không biết cơ chế: request chậm đúng 40 ms, lỗi <code>cannot assign requested address<\/code> khi gọi API nội bộ, client connect timeout trong khi server vẫn \"khoẻ\". Phỏng vấn senior hay đưa một triệu chứng như vậy rồi hỏi bạn đoán nguyên nhân.", "checks": ["Tính được số kết nối mới/giây tối đa tới một đích không keep-alive, và giải thích ba cách nâng giới hạn", "Chỉ ra được trong <code>ss -ltn<\/code> dấu hiệu accept queue đầy", "Giải thích được SYN cookies hoạt động thế nào mà server không cần giữ state"], "children": [{"label": "Nagle và delayed ACK", "kind": "topic", "children": []}, {"label": "Flow control và congestion control", "kind": "topic", "children": []}, {"label": "Port exhaustion phía client", "kind": "topic", "children": []}, {"label": "Hàng đợi khi accept", "kind": "topic", "children": []}, {"label": "SYN flood", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 DNS chuyên sâu", "kind": "module", "file": "02-networking.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Nhiều sự cố \"DNS đã đổi mà app vẫn gọi IP cũ\" không nằm ở DNS server mà ở các lớp cache trong app, trong JVM, trong connection pool. Trên Kubernetes, cấu hình DNS mặc định còn nhân số truy vấn lên nhiều lần. Đây là chủ đề phân biệt người đã vận hành hệ thống thật.", "checks": ["Giải thích được vì sao sau khi DB failover, app vẫn lỗi 10 phút dù DNS đã đổi, kể đủ các lớp cache", "Đếm được số truy vấn DNS một pod gửi đi khi gọi <code>api.stripe.com<\/code> với <code>ndots:5<\/code> và 3 search domain"], "children": [{"label": "Negative caching", "kind": "topic", "children": []}, {"label": "DNS làm load balancing", "kind": "topic", "children": []}, {"label": "DNS cache trong app", "kind": "topic", "children": []}, {"label": "Kết nối cũ không phân giải lại", "kind": "topic", "children": []}, {"label": "Kubernetes và ndots", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 HTTP request smuggling và desync", "kind": "module", "file": "02-networking.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Request smuggling là lỗ hổng ở ranh giới giữa các proxy, nên kiểm tra code app không bao giờ thấy nó. Hiểu nó giúp bạn đánh giá rủi ro khi xếp chồng CDN, LB, Nginx và app server của nhiều hãng. Đây là câu hỏi senior thiên về bảo mật.", "checks": ["Viết được tay một request <code>CL.TE<\/code> và giải thích front-end và back-end mỗi bên thấy gì", "Nêu được 3 biện pháp phòng và cái nào bạn áp dụng được cho hệ thống hiện tại"], "children": [{"label": "Bản chất", "kind": "topic", "children": []}, {"label": "Các biến thể", "kind": "topic", "children": []}, {"label": "Hậu quả", "kind": "topic", "children": []}, {"label": "Phòng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Realtime: SSE, WebSocket và scale", "kind": "module", "file": "02-networking.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Thông báo realtime, tiến trình job, stream câu trả lời từ LLM, chat đều cần server đẩy dữ liệu xuống client. Với PHP, chọn sai cơ chế là cạn worker FPM. Câu \"SSE hay WebSocket\" và \"scale 1 triệu kết nối WebSocket thế nào\" là câu system design phổ biến.", "checks": ["Chọn được giữa SSE và WebSocket cho 3 tính năng cụ thể và bảo vệ được lựa chọn", "Thiết kế được hệ chat 1 triệu kết nối: số node, fan-out, heartbeat, reconnect storm, lấy bù tin", "Giải thích được vì sao endpoint SSE viết bằng Laravel trên FPM làm cạn worker"], "children": [{"label": "Bốn cơ chế", "kind": "topic", "children": []}, {"label": "Chọn cái nào", "kind": "topic", "children": []}, {"label": "PHP-FPM và kết nối dài", "kind": "topic", "children": []}, {"label": "Scale WebSocket", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Mạng cloud, container, anycast", "kind": "module", "file": "02-networking.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "App chạy trên cloud và container thì mạng có thêm nhiều tầng ảo: VPC, subnet, NAT, security group, Service của Kubernetes. Chọn sai từ đầu (ví dụ dải IP trùng) rất khó sửa về sau, còn NAT gateway có thể âm thầm làm hoá đơn tăng vọt. Phỏng vấn hay yêu cầu vẽ sơ đồ mạng cho một app đơn giản.", "checks": ["Vẽ được sơ đồ VPC cho app LB + 3 app server + MySQL + Redis, ghi rõ subnet, route, security group (bài tập 5)", "Viết được FQDN của Service <code>mysql<\/code> trong namespace <code>prod<\/code> và giải thích pod ở namespace khác gọi thế nào"], "children": [{"label": "VPC và subnet", "kind": "topic", "children": []}, {"label": "Security group và NACL", "kind": "topic", "children": []}, {"label": "Container", "kind": "topic", "children": []}, {"label": "Kubernetes", "kind": "topic", "children": []}, {"label": "Service discovery", "kind": "topic", "children": []}, {"label": "Anycast", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 26, "knowledge": "", "prio": "★★"}, {"label": "Cấu trúc dữ liệu và thuật toán", "kind": "file", "file": "21-dsa.md", "children": [{"label": "1.1 Big-O và ràng buộc đầu vào", "kind": "module", "file": "21-dsa.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Sau mỗi lời giải, người phỏng vấn gần như luôn hỏi \"độ phức tạp bao nhiêu, vì sao\". Trong công việc, Big-O giúp nhận ra đoạn code PHP chạy ổn với 100 dòng dữ liệu test nhưng treo khi gặp 100.000 dòng thật, ví dụ <code>in_array<\/code> nằm trong một vòng <code>foreach<\/code>. Đọc ràng buộc n trong đề còn cho biết ngay cần tìm lời giải cỡ nào.", "checks": ["Phân tích được time và space của lời giải vừa viết, kể cả stack đệ quy", "Chứng minh bằng lời vì sao n lần append vào dynamic array tổng chi phí là O(n)", "Nhìn ràng buộc n = 10⁵ nói ngay O(n²) không qua và gợi ý được hướng O(n log n)"], "children": [{"label": "Big-O là gì", "kind": "topic", "children": []}, {"label": "Best, average, worst case", "kind": "topic", "children": []}, {"label": "Hằng số vẫn quan trọng", "kind": "topic", "children": []}, {"label": "Đọc ràng buộc n để đoán độ phức tạp", "kind": "topic", "children": []}, {"label": "Amortized (🟡)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Array, string, hash map/set", "kind": "module", "file": "21-dsa.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Hash map là công cụ dùng nhiều nhất trong bài phỏng vấn: rất nhiều bài O(n²) thành O(n) chỉ nhờ một hash map. Với dev PHP, <code>array<\/code> chính là hash map, nên hiểu nó giúp tránh các chỗ O(n) ẩn và bug key tự đổi kiểu. Câu hay bị hỏi: \"vì sao hash map O(1)\" và \"khi nào nó thành O(n)\".", "checks": ["Vẽ được hash table có chaining và open addressing, chỉ ra khi nào resize", "Giải thích được vì sao hash map O(1) trung bình nhưng O(n) worst, và cách Java giảm worst xuống O(log n)", "Giải Two Sum, Group Anagrams, Longest Consecutive Sequence bằng PHP trong 15 phút mỗi bài"], "children": [{"label": "Array và dynamic array", "kind": "topic", "children": []}, {"label": "Hash table hoạt động thế nào", "kind": "topic", "children": []}, {"label": "Khi hash table thành O(n)", "kind": "topic", "children": []}, {"label": "Key mutable", "kind": "topic", "children": []}, {"label": "Pattern dùng hash map/set", "kind": "topic", "children": []}, {"label": "String", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Stack, queue, deque, linked list", "kind": "module", "file": "21-dsa.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Queue và stack có mặt trong mọi hệ thống: queue job của Laravel, call stack khi đọc stack trace. PHP có một bẫy hay gặp là dùng <code>array_shift<\/code> làm queue khiến BFS thành O(n²). Linked list ít dùng trực tiếp, nhưng là một nửa của LRU cache, và bài linked list kiểm tra khả năng xử lý con trỏ cẩn thận.", "checks": ["Viết được đảo linked list bằng vòng lặp và bằng đệ quy, nói space của từng cách", "Giải thích được vì sao con trỏ nhanh/chậm gặp nhau khi có vòng", "Chỉ ra được chỗ O(n²) ẩn trong một BFS bằng PHP dùng <code>array_shift<\/code> và sửa được"], "children": [{"label": "Stack, queue, deque", "kind": "topic", "children": []}, {"label": "Linked list", "kind": "topic", "children": []}, {"label": "Cạm bẫy theo ngôn ngữ", "kind": "topic", "children": []}, {"label": "Kỹ thuật với linked list", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Sort và binary search", "kind": "module", "file": "21-dsa.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Hiếm khi phải tự viết sort, nhưng câu \"merge sort khác quick sort thế nào\" và \"stable là gì\" rất hay gặp. Stable còn là chuyện thật trong PHP khi sort danh sách theo nhiều cột. Binary search thì xuất hiện rất nhiều và rất dễ sai biên; biến thể \"binary search trên đáp án\" là pattern medium hay gặp.", "checks": ["Viết merge sort và quick sort từ trí nhớ, nói được worst case của quick sort xảy ra khi nào", "Viết <code>lowerBound<\/code>/<code>upperBound<\/code> không lỗi biên, chạy test ca rỗng, một phần tử, toàn trùng", "Giải Koko Eating Bananas và giải thích vì sao đáp án đơn điệu", "Nói được sort của PHP 8, Java, Go có stable không"], "children": [{"label": "Các thuật toán sort", "kind": "topic", "children": []}, {"label": "Binary search", "kind": "topic", "children": []}, {"label": "Sort trong thư viện chuẩn (🟡)", "kind": "topic", "children": []}, {"label": "Binary search trên đáp án (🟡)", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.5 Quy trình làm bài và edge case", "kind": "module", "file": "21-dsa.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Người phỏng vấn chấm cách bạn làm việc, không chỉ code chạy đúng. Im lặng code 20 phút rồi đưa ra lời giải sai thì trượt, dù đã gần đúng. Edge case và cạm bẫy riêng của PHP là chỗ mất điểm dễ nhất.", "checks": ["Ghi âm một lần giải bài easy, nghe lại thấy có đủ 7 bước và không im lặng quá 1 phút", "Với mỗi bài đã giải, liệt kê được 5 edge case trước khi chạy test", "Chỉ ra được 3 cạm bẫy riêng của PHP khi làm bài (int tràn thành float, byte và ký tự, <code>array_shift<\/code>)"], "children": [{"label": "Quy trình 7 bước", "kind": "topic", "children": []}, {"label": "Checklist edge case", "kind": "topic", "children": []}, {"label": "Cạm bẫy khi code", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Two pointers, sliding window, prefix sum", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là nhóm pattern gặp nhiều nhất ở bài medium về mảng và chuỗi. Chúng biến lời giải O(n²) (xét mọi cặp, mọi đoạn) thành O(n). Ngoài phỏng vấn, prefix sum chính là ý tưởng của bảng tổng tích luỹ, giúp trả báo cáo doanh thu theo khoảng ngày bất kỳ mà không cộng lại từ đầu.", "checks": ["Đọc đề và nói trong 1 phút nên dùng window hay prefix sum, kèm lý do (có số âm không)", "Giải 3Sum không trùng bộ ba và giải thích cách bỏ trùng", "Giải Subarray Sum Equals K và giải thích vì sao sliding window sai ở bài này"], "children": [{"label": "Two pointers", "kind": "topic", "children": []}, {"label": "Sliding window", "kind": "topic", "children": []}, {"label": "Prefix sum", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Monotonic stack và deque", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Pattern này ít gặp hơn, nhưng khi gặp mà chưa biết thì gần như không tự nghĩ ra kịp trong 30 phút. Nhận ra dấu hiệu là đủ để qua phần lớn bài. Câu hay bị hỏi vặn: vì sao có vòng <code>while<\/code> lồng trong <code>for<\/code> mà vẫn là O(n).", "checks": ["Giải thích được vì sao monotonic stack là O(n) dù có vòng <code>while<\/code> lồng trong <code>for<\/code>", "Giải Sliding Window Maximum bằng deque và nói vì sao lưu chỉ số thay vì giá trị"], "children": [{"label": "Dấu hiệu", "kind": "topic", "children": []}, {"label": "Monotonic stack", "kind": "topic", "children": []}, {"label": "Monotonic deque", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Tree: DFS, BFS, BST, trie", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Cây có mặt khắp backend: index DB là B+tree, danh mục sản phẩm nhiều cấp, cây comment, cây phân quyền. Bài cây chủ yếu kiểm tra khả năng viết đệ quy đúng. Câu hay hỏi: validate BST, và vì sao cần cây cân bằng.", "checks": ["Viết được DFS trả về cặp giá trị (ví dụ chiều cao và đường kính) trong một lượt duyệt", "Viết BFS theo tầng bằng <code>SplQueue<\/code> trong PHP", "Giải thích được vì sao DB không dùng BST nhị phân làm index (nối sang module 3.1)"], "children": [{"label": "Thuật ngữ cơ bản", "kind": "topic", "children": []}, {"label": "DFS trên cây", "kind": "topic", "children": []}, {"label": "BFS theo tầng", "kind": "topic", "children": []}, {"label": "BST", "kind": "topic", "children": []}, {"label": "Cây cân bằng", "kind": "topic", "children": []}, {"label": "Trie", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Heap, top-K, interval", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Heap là cấu trúc đứng sau hàng đợi ưu tiên (job ưu tiên cao chạy trước), top-K (top sản phẩm bán chạy) và bộ lập lịch. Interval là bài toán backend rất thật: kiểm tra trùng lịch booking, lịch họp. Câu hay hỏi: vì sao top-K lớn nhất lại dùng min-heap.", "checks": ["Giải thích được vì sao top-K lớn nhất dùng min-heap chứ không phải max-heap", "Chứng minh bằng lời vì sao build heap là O(n) chứ không phải O(n log n)", "Giải Find Median from Data Stream bằng <code>SplMinHeap<\/code> + <code>SplMaxHeap<\/code> trong PHP"], "children": [{"label": "Heap là gì", "kind": "topic", "children": []}, {"label": "Các pattern với heap", "kind": "topic", "children": []}, {"label": "Heap trong PHP", "kind": "topic", "children": []}, {"label": "Interval", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Graph: BFS/DFS, topological sort, union-find, shortest path", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Nhiều bài không trông giống graph (lưới đảo, khoá học phụ thuộc nhau, gộp tài khoản trùng) nhưng thực chất là graph. Backend dùng graph ở thứ tự chạy migration, DAG job, phụ thuộc giữa các service. Kỹ năng bị chấm là dựng được graph từ đề bài và chọn đúng thuật toán.", "checks": ["Dựng được graph từ đề dạng chữ (Course Schedule, Accounts Merge) và chọn đúng BFS/DFS/topo/union-find", "Vẽ được đồ thị 3–4 node có cạnh âm làm Dijkstra ra sai", "Viết union-find có path compression và union by size trong 10 phút"], "children": [{"label": "Graph là gì và cách biểu diễn", "kind": "topic", "children": []}, {"label": "BFS và DFS trên graph", "kind": "topic", "children": []}, {"label": "Topological sort", "kind": "topic", "children": []}, {"label": "Union-find", "kind": "topic", "children": []}, {"label": "Shortest path", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Backtracking và greedy", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Backtracking là cách có hệ thống để liệt kê mọi khả năng (tổ hợp, hoán vị, cách chia) khi n nhỏ. Greedy cho lời giải ngắn nhưng rất dễ sai, và người phỏng vấn hay hỏi \"sao bạn biết greedy đúng\". Hai dạng này còn kiểm tra bạn hiểu copy và tham chiếu của mảng trong ngôn ngữ mình dùng.", "checks": ["Viết Subsets II (có trùng) và giải thích điều kiện bỏ trùng ở cùng tầng", "Đưa được phản ví dụ cho greedy ở Coin Change với mệnh giá <code>[1, 3, 4]<\/code>, tổng 6"], "children": [{"label": "Backtracking", "kind": "topic", "children": []}, {"label": "Greedy", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Dynamic programming", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "DP là chủ đề nhiều người sợ nhất, nhưng ở mức medium chỉ cần khung 4 bước và vài dạng quen thuộc. Ngoài phỏng vấn, <code>diff<\/code> (và <code>git diff<\/code>) dựa trên LCS, còn gợi ý sửa lỗi chính tả thường dùng edit distance. Hay bị hỏi: định nghĩa trạng thái là gì, và độ phức tạp.", "checks": ["Với 5 bài DP, viết được định nghĩa trạng thái bằng một câu tiếng Việt trước khi code", "Chuyển Coin Change từ memoization sang bottom-up và nói space trước/sau", "Giải thích được vì sao 0/1 knapsack mảng 1D phải duyệt ngược"], "children": [{"label": "DP là gì và nhận ra thế nào", "kind": "topic", "children": []}, {"label": "Khung 4 bước", "kind": "topic", "children": []}, {"label": "Các dạng hay gặp", "kind": "topic", "children": []}, {"label": "Cạm bẫy", "kind": "topic", "children": []}, {"label": "Bài luyện", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Bit, matrix, thiết kế cấu trúc dữ liệu, cấu trúc có sẵn trong PHP", "kind": "module", "file": "21-dsa.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module gom các dạng nhỏ nhưng hay gặp. Phần quan trọng nhất với người làm PHP là cách <code>array<\/code> và SPL hoạt động bên trong: vì sao <code>in_array<\/code> chậm, vì sao key <code>\"1\"<\/code> thành <code>1<\/code>, khi nào array bị copy. Đây là câu hay bị hỏi khi bạn chọn làm bài bằng PHP, và cũng là nguồn bug thật trong code Laravel.", "checks": ["Cài LRU cache bằng hash map + doubly linked list tự viết, get/put O(1), có test", "Giải thích được <code>$a = $b; $a[] = 1;<\/code> tốn  🔴", "why": "Đây là chỗ senior thể hiện khác biệt: nghe một yêu cầu nghiệp vụ và nhận ra bài thuật toán bên trong, rồi chọn giữa tự cài và dùng công cụ có sẵn. Câu hỏi thường ở dạng mở, như \"thiết kế leaderboard\" hay \"gộp tài khoản trùng\".", "checks": ["Với 7 yêu cầu nghiệp vụ ở trên, nói ra cấu trúc dữ liệu và độ phức tạp trong 1 phút mỗi yêu cầu", "Nêu được một trường hợp chọn công cụ có sẵn tốt hơn tự cài, và lý do vận hành"], "children": [{"label": "Nhận ra bài thuật toán trong yêu cầu nghiệp vụ", "kind": "topic", "children": []}, {"label": "Cách trả lời của senior", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 25, "knowledge": "", "prio": "★★"}]}, {"label": "Dữ liệu", "kind": "group", "children": [{"label": "Database quan hệ và SQL", "kind": "file", "file": "03-database-sql.md", "children": [{"label": "1.1 SQL viết tay", "kind": "module", "file": "03-database-sql.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Vòng live coding thường có bài SQL. Viết JOIN sai hay xử lý NULL sai là lỗi production rất phổ biến, và loại lỗi này không làm hệ thống sập mà chỉ làm <strong>báo cáo ra số sai<\/strong>, nên không ai biết để sửa.", "checks": ["Viết được anti-join theo 3 cách và chỉ ra cách nào sai khi có NULL", "Giải thích được vì sao <code>WHERE<\/code> không dùng được alias trong <code>SELECT<\/code>", "Nhìn một query join 1-n có <code>SUM<\/code>, chỉ ra được chỗ bị nhân dòng và sửa được", "Nói được kết quả của <code>NULL = NULL<\/code>, <code>NULL &lt;=&gt; NULL<\/code>, <code>x NOT IN (1, NULL)<\/code>"], "children": [{"label": "Các kiểu JOIN", "kind": "topic", "children": []}, {"label": "Thứ tự thực thi logic", "kind": "topic", "children": []}, {"label": "Subquery và UNION", "kind": "topic", "children": []}, {"label": "NULL", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "1.2 Index cơ bản", "kind": "module", "file": "03-database-sql.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là chủ đề được hỏi nhiều nhất trong mảng database. Phần lớn sự cố \"DB chậm\" trên thực tế là do thiếu index hoặc có index nhưng không được dùng.", "checks": ["Vẽ được B+tree 3 tầng và chỉ ra đường đi của một range query", "Với index <code>(a, b, c)<\/code>, nói ngay được query nào seek được, query nào không", "Sửa được <code>WHERE DATE(created_at) = ?<\/code> thành dạng dùng được index", "Kể được 3 cái giá của index"], "children": [{"label": "Index là gì", "kind": "topic", "children": []}, {"label": "Vì sao là B+tree", "kind": "topic", "children": []}, {"label": "Composite index và leftmost prefix", "kind": "topic", "children": []}, {"label": "Khi có index mà không được dùng", "kind": "topic", "children": []}, {"label": "Khi không nên thêm index", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "1.3 Transaction cơ bản", "kind": "module", "file": "03-database-sql.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi luồng liên quan tới tiền và tồn kho đều cần transaction. Bẫy hay gặp nhất là nghĩ \"đã bọc trong transaction là an toàn\".", "checks": ["Giải thích được Durability dựa vào đâu (WAL/redo log + fsync)", "Nói được vì sao \"đã bọc trong transaction\" vẫn có thể bán quá tồn kho"], "children": [{"label": "Transaction là gì", "kind": "topic", "children": []}, {"label": "ACID, mỗi chữ một ví dụ", "kind": "topic", "children": []}, {"label": "Hai bẫy", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "1.4 Kiểu dữ liệu và schema cơ bản", "kind": "module", "file": "03-database-sql.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Chọn sai kiểu dữ liệu rất khó sửa khi bảng đã lớn. Tiền và thời gian là nguồn bug kinh điển, nhất là ở Việt Nam với múi giờ UTC+7.", "checks": ["Chứng minh được <code>0.1 + 0.2 != 0.3<\/code> với float và nói hệ quả trong hệ thống tiền", "Giải thích được bug \"lệch 7 tiếng\" xảy ra ở đâu giữa PHP, MySQL session và cột dữ liệu", "Biết một bảng đã có dữ liệu thì đổi collation cần làm gì và rủi ro gì"], "children": [{"label": "Normalization (chuẩn hoá)", "kind": "topic", "children": []}, {"label": "Tiền", "kind": "topic", "children": []}, {"label": "Thời gian", "kind": "topic", "children": []}, {"label": "Chuỗi", "kind": "topic", "children": []}, {"label": "Id", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "2.1 InnoDB lưu dữ liệu thế nào", "kind": "module", "file": "03-database-sql.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Cách InnoDB lưu dữ liệu giải thích phần lớn các hành vi về hiệu năng: vì sao chọn primary key quan trọng, vì sao covering index nhanh, vì sao UUIDv4 làm chậm insert.", "checks": ["Vẽ được đường đi của <code>SELECT * FROM t WHERE email = ?<\/code> qua secondary index rồi clustered index", "Giải thích được vì sao <code>SELECT id FROM t WHERE a = ?<\/code> là covering chỉ với index <code>(a)<\/code>", "Tranh luận được chọn PK nào cho bảng orders sinh ra từ nhiều service"], "children": [{"label": "Clustered index: bảng chính là một cây", "kind": "topic", "children": []}, {"label": "Secondary index: tra hai lần", "kind": "topic", "children": []}, {"label": "Chọn primary key", "kind": "topic", "children": []}, {"label": "Cột lớn", "kind": "topic", "children": []}, {"label": "Đối chiếu Postgres", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "2.2 Index nâng cao", "kind": "module", "file": "03-database-sql.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Ở mức mid trở lên, bạn được kỳ vọng tự thiết kế bộ index từ danh sách query, và đoán trước được <code>EXPLAIN<\/code> sẽ ra gì.", "checks": ["Cho 4–5 query của một bảng, thiết kế được <strong>bộ index tối thiểu<\/strong> và giải thích thứ tự cột", "Nói trước được <code>EXPLAIN<\/code> sẽ ra <code>type<\/code> và <code>Extra<\/code> gì trước khi chạy", "Giải thích được khi nào optimizer chọn full scan thay vì index, và vì sao như vậy là đúng"], "children": [{"label": "Thứ tự cột trong composite index", "kind": "topic", "children": []}, {"label": "Covering index và index condition pushdown", "kind": "topic", "children": []}, {"label": "Index phục vụ ORDER BY", "kind": "topic", "children": []}, {"label": "Index trên biểu thức và JSON", "kind": "topic", "children": []}, {"label": "Cardinality và selectivity", "kind": "topic", "children": []}, {"label": "Công cụ nên biết", "kind": "topic", "children": []}, {"label": "Đối chiếu Postgres", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "2.3 Đọc EXPLAIN và xử lý query chậm", "kind": "module", "file": "03-database-sql.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Câu \"có query chậm trên production, bạn làm gì\" gần như chắc chắn gặp. <code>EXPLAIN<\/code> là công cụ trung tâm để trả lời câu đó.", "checks": ["Đọc một plan thật và chỉ ra bước tốn nhất", "Postgres: biết <code>actual time<\/code> là số <strong>của mỗi loop<\/strong>", "Viết được keyset pagination có cột tie-breaker, và nói được điểm yếu của nó", "Kể được quy trình từ lúc có cảnh báo \"DB chậm\" tới lúc đóng sự cố, kể cả trường hợp nguyên nhân không nằm ở query"], "children": [{"label": "Đọc EXPLAIN", "kind": "topic", "children": []}, {"label": "EXPLAIN ANALYZE", "kind": "topic", "children": []}, {"label": "Statistics", "kind": "topic", "children": []}, {"label": "Thuật toán join", "kind": "topic", "children": []}, {"label": "Quy trình xử lý query chậm", "kind": "topic", "children": []}, {"label": "Pagination", "kind": "topic", "children": []}, {"label": "Mấy thứ hay bị hỏi", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}, {"label": "2.4 SQL nâng cao", "kind": "module", "file": "03-database-sql.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Bài SQL live coding ở mức mid và senior hầu hết cần window function.", "checks": ["Viết không cần tra cứu: top 3 mỗi nhóm, running total, chuỗi ngày liên tiếp i Postgres", "kind": "module", "file": "03-database-sql.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Câu \"chọn MySQL hay Postgres\" dùng để xem bạn hiểu trade-off hay chỉ đang theo thói quen.", "checks": ["Nói được trong 3 phút vì sao cùng một workload update nhiều, MySQL và Postgres gặp vấn đề khác nhau"], "children": [{"label": "So sánh 10 điểm", "kind": "topic", "children": []}, {"label": "Hệ quả thực tế", "kind": "topic", "children": []}, {"label": "Chọn cái nào", "kind": "topic", "children": []}], "knowledge": "kien-thuc/03-database-sql.md"}], "questions": 28, "knowledge": "kien-thuc/03-database-sql.md", "prio": "★★★"}, {"label": "NoSQL, search và storage", "kind": "file", "file": "04-nosql-search-storage.md", "children": [{"label": "1.1 Redis: kiểu dữ liệu và use case", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Trong dự án Laravel, Redis gần như luôn có mặt: cache, session, queue, lock, rate limit. Chọn đúng kiểu dữ liệu thì một lệnh làm xong việc. Chọn sai thì PHP phải kéo cả cục dữ liệu về, sửa, rồi ghi lại. Câu hỏi hay gặp: \"làm leaderboard, đếm user online, rate limit bằng Redis thế nào\".", "checks": ["Với 8 bài toán (session, top 100, đếm DAU, queue, tag bài viết, rate limit, điểm danh, tìm quán gần), chọn đúng kiểu và viết được lệnh chính", "Giải thích được vì sao HyperLogLog đếm được hàng trăm triệu phần tử chỉ với 12KB, và cái giá là gì"], "children": [{"label": "Redis là gì", "kind": "topic", "children": []}, {"label": "Năm kiểu cơ bản", "kind": "topic", "children": []}, {"label": "Các kiểu đặc biệt (🟡)", "kind": "topic", "children": []}, {"label": "Chọn kiểu theo cách truy cập", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Bức tranh NoSQL", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "\"Khi nào dùng NoSQL thay MySQL\" là câu mở đầu rất hay gặp. Người phỏng vấn đánh giá bạn qua việc biết <strong>cái giá<\/strong> của NoSQL, không chỉ ưu điểm. Dự án PHP thực tế thường là MySQL làm nguồn chính, cộng Redis, Elasticsearch và S3 cho từng việc riêng.", "checks": ["Cho một hệ thống thương mại điện tử, chỉ ra được phần nào hợp với SQL, phần nào hợp với key-value, search, object storage, và nói lý do", "Nói được 3 thứ mất đi khi chuyển một bảng quan hệ sang MongoDB"], "children": [{"label": "NoSQL là gì", "kind": "topic", "children": []}, {"label": "Các nhóm chính", "kind": "topic", "children": []}, {"label": "Khi nào chọn NoSQL", "kind": "topic", "children": []}, {"label": "Cái giá phải trả", "kind": "topic", "children": []}, {"label": "Mặc định an toàn", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Search cơ bản", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Ô tìm kiếm sản phẩm có ở hầu hết mọi app. <code>LIKE<\/code> chạy được lúc đầu, rồi vừa chậm vừa cho kết quả kém khi dữ liệu lớn dần. Câu hỏi hay gặp: \"vì sao không dùng <code>LIKE<\/code>\", \"inverted index là gì\".", "checks": ["Vẽ được inverted index cho 3 document ngắn và chỉ ra cách query \"áo khoác\" chạy trên đó", "Giải thích được vì sao mã đơn hàng phải là <code>keyword<\/code>, còn tên sản phẩm là <code>text<\/code>"], "children": [{"label": "Vì sao LIKE '%keyword%' không đủ", "kind": "topic", "children": []}, {"label": "Inverted index", "kind": "topic", "children": []}, {"label": "Analyzer", "kind": "topic", "children": []}, {"label": "Hai kiểu field: text và keyword", "kind": "topic", "children": []}, {"label": "Vị trí của search engine trong hệ thống", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Object storage cơ bản", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Upload ảnh đại diện, hoá đơn PDF, video là việc hằng ngày. Laravel mặc định lưu file vào <code>storage/app<\/code> trên đĩa local: chạy tốt với một server, rồi vỡ khi thêm server thứ hai. Câu hỏi hay gặp: \"thiết kế luồng upload file\", \"vì sao không upload qua API\".", "checks": ["Vẽ được luồng upload ảnh đại diện bằng presigned URL, chỉ ra chỗ nào server phải kiểm tra", "Giải thích được vì sao upload file 2GB qua API PHP-FPM là thiết kế sai"], "children": [{"label": "Vì sao không lưu file trên đĩa app server", "kind": "topic", "children": []}, {"label": "Object storage", "kind": "topic", "children": []}, {"label": "Presigned URL", "kind": "topic", "children": []}, {"label": "Luồng upload bằng presigned URL", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Redis: mô hình thực thi và lệnh nguy hiểm", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Sự cố Redis kinh điển là \"một lệnh làm cả hệ thống chậm theo\", ví dụ một cron job hay một lệnh debug gõ tay trên production. Hiểu mô hình một thread thì mới giải thích và phòng được. Câu hỏi hay gặp: \"Redis chạy một thread sao lại nhanh\", \"vì sao cấm <code>KEYS *<\/code>\".", "checks": ["Giải thích được trong 1 phút vì sao một job cron chạy <code>HGETALL<\/code> trên key 2 triệu field làm mọi API chậm theo", "Viết được vòng lặp <code>SCAN<\/code> xoá key theo prefix mà không chặn server, và nói được vì sao có thể gặp key trùng", "Tìm được big key trên một instance Redis thật (local cũng được) bằng <code>--bigkeys<\/code> và <code>MEMORY USAGE<\/code>"], "children": [{"label": "Vì sao một thread mà vẫn nhanh", "kind": "topic", "children": []}, {"label": "Các thread phụ", "kind": "topic", "children": []}, {"label": "Hệ quả của một thread", "kind": "topic", "children": []}, {"label": "Lệnh nguy hiểm", "kind": "topic", "children": []}, {"label": "Big key và hot key", "kind": "topic", "children": []}, {"label": "Bảo vệ và theo dõi", "kind": "topic", "children": []}, {"label": "Đối chiếu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Redis: persistence, TTL, eviction", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module này quyết định Redis mất gì khi restart hay failover, và key nào bị xoá khi đầy RAM. Để cache, session và queue của Laravel chung một Redis là cấu hình rất phổ biến, và cũng là nguồn sự cố rất phổ biến. Câu hỏi hay gặp: \"RDB khác AOF thế nào\", \"Redis đầy RAM thì sao\".", "checks": ["Nói được với cấu hình AOF <code>everysec<\/code> + replica async, những kịch bản nào làm mất ghi và mất tối đa bao nhiêu", "Chọn được <code>maxmemory-policy<\/code> cho 3 instance: thuần cache, session store, queue của Laravel; giải thích lý do", "Chỉ ra được bug \"key cache sống vĩnh viễn\" trong một đoạn code dùng <code>SET<\/code> rồi <code>EXPIRE<\/code>"], "children": [{"label": "Persistence: RDB", "kind": "topic", "children": []}, {"label": "Persistence: AOF", "kind": "topic", "children": []}, {"label": "Redis không bền như MySQL", "kind": "topic", "children": []}, {"label": "TTL và cách key hết hạn", "kind": "topic", "children": []}, {"label": "Eviction khi đầy bộ nhớ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Redis: pipeline, transaction, Lua, messaging", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "<code>Redis::pipeline<\/code>, <code>Redis::transaction<\/code> và <code>Cache::lock<\/code> của Laravel đều dựa trên các cơ chế trong module này. Câu hỏi hay gặp: \"<code>MULTI<\/code>/<code>EXEC<\/code> có rollback không\", \"làm sao đọc rồi ghi atomic trong Redis\", \"Pub/Sub khác Stream thế nào\".", "checks": ["Giải thích được khác nhau giữa pipeline, <code>MULTI<\/code>/<code>EXEC<\/code> và Lua bằng một ví dụ trừ tồn kho", "Viết được Lua nhả lock chỉ khi đúng token", "Nói được khi nào dùng Pub/Sub, khi nào dùng Stream, khi nào phải lên Kafka/RabbitMQ"], "children": [{"label": "Pipelining", "kind": "topic", "children": []}, {"label": "MULTI/EXEC", "kind": "topic", "children": []}, {"label": "WATCH: check-and-set lạc quan", "kind": "topic", "children": []}, {"label": "Lua script", "kind": "topic", "children": []}, {"label": "So sánh ba cách", "kind": "topic", "children": []}, {"label": "Messaging: Pub/Sub và Stream", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Redis: use case kinh điển", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Lock, rate limit, leaderboard, session là bốn bài toán Redis bị hỏi nhiều nhất trong vòng system design. Laravel có sẵn <code>Cache::lock<\/code>, <code>RateLimiter<\/code>, session driver Redis, nhưng người phỏng vấn muốn biết bên dưới chúng làm gì và gãy ở đâu.", "checks": ["Vẽ được timeline hai worker cùng giữ lock do lock hết hạn, và chỉ ra fencing token chặn ở đâu", "Viết được leaderboard có xử lý bằng điểm, lấy top 10 và hạng của một user", "Viết được rate limiter sliding window bằng Lua (bài tập 1)"], "children": [{"label": "Distributed lock", "kind": "topic", "children": []}, {"label": "Rate limiter", "kind": "topic", "children": []}, {"label": "Leaderboard", "kind": "topic", "children": []}, {"label": "Session store", "kind": "topic", "children": []}, {"label": "Counter và view count", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 MongoDB", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "MongoDB là document DB phổ biến nhất, hay gặp ở dự án cần schema linh hoạt hoặc team Node.js. Người phỏng vấn hỏi để xem bạn thiết kế theo tư duy document, hay chỉ bê nguyên các bảng SQL sang thành collection.", "checks": ["Thiết kế được collection cho blog (bài, tác giả, comment, tag), bảo vệ được chỗ nào embed, chỗ nào reference", "Cho một query và index, dùng ESR nói được index nào tốt hơn", "Giải thích được <code>w:1<\/code> + đọc <code>local<\/code> có thể trả dữ liệu mà sau đó bị rollback như thế nào"], "children": [{"label": "Document và aggregate", "kind": "topic", "children": []}, {"label": "Embedding hay referencing", "kind": "topic", "children": []}, {"label": "Index", "kind": "topic", "children": []}, {"label": "Đọc plan và aggregation", "kind": "topic", "children": []}, {"label": "Transaction", "kind": "topic", "children": []}, {"label": "Write concern, read concern, read preference", "kind": "topic", "children": []}, {"label": "Change streams", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Elasticsearch/OpenSearch: analyzer, mapping, tiếng Việt, relevance", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Làm search tiếng Việt có dấu và không dấu là việc thật ở mọi dự án Việt Nam, và \"có mà tìm không ra\" là bug rất phổ biến. Người phỏng vấn hay hỏi analyzer, mapping, vì sao ghi xong search không thấy, và cách phân trang sâu.", "checks": ["Viết được mapping cho <code>products<\/code> hỗ trợ có dấu, không dấu, ưu tiên khớp đúng dấu (bài tập 3)", "Dùng <code>_analyze<\/code> chỉ ra được token của \"Điện thoại Samsung\" với analyzer chuẩn và analyzer có folding", "Giải thích được vì sao trang 1000 của kết quả tìm kiếm chậm và sửa bằng <code>search_after<\/code>"], "children": [{"label": "Analyzer lúc index và lúc search", "kind": "topic", "children": []}, {"label": "Segment: cách ES lưu index", "kind": "topic", "children": []}, {"label": "Tiếng Việt", "kind": "topic", "children": []}, {"label": "Mapping", "kind": "topic", "children": []}, {"label": "Near real-time", "kind": "topic", "children": []}, {"label": "Relevance", "kind": "topic", "children": []}, {"label": "Deep pagination", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Đồng bộ dữ liệu từ DB sang search", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Có search engine thì phải đồng bộ dữ liệu từ DB sang. Lệch dữ liệu giữa MySQL và Elasticsearch là loại bug khó thấy: không có lỗi nào, chỉ là search trả giá cũ hoặc thiếu sản phẩm. Laravel Scout làm việc này, và có lỗ hổng mà người phỏng vấn hay hỏi.", "checks": ["Vẽ được timeline hai lần sửa giá đan xen làm ES giữ giá cũ khi dùng dual write, và chỉ ra external version sửa thế nào", "Liệt kê được 3 đường ghi trong một app Laravel có thể bỏ qua Scout"], "children": [{"label": "Ba cách đồng bộ", "kind": "topic", "children": []}, {"label": "Giữ đúng thứ tự", "kind": "topic", "children": []}, {"label": "Đối soát và reindex", "kind": "topic", "children": []}, {"label": "Laravel Scout", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Object storage nâng cao", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Upload file lớn, lưu backup, giữ chi phí S3 không phình là việc của mid và senior. Câu hỏi hay gặp: \"upload video 2 GB thế nào\", \"S3 có consistency gì\", và các lỗi bảo mật kiểu bucket public nhầm.", "checks": ["Thiết kế được upload video 2GB: presigned multipart, resume khi rớt mạng, dọn part dở dang, xử lý async sau upload", "Dùng <code>If-Match<\/code> viết được luồng cập nhật một file cấu hình JSON trên S3 mà hai tiến trình không ghi đè mất sửa đổi của nhau"], "children": [{"label": "Multipart upload", "kind": "topic", "children": []}, {"label": "Kiểm soát file được upload", "kind": "topic", "children": []}, {"label": "Consistency", "kind": "topic", "children": []}, {"label": "Conditional write", "kind": "topic", "children": []}, {"label": "Lifecycle và storage class", "kind": "topic", "children": []}, {"label": "Versioning và Object Lock", "kind": "topic", "children": []}, {"label": "Hiệu năng và bảo mật", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.9 Tầng PHP: Redis client, Laravel Redis, Scout, Elasticsearch client, S3", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Người phỏng vấn hay hỏi vào chỗ PHP-FPM ược giữa một instance, Sentinel và Cluster, và biết mỗi cách mất dữ liệu ra sao. Câu hỏi hay gặp: \"vì sao <code>MGET<\/code> lỗi trên Cluster\", \"Redis hay Valkey\".", "checks": ["Tính được slot của một key có hash tag và giải thích được vì sao <code>MGET user:1 user:2<\/code> lỗi trên Cluster", "Kể được kịch bản mất ghi khi failover Sentinel và cách giảm thiểu", "Chọn được giữa một Redis, Sentinel và Cluster cho 3 quy mô khác nhau"], "children": [{"label": "Replication", "kind": "topic", "children": []}, {"label": "Sentinel", "kind": "topic", "children": []}, {"label": "Cluster: hash slot", "kind": "topic", "children": []}, {"label": "Giới hạn của Cluster", "kind": "topic", "children": []}, {"label": "Chọn cách triển khai", "kind": "topic", "children": []}, {"label": "License và hệ sinh thái", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 MongoDB sharding và CAP", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Chọn shard key sai là lỗi gần như không sửa được khi dữ liệu đã lớn. CAP là câu lý thuyết hay bị hỏi, và thường bị trả lời bằng nhãn \"CP/AP\" học thuộc. Senior phải nói được nhãn đó phụ thuộc vào cấu hình.", "checks": ["Chọn được shard key cho collection <code>orders<\/code> của SaaS nhiều tenant, nói được xử lý tenant rất lớn thế nào", "Giải thích được vì sao nói \"MongoDB là CP\" mà không kèm write/read concern là chưa đủ"], "children": [{"label": "Kiến trúc sharded cluster của MongoDB", "kind": "topic", "children": []}, {"label": "Chọn shard key", "kind": "topic", "children": []}, {"label": "CAP và PACELC", "kind": "topic", "children": []}, {"label": "Nhãn CP/AP không cố định", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Wide-column (Cassandra) và DynamoDB", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Cassandra và DynamoDB buộc bạn thiết kế dữ liệu ngược với thói quen SQL: bắt đầu từ query, không từ entity. Người phỏng vấn senior hay đưa một bài (tin nhắn, feed, IoT) để xem bạn có chọn được partition key không bị quá rộng hay quá nóng không. Với DynamoDB, thiết kế sai là trả tiền thẳng.", "checks": ["Thiết kế được bảng \"tin nhắn mới nhất của mỗi cuộc trò chuyện\" cho Cassandra hoặc DynamoDB, chỉ ra partition có thể quá rộng hoặc quá nóng", "Chọn được on-demand hay provisioned cho 2 workload (flash sale thất thường, job batch ổn định) và giải thích bằng tiền", "Giải thích được vì sao <code>QUORUM<\/code> đọc + <code>QUORUM<\/code> ghi với N=3 cho đọc thấy ghi mới nhất, và khi nào điều đó vẫn gãy"], "children": [{"label": "Query-first modeling", "kind": "topic", "children": []}, {"label": "Cassandra: key và truy vấn", "kind": "topic", "children": []}, {"label": "Cassandra: ghi và consistency", "kind": "topic", "children": []}, {"label": "Cassandra: cạm bẫy", "kind": "topic", "children": []}, {"label": "DynamoDB: key và index", "kind": "topic", "children": []}, {"label": "DynamoDB: consistency và tính năng", "kind": "topic", "children": []}, {"label": "DynamoDB: capacity và hot partition", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Vận hành search: shard, reindex, license", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Đưa Elasticsearch lên production là phần dễ. Phần khó là đổi mapping hay analyzer khi index đang nhận ghi, và giữ cluster không chậm dần vì quá nhiều shard. Câu hỏi hay gặp: \"đổi analyzer không downtime thế nào\", \"Elasticsearch hay OpenSearch\".", "checks": ["Viết được từng bước đổi analyzer của index <code>products<\/code> đang nhận ghi, kể cả rollback (bài tập 3)", "Ước lượng được số primary shard cho index 600GB và giải thích con số"], "children": [{"label": "Shard", "kind": "topic", "children": []}, {"label": "Reindex không downtime", "kind": "topic", "children": []}, {"label": "ES và JVM", "kind": "topic", "children": []}, {"label": "License", "kind": "topic", "children": []}, {"label": "Thay thế nhẹ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Time-series, OLAP, data warehouse", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "\"Báo cáo doanh thu làm DB chậm\" là sự cố gần như mọi hệ thống lớn dần đều gặp. Senior phải đề xuất được lộ trình đưa phân tích ra khỏi DB chính, và biết khi nào cần time-series DB hay data warehouse.", "checks": ["Giải thích được bằng số liệu vì sao <code>SUM(amount)<\/code> trên 1 tỉ dòng nhanh hơn nhiều ở column store", "Đề xuất được lộ trình 3 bước cho \"báo cáo doanh thu làm DB chậm\" và nói cái giá độ trễ dữ liệu ở mỗi bước"], "children": [{"label": "Time-series DB", "kind": "topic", "children": []}, {"label": "OLTP và OLAP", "kind": "topic", "children": []}, {"label": "Vì sao column store nhanh cho phân tích", "kind": "topic", "children": []}, {"label": "Không chạy báo cáo nặng trên OLTP", "kind": "topic", "children": []}, {"label": "Warehouse, data lake, lakehouse", "kind": "topic", "children": []}, {"label": "Dữ liệu cá nhân", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.7 Vector DB và graph DB", "kind": "module", "file": "04-nosql-search-storage.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Tính năng AI (tìm kiếm ngữ nghĩa, RAG) đưa vector search vào backend thường ngày. Người phỏng vấn muốn biết bạn chọn pgvector hay hệ riêng, và có hiểu cạm bẫy khi lọc theo tenant không. Graph DB ít gặp hơn, câu hỏi thường là \"khi nào thật sự cần\".", "checks": ["Giải thích được vì sao tìm vector theo tenant bằng pgvector có thể trả thiếu kết quả, và 2 cách sửa", "Nêu được một bài toán thật mà graph DB hơn hẳn SQL, và một bài toán nghe giống nhưng SQL đủ"], "children": [{"label": "Embedding", "kind": "topic", "children": []}, {"label": "ANN: tìm gần đúng", "kind": "topic", "children": []}, {"label": "Chọn nơi lưu vector", "kind": "topic", "children": []}, {"label": " evel": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Cài LRU cache với <code>get<\/code>/<code>put<\/code> O(1)\" (LeetCode 146) là bài live coding kinh điển. Nó kiểm tra bạn có kết hợp được hai cấu trúc dữ liệu để bù điểm yếu của nhau không.", "checks": ["Viết được LRU <code>O(1)<\/code> trong 15 phút, có test cho các trường hợp biên (dung lượng 1, put trùng key)", "Bổ sung được TTL cho từng key mà <code>get<\/code> vẫn <code>O(1)<\/code> (bài tập 3)"], "children": [{"label": "Ý tưởng", "kind": "topic", "children": []}, {"label": "Hai thao tác", "kind": "topic", "children": []}, {"label": "Chi tiết cài đặt", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go/PHP", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Cache trong PHP/Laravel", "kind": "module", "file": "11-cache.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Người phỏng vấn hay hỏi xoáy vào việc PHP-FPM không giữ gì giữa các request, nên \"cache trong RAM của app\" kiểu Java không áp dụng thẳng được. Họ cũng hay hỏi các API cache của Laravel và những lệnh artisan có thể gây sự cố production.", "checks": ["Giải thích được vì sao APCu không thay được Redis khi có 10 server, và khi nào APCu vẫn hợp lý", "Dùng <code>Cache::flexible<\/code> và <code>Cache::lock<\/code> sửa được một endpoint bị stampede, nói rõ khác nhau giữa hai cách", "Chỉ ra được cấu hình Laravel để <code>cache:clear<\/code> không đụng tới queue và session"], "children": [{"label": "Mô hình PHP-FPM và cache trong process", "kind": "topic", "children": []}, {"label": "Laravel Cache API", "kind": "topic", "children": []}, {"label": "Redis client", "kind": "topic", "children": []}, {"label": "Các cạm bẫy của Laravel", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Multi-level cache (L1 + L2)", "kind": "module", "file": "11-cache.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi Redis thành nút thắt (hot key, round-trip quá nhiều), bước tiếp theo là thêm một tầng cache ngay trong app. Cái khó là giữ các bản sao trên 20 instance không lệch nhau quá lâu. Người phỏng vấn senior muốn nghe bạn nói được \"độ cũ tối đa là bao nhiêu\" và vì sao.", "checks": ["Thiết kế được L1 + L2 cho 20 instance, nói được độ cũ tối đa trong trường hợp xấu nhất", "So sánh được Pub/Sub, Streams, Kafka để broadcast invalidation (bài tập 5)"], "children": [{"label": "Hai tầng cache", "kind": "topic", "children": []}, {"label": "Vấn đề: mỗi instance một bản L1", "kind": "topic", "children": []}, {"label": "Cách xử lý", "kind": "topic", "children": []}, {"label": "Chọn gì cho L1", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Nhất quán cache ở quy mô lớn: lease, CDC", "kind": "module", "file": "11-cache.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Module này là các lời giải công nghiệp cho chính những race ở module 2.2 và stampede ở module 2.3, lấy từ paper memcache của Facebook. Câu \"lease giải quyết vấn đề gì\" là câu phân loại senior rất rõ: người chưa đọc thường nhầm lease với distributed lock.", "checks": ["Vẽ lại được race \"update DB rồi xoá cache\" và chỉ ra chính xác bước nào lease chặn được", "Viết được Lua mô phỏng lease trên Redis: cấp token khi miss, <code>set<\/code> có điều kiện, xoá huỷ token", "So sánh được xoá cache trong code và xoá qua CDC theo 4 tiêu chí: độ trễ, độ phủ, độ phức tạp, điểm lỗi"], "children": [{"label": "Lease", "kind": "topic", "children": []}, {"label": "Invalidation qua commit log", "kind": "topic", "children": []}, {"label": "Đo độ nhất quán", "kind": "topic", "children": []}, {"label": "Nhiều region", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Khi cache trở thành phụ thuộc bắt buộc", "kind": "module", "file": "11-cache.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Hệ thống chạy lâu với hit ratio 95% thì DB đã được sizing cho 5% tải. Redis sập là DB nhận gấp
