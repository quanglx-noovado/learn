e id, span cha, cờ sampled"], "children": [{"label": "OpenAPI", "kind": "topic", "children": []}, {"label": "Contract-first và code-first", "kind": "topic", "children": []}, {"label": "Dùng spec trong CI và test", "kind": "topic", "children": []}, {"label": "Tài liệu tốt gồm gì", "kind": "topic", "children": []}, {"label": "Tracing xuyên API", "kind": "topic", "children": []}, {"label": "API gateway và BFF", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 27, "knowledge": "", "prio": "★★★"}, {"label": "Bảo mật", "kind": "file", "file": "10-security.md", "children": [{"label": "1.1 Lưu password", "kind": "module", "file": "10-security.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Gần như app nào cũng có bảng <code>users<\/code> với cột password. Khi DB bị lộ (qua SQL injection, backup để quên, nhân viên cũ), cách bạn lưu password quyết định kẻ tấn công lấy được vài password hay toàn bộ. Câu \"lưu password thế nào, vì sao không dùng SHA-256\" là câu mở đầu kinh điển, rồi bị hỏi tiếp sang salt, pepper, reset password.", "checks": ["Giải thích được vì sao \"nhanh\" là nhược điểm của hash khi dùng cho password, bằng con số ước lượng", "Nói được pepper bảo vệ khỏi kịch bản nào, không bảo vệ khỏi kịch bản nào, và cái giá vận hành", "Viết được luồng login có rehash khi đổi cost, không lộ email tồn tại qua thời gian phản hồi", "Nêu đúng yêu cầu độ dài của NIST SP 800-63B-4 cho hai trường hợp có và không có MFA"], "children": [{"label": "Hash chậm có chủ đích", "kind": "topic", "children": []}, {"label": "Salt và pepper", "kind": "topic", "children": []}, {"label": "Các cạm bẫy khi hash", "kind": "topic", "children": []}, {"label": "Password policy theo NIST SP 800-63B-4", "kind": "topic", "children": []}, {"label": "Quên mật khẩu", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Session và cookie", "kind": "module", "file": "10-security.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đăng nhập web bằng Laravel mặc định là session lưu ở server và một cookie ở trình duyệt. Hiểu từng thuộc tính của cookie là nền để hiểu CSRF, XSS và JWT ở các module sau. Người phỏng vấn hay đưa một header <code>Set-Cookie<\/code> và hỏi từng thuộc tính làm gì, hoặc hỏi về <code>SameSite<\/code> và session fixation.", "checks": ["Viết được một header <code>Set-Cookie<\/code> cho session cookie an toàn và giải thích từng thuộc tính", "Giải thích được session fixation bằng một kịch bản cụ thể và chỗ sửa trong code", "Nói được vì sao không thể dựa vào \"Lax mặc định\" để chống CSRF, nêu tên trình duyệt"], "children": [{"label": "Session là gì", "kind": "topic", "children": []}, {"label": "Session fixation", "kind": "topic", "children": []}, {"label": "Các thuộc tính của cookie", "kind": "topic", "children": []}, {"label": "SameSite", "kind": "topic", "children": []}, {"label": "HttpOnly không chống được XSS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Injection, XSS, CSRF", "kind": "module", "file": "10-security.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Ba lỗ hổng web kinh điển nhất, gần như chắc chắn bị hỏi ở mọi level. Laravel chặn sẵn phần lớn (query builder bind tham số, Blade escape, middleware CSRF), nên câu hỏi thật thường là \"chỗ nào framework <strong>không<\/strong> chặn hộ\" và \"XSS khác CSRF thế nào\".", "checks": ["Giải thích được prepared statement chặn injection ở tầng nào, và 2 chỗ nó không giúp được", "Cho một đoạn Blade/JS, chỉ ra chỗ lọt XSS theo từng ngữ cảnh output", "Phân biệt rõ XSS và CSRF: kẻ tấn công làm được gì, không làm được gì, chặn bằng gì"], "children": [{"label": "SQL injection", "kind": "topic", "children": []}, {"label": "XSS (Cross-Site Scripting)", "kind": "topic", "children": []}, {"label": "CSRF (Cross-Site Request Forgery)", "kind": "topic", "children": []}, {"label": "XSS khác CSRF thế nào", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Crypto cơ bản", "kind": "module", "file": "10-security.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Backend thường xuyên đụng tới crypto: verify webhook từ cổng thanh toán, ký cookie, sinh token reset password, mã hoá số CCCD. Nhầm encode với encrypt, hay dùng <code>rand()<\/code> sinh token, là lỗi thật trong code review. Người phỏng vấn hay đưa vài tình huống và hỏi \"dùng công cụ nào\".", "checks": ["Với 6 tình huống (lưu password, xác minh webhook, lưu số CCCD, token reset, ký JWT, truyền ảnh qua URL), chọn đúng công cụ và giải thích", "Giải thích được length extension attack ở mức ý tưởng và vì sao HMAC không bị"], "children": [{"label": "Sáu khái niệm hay bị nhầm", "kind": "topic", "children": []}, {"label": "Vì sao phải dùng HMAC", "kind": "topic", "children": []}, {"label": "Số ngẫu nhiên an toàn", "kind": "topic", "children": []}, {"label": "Không tự chế crypto", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.5 Authentication, authorization và IDOR", "kind": "module", "file": "10-security.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Lỗi phân quyền là loại lỗ hổng phổ biến nhất trong API thật, và scanner tự động không phát hiện được, vì request trông hoàn toàn hợp lệ. Trong Laravel, quên gắn <code>where user_id<\/code> hay quên gọi Policy là đủ để user này xem đơn của user khác. Người phỏng vấn hay đưa một controller và hỏi \"chỗ này có lỗi gì\".", "checks": ["Nhìn một controller Laravel, chỉ ra được chỗ có IDOR và sửa bằng scope hoặc Policy", "Giải thích được vì sao API key lưu SHA-256 là đủ, còn password thì không"], "children": [{"label": "Hai khái niệm", "kind": "topic", "children": []}, {"label": "IDOR / BOLA", "kind": "topic", "children": []}, {"label": "BFLA và nguyên tắc mặc định", "kind": "topic", "children": []}, {"label": "API key", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 JWT", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "JWT có mặt ở hầu hết hệ thống dùng token: mobile app, microservice, đăng nhập bằng Google. Thư viện JWT dùng sai cấu hình từng gây nhiều lỗ hổng chiếm tài khoản nổi tiếng. Người phỏng vấn hay hỏi \"verify một JWT gồm những bước nào\" và \"HS256 khác RS256 ra sao\".", "checks": ["Liệt kê được thứ tự kiểm tra một JWT nhận vào, và kiểm tra nào thiếu thì dẫn tới lỗ hổng nào", "Giải thích được algorithm confusion từng bước và dòng cấu hình nào chặn được nó", "Chọn được HS256 hay ES256 cho một hệ 5 service và bảo vệ lựa chọn đó"], "children": [{"label": "JWT là gì", "kind": "topic", "children": []}, {"label": "Hai kiểu ký", "kind": "topic", "children": []}, {"label": "Verify một JWT: kiểm tra những gì", "kind": "topic", "children": []}, {"label": "Các tấn công kinh điển", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Vòng đời token: revocation, refresh, nơi lưu, BFF", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Chọn JWT xong thì câu hỏi tiếp theo luôn là \"đăng xuất thế nào\", \"đổi password thì token cũ còn dùng được không\", \"token lưu ở đâu trên trình duyệt\". Đây là phần thiết kế mà người phỏng vấn dùng để phân biệt người chỉ biết dùng thư viện với người hiểu trade-off.", "checks": ["Vẽ được luồng refresh có rotation, reuse detection và xử lý hai tab refresh cùng lúc", "Thiết kế được \"đăng xuất mọi thiết bị khi đổi password\" cho hệ dùng JWT, nói rõ độ trễ chấp nhận được", "Giải thích được vì sao RFC 10017 ưu tiên BFF hơn việc để SPA tự giữ token"], "children": [{"label": "Vì sao JWT khó thu hồi", "kind": "topic", "children": []}, {"label": "Refresh token rotation và reuse detection", "kind": "topic", "children": []}, {"label": "Lưu token ở đâu trên trình duyệt", "kind": "topic", "children": []}, {"label": "BFF (Backend for Frontend)", "kind": "topic", "children": []}, {"label": "Chọn session hay token", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 OAuth 2.0 và OIDC", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Đăng nhập bằng Google\", cho app bên thứ ba truy cập dữ liệu, SSO nội bộ đều dựa trên OAuth 2.0 và OIDC. Hiểu sai OAuth dẫn tới lỗi chiếm tài khoản kinh điển. Câu hay bị hỏi: \"authorization code + PKCE chạy thế nào\", \"vì sao bỏ implicit flow\", \"ID token khác access token ở đâu\".", "checks": ["Vẽ được authorization code + PKCE từng bước, chỉ ra kênh front-channel và back-channel", "Giải thích được PKCE chặn tấn công nào mà <code>state<\/code> không chặn được, và ngược lại", "Giải thích được cho người khác vì sao \"đăng nhập bằng OAuth\" mà chỉ dùng access token là sai"], "children": [{"label": "OAuth 2.0 là gì", "kind": "topic", "children": []}, {"label": "Các flow", "kind": "topic", "children": []}, {"label": "Authorization code + PKCE từng bước", "kind": "topic", "children": []}, {"label": "Các cạm bẫy ở callback", "kind": "topic", "children": []}, {"label": "OIDC: lớp đăng nhập trên OAuth", "kind": "topic", "children": []}, {"label": "Trong Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 MFA và passkey", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Password lộ là chuyện thường ngày, nên các hệ có tiền hay dữ liệu nhạy cảm đều cần MFA. Passkey đang thay dần password ở các sản phẩm lớn. Câu hay bị hỏi: \"vì sao passkey chống phishing còn OTP thì không\", \"user mất điện thoại thì khôi phục thế nào\".", "checks": ["Giải thích được vì sao passkey chống phishing còn TOTP thì không", "Vẽ được luồng đăng ký và đăng nhập bằng passkey, nói server lưu gì và kiểm tra gì", "Thiết kế được luồng khôi phục khi user mất thiết bị mà không mở toang cửa sau"], "children": [{"label": "MFA là gì", "kind": "topic", "children": []}, {"label": "TOTP", "kind": "topic", "children": []}, {"label": "SMS OTP", "kind": "topic", "children": []}, {"label": "WebAuthn và passkey", "kind": "topic", "children": []}, {"label": "Khôi phục và các cạm bẫy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Authorization: mô hình và tầng kiểm tra", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module 1.5 dạy kiểm tra \"đơn có thuộc user không\". Khi app lớn lên, bạn cần một mô hình quyền rõ ràng (vai trò, chi nhánh, chia sẻ) và một chỗ tập trung để kiểm tra. Trong Laravel đó là Gate và Policy. Câu hay bị hỏi: \"RBAC khác ABAC thế nào\", \"kiểm tra quyền ở tầng nào\".", "checks": ["Chọn được mô hình cho \"Google Drive thu nhỏ\" và cho \"CRM có 5 vai trò\" và giải thích vì sao", "Chỉ ra được 3 đường trong một app Laravel đi vòng qua kiểm tra quyền ở controller"], "children": [{"label": "Ba mô hình", "kind": "topic", "children": []}, {"label": "Kiểm tra ở tầng nào", "kind": "topic", "children": []}, {"label": "Gate và Policy trong Laravel", "kind": "topic", "children": []}, {"label": "Quyền ở mức field", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Lỗ hổng web và API theo OWASP", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "OWASP Top 10 là \"ngôn ngữ chung\" khi nói về lỗ hổng, người phỏng vấn hay bảo \"kể tên\" rồi chọn một mục để đào sâu. Các lỗ hổng như SSRF, <code>unserialize<\/code>, upload file là những thứ backend PHP gặp thật khi làm tính năng webhook, tải ảnh từ URL, import file.", "checks": ["Kể được OWASP Top 10:2025 và nói 3 thay đổi lớn so với bản 2021", "Viết được pseudo-code cho hàm \"tải ảnh từ URL\" chống SSRF, kể cả redirect và DNS rebinding", "Giải thích được vì sao <code>unserialize<\/code> dữ liệu người dùng dẫn tới RCE dù code của bạn không gọi hàm nguy hiểm nào", "Cho 10 endpoint của một app, gán được rủi ro theo OWASP API Top 10 (bài tập 2)"], "children": [{"label": "OWASP Top 10:2025", "kind": "topic", "children": []}, {"label": "OWASP API Security Top 10 (2023)", "kind": "topic", "children": []}, {"label": "SSRF (Server-Side Request Forgery)", "kind": "topic", "children": []}, {"label": "Các lỗi injection khác", "kind": "topic", "children": []}, {"label": "Insecure deserialization", "kind": "topic", "children": []}, {"label": "Mass assignment, open redirect, clickjacking", "kind": "topic", "children": []}, {"label": "File upload", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Header bảo mật, CSRF hiện đại, CORS", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Một phần lớn việc bảo vệ nằm ở header HTTP: trình duyệt làm hộ nếu server bảo nó làm. Laravel 13 đổi cách chống CSRF sang dùng header Fetch Metadata. CORS là thứ backend nào làm API cho SPA cũng phải cấu hình, và cấu hình sai rất phổ biến. Câu hay bị hỏi: \"CORS có chống CSRF không\".", "checks": ["Viết được một resource isolation policy dựa trên <code>Sec-Fetch-Site<\/code> và nói khi nào cần fallback", "Giải thích được vì sao cấu hình CORS sai là lỗ hổng, còn CORS đúng thì không chống được CSRF", "Quét header một site mình làm và giải thích từng dòng còn thiếu"], "children": [{"label": "Fetch Metadata", "kind": "topic", "children": []}, {"label": "Security headers", "kind": "topic", "children": []}, {"label": "CORS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Tầng PHP/Laravel", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là module riêng cho người làm PHP. Laravel làm hộ rất nhiều thứ, nên người phỏng vấn hay hỏi vào chỗ framework làm hộ và chỗ framework <strong>không<\/strong> làm hộ: Sanctum khác Passport ra sao, <code>APP_KEY<\/code> lộ thì sao, <code>==<\/code> của PHP nguy hiểm thế nào.", "checks": ["Chọn đúng giữa session, Sanctum SPA, Sanctum token và Passport cho 4 loại client khác nhau", "Liệt kê được những gì kẻ tấn công làm được khi có <code>APP_KEY<\/code>, và các bước khi phát hiện nó bị lộ", "Review một project Laravel thật, chỉ ra ít nhất 3 điểm trong checklist trên đang sai", "Giải thích được vì sao <code>\"0e1\" == \"0e2\"<\/code> và nó từng gây lỗ hổng so sánh hash thế nào"], "children": [{"label": "PHP core", "kind": "topic", "children": []}, {"label": "Laravel: xác thực", "kind": "topic", "children": []}, {"label": "Laravel: CSRF và authorization", "kind": "topic", "children": []}, {"label": "Laravel: dữ liệu", "kind": "topic", "children": []}, {"label": "Laravel: cấu hình", "kind": "topic", "children": []}, {"label": "Supply chain", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.9 Chống lạm dụng: rate limit, brute force, bot", "kind": "module", "file": "10-security.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Endpoint login, OTP, reset password và các luồng khuyến mãi luôn bị bot tấn công, và đây là chỗ bị lạm dụng tốn tiền thật (SMS, voucher). Người phỏng vấn hay hỏi \"chống brute force thế nào\" rồi hỏi tiếp \"vậy credential stuffing thì sao\".", "checks": ["Thiết kế được bộ rate limit cho login và OTP: key nào, ngưỡng nào, phản hồi gì", "Giải thích được vì sao chặn theo IP không chống được credential stuffing và nêu 3 tín hiệu thay thế"], "children": [{"label": "Rate limit nhiều lớp", "kind": "topic", "children": []}, {"label": "Brute force và credential stuffing", "kind": "topic", "children": []}, {"label": "Account enumeration", "kind": "topic", "children": []}, {"label": "Đào sâu (🔴)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 OAuth nâng cao: token gắn người giữ, PAR, SSO", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Ở hệ thống tài chính, open banking hay khách hàng doanh nghiệp, access token \"ai cầm cũng dùng được\" không còn đủ, và khách doanh nghiệp đòi SSO qua SAML. Senior được hỏi để xem có hiểu giới hạn của bearer token và biết các cơ chế bổ sung, không cần nhớ từng field.", "checks": ["Giải thích được DPoP chặn được gì mà HTTPS + token ngắn hạn không chặn được, và cái giá của nó", "Chọn được DPoP hay mTLS cho 2 bối cảnh cụ thể", "Giải thích được XML signature wrapping bằng hình vẽ"], "children": [{"label": "Bearer token và sender-constrained token", "kind": "topic", "children": []}, {"label": "PAR và token exchange", "kind": "topic", "children": []}, {"label": "SSO và SAML", "kind": "topic", "children": []}, {"label": "Session ở hai tầng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Multi-tenant isolation", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "SaaS B2B gần như luôn là multi-tenant: nhiều công ty khách hàng dùng chung một hệ thống. Lộ dữ liệu giữa tenant là sự cố mất khách lớn nhất. Senior được hỏi chọn mức cô lập nào và làm sao chắc chắn không có query nào quên lọc <code>tenant_id<\/code>.", "checks": ["Chọn và bảo vệ được mức cô lập cho SaaS B2B 500 tenant, trong đó 3 tenant rất lớn", "Liệt kê được 5 chỗ ngoài HTTP controller có thể làm mất <code>tenant_id<\/code> trong một app Laravel"], "children": [{"label": "Ba mức cô lập", "kind": "topic", "children": []}, {"label": "Chung bảng làm sao cho an toàn", "kind": "topic", "children": []}, {"label": "Những chỗ hay lộ", "kind": "topic", "children": []}, {"label": "Noisy neighbor", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Crypto ứng dụng và quản lý key", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi phải lưu số CCCD, số tài khoản ngân hàng hay token của bên thứ ba, \"bật encryption at rest\" là chưa đủ. Senior cần biết chọn thuật toán, quản lý key, rotate key, và tìm kiếm trên dữ liệu đã mã hoá. Câu hay bị hỏi: \"envelope encryption là gì\", \"DB đã mã hoá rồi còn cần gì nữa\".", "checks": ["Vẽ được envelope encryption và luồng rotate KEK", "Thiết kế được cách lưu số CCCD có tìm kiếm chính xác và rotate key (bài tập 4)", "Giải thích được vì sao \"DB đã bật encryption at rest\" không trả lời được câu hỏi \"dữ liệu nhạy cảm có được bảo vệ không\""], "children": [{"label": "Đối xứng và bất đối xứng", "kind": "topic", "children": []}, {"label": "AEAD", "kind": "topic", "children": []}, {"label": "KMS và envelope encryption", "kind": "topic", "children": []}, {"label": "Key rotation", "kind": "topic", "children": []}, {"label": "Encryption at rest không đủ", "kind": "topic", "children": []}, {"label": "Tìm kiếm trên field đã mã hoá", "kind": "topic", "children": []}, {"label": "mTLS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Secret và supply chain", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Lộ secret (commit <code>.env<\/code>, key AWS lên GitHub) và dependency bị chèn mã độc là hai nguồn sự cố lớn hiện nay. Supply chain đã thành mục A03 của OWASP Top 10:2025. Câu hay bị hỏi: \"lỡ push key AWS lên repo public thì làm gì, theo thứ tự nào\".", "checks": ["Kể được từng bước xử lý khi access key AWS bị push lên repo public, theo đúng thứ tự", "Giải thích được dependency confusion và cách chặn với Composer (repository nội bộ, <code>canonical<\/code>)", "Nói được SBOM giúp gì trong 24 giờ đầu sau khi một CVE lớn được công bố"], "children": [{"label": "Lưu secret", "kind": "topic", "children": []}, {"label": "Khi secret lỡ bị commit", "kind": "topic", "children": []}, {"label": "Supply chain (A03:2025)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Dữ liệu cá nhân và pháp lý", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Luật Bảo vệ dữ liệu cá nhân của Việt Nam có hiệu lực từ 01/01/2026, và PII lọt qua log, backup, môi trường staging là chuyện rất thường. Senior được hỏi \"xoá dữ liệu một user thì phải xoá ở đâu\", \"log thế nào để không lộ PII\".", "checks": ["Liệt kê được mọi nơi dữ liệu của một user nằm trong hệ thống của mình, và cách xoá ở từng nơi", "Cấu hình được Monolog processor che field nhạy cảm và chứng minh bằng log thật", "Nói đúng tên, số hiệu và ngày hiệu lực của luật bảo vệ dữ liệu cá nhân Việt Nam"], "children": [{"label": "PII và phân loại", "kind": "topic", "children": []}, {"label": "Masking trong log", "kind": "topic", "children": []}, {"label": "Quyền truy cập và audit log", "kind": "topic", "children": []}, {"label": "Xoá dữ liệu", "kind": "topic", "children": []}, {"label": "Pháp lý, mức \"biết tồn tại\"", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Nguyên tắc, threat modeling, phát hiện", "kind": "module", "file": "10-security.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Ở level senior, câu hỏi chuyển từ \"chặn lỗ hổng X thế nào\" sang \"làm sao biết tính năng mới có những rủi ro gì\" và \"bị tấn công thì phát hiện bằng cách nào\". Threat modeling là kỹ năng senior được kỳ vọng dẫn dắt trong buổi review thiết kế.", "checks": ["Làm được threat model STRIDE cho một tính năng trong 30 phút, có data flow và ranh giới tin cậy (bài tập 5)", "Chỉ ra được 3 chỗ trong code thật đang fail open khi có exception"], "children": [{"label": "Hai nguyên tắc nền", "kind": "topic", "children": []}, {"label": "Threat modeling", "kind": "topic", "children": []}, {"label": "Logging và phát hiện (A09:2025)", "kind": "topic", "children": []}, {"label": "Xử lý lỗi đúng (A10:2025)", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 28, "knowledge": "", "prio": "★★★"}, {"label": "Messaging, event-driven, background job", "kind": "file", "file": "12-messaging.md", "children": [{"label": "1.1 Vì sao cần queue, các mô hình cơ bản", "kind": "module", "file": "12-messaging.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Trong Laravel, gửi email, resize ảnh, gọi webhook hay xuất báo cáo đều nên chạy ở background qua queue, để request của user trả về nhanh. Người phỏng vấn thường mở đầu bằng \"vì sao cần message queue\", rồi hỏi tiếp \"việc nào <strong>không<\/strong> nên đẩy vào queue\" và \"queue khác topic thế nào\". Module này cho bạn từ vựng chung để đọc các module sau.", "checks": ["Cho 5 tính năng, chỉ ra được cái nào nên qua queue, cái nào nên gọi đồng bộ, và vì sao", "Đặt tên đúng event hay command cho 5 message trong một luồng đặt hàng"], "children": [{"label": "Queue giải quyết việc gì", "kind": "topic", "children": []}, {"label": "Queue và topic", "kind": "topic", "children": []}, {"label": "Push và pull", "kind": "topic", "children": []}, {"label": "Event, command, query", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Delivery semantics và idempotent consumer", "kind": "module", "file": "12-messaging.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là ý quan trọng nhất của cả file: mọi broker trên thực tế đều có thể giao <strong>cùng một message hai lần<\/strong>. Job trừ tiền hay gửi email mà không chịu được trùng thì sớm muộn cũng charge khách hai lần. Câu \"làm sao đảm bảo message không bị xử lý hai lần\" gần như chắc chắn gặp, và câu trả lời \"SELECT kiểm tra trước\" là red flag kinh điển.", "checks": ["Viết được đoạn SQL xử lý message idempotent, chỉ ra đúng thứ tự INSERT, UPDATE, COMMIT, ack", "Giải thích được vì sao <code>SELECT<\/code> kiểm tra trước rồi mới xử lý là sai khi có hai consumer", "Nói được với từng side effect (DB, API có idempotency key, email) thì đạt được mức đảm bảo nào"], "children": [{"label": "Ack và ba mức đảm bảo giao", "kind": "topic", "children": []}, {"label": "Vì sao không có exactly-once đầu cuối", "kind": "topic", "children": []}, {"label": "Idempotent consumer", "kind": "topic", "children": []}, {"label": "Các bẫy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Ack, retry, DLQ, poison message", "kind": "module", "file": "12-messaging.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Job lỗi là chuyện hằng ngày: API đối tác timeout, dữ liệu sai định dạng, deadlock. Cách bạn retry quyết định hệ thống tự lành hay tự đốt CPU, và message lỗi hẳn đi đâu. Trong Laravel, <code>failed_jobs<\/code> chính là DLQ. Câu hỏi hay gặp: \"DLQ là gì\", \"lỗi nào nên retry\", \"message làm crash worker thì sao\".", "checks": ["Phân loại được 8 loại lỗi thường gặp thành retry được và không retry được", "Thiết kế được quy trình vận hành DLQ: ai nhận alert, xem ở đâu, redrive thế nào"], "children": [{"label": "Ack và nack", "kind": "topic", "children": []}, {"label": "Retry đúng cách", "kind": "topic", "children": []}, {"label": "DLQ", "kind": "topic", "children": []}, {"label": "Poison message", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Laravel Queue cơ bản", "kind": "module", "file": "12-messaging.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Với người làm PHP, đây là queue bạn dùng hằng ngày. Người phỏng vấn thích hỏi vào chỗ Laravel \"làm hộ\" nhưng có bẫy: job chạy trước khi transaction commit, deploy xong worker vẫn chạy code cũ, job fail ngay lần đầu vì mặc định chỉ thử 1 lần.", "checks": ["Tái hiện được bug \"job gửi email chạy trước khi đơn hàng được commit\" và sửa bằng <code>afterCommit<\/code>", "Giải thích được vì sao deploy mà quên <code>queue:restart<\/code> thì worker chạy code cũ"], "children": [{"label": "Connection, queue, job, worker", "kind": "topic", "children": []}, {"label": "Job lỗi", "kind": "topic", "children": []}, {"label": "SerializesModels", "kind": "topic", "children": []}, {"label": "Dispatch trong transaction", "kind": "topic", "children": []}, {"label": "Chạy worker trên production", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Kafka: mô hình, partition, producer", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Kafka là broker hay xuất hiện nhất trong JD backend, dùng cho event giữa các service, CDC, log, analytics. Mô hình của nó khác hẳn queue kiểu Laravel/RabbitMQ: message không mất đi khi đọc. Câu hỏi hay gặp: \"Kafka đảm bảo thứ tự thế nào\", \"tăng partition thì sao\", \"<code>acks=all<\/code> có chắc không mất dữ liệu không\".", "checks": ["Vẽ được topic 3 partition với 2 consumer group và nói ai nhận message nào", "Chọn được key cho sự kiện đơn hàng và giải thích chuyện gì xảy ra khi tăng từ 12 lên 24 partition", "Nói được bộ cấu hình để chịu một broker chết mà không mất dữ liệu và vẫn ghi được"], "children": [{"label": "Kafka là một log", "kind": "topic", "children": []}, {"label": "Các khái niệm", "kind": "topic", "children": []}, {"label": "Partition, key và thứ tự", "kind": "topic", "children": []}, {"label": "Consumer group và số partition", "kind": "topic", "children": []}, {"label": "Producer: acks", "kind": "topic", "children": []}, {"label": "Producer: idempotence, batching, callback", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Kafka: consumer, offset, rebalance", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Phần lớn bug Kafka ngoài thực tế nằm ở phía consumer: xử lý trùng, mất message vì auto commit, group mới deploy bỏ qua dữ liệu cũ, rebalance liên tục. Câu \"vì sao consumer Kafka hay xử lý trùng, kể hai nguyên nhân\" rất hay gặp, và \"consumer lag\" là metric bạn sẽ bị hỏi khi nói về vận hành.", "checks": ["Kể được 3 nguyên nhân khiến consumer Kafka xử lý trùng và cách sửa từng cái", "Giải thích được vì sao auto commit + xử lý bất đồng bộ có thể <strong>mất<\/strong> message", "Đọc được output <code>kafka-consumer-groups.sh --describe<\/code> và chỉ ra partition nào đang có vấn đề"], "children": [{"label": "Vòng lặp consumer và commit", "kind": "topic", "children": []}, {"label": "Các bẫy về offset", "kind": "topic", "children": []}, {"label": "Consumer lag", "kind": "topic", "children": []}, {"label": "Rebalance", "kind": "topic", "children": []}, {"label": "Xử lý song song và retry", "kind": "topic", "children": []}, {"label": "Log compaction", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 RabbitMQ", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "RabbitMQ là task queue phổ biến khi cần định tuyến linh hoạt (theo loại việc, theo vùng) và retry có delay. Nhiều hệ PHP dùng nó qua php-amqplib. Câu hỏi hay gặp: \"exchange là gì\", \"prefetch đặt bao nhiêu\", \"khi nào RabbitMQ mất message\", và bài job dài bị giao lại do consumer timeout.", "checks": ["Liệt kê được 7 đường mất message trong RabbitMQ và cách chặn từng đường", "Chọn được prefetch cho job xử lý video 10–40 phút và giải thích", "Thiết kế được retry 1 phút, 10 phút, 1 giờ bằng TTL + DLX"], "children": [{"label": "Đường đi của một message", "kind": "topic", "children": []}, {"label": "Ack phía consumer", "kind": "topic", "children": []}, {"label": "Prefetch", "kind": "topic", "children": []}, {"label": "Phía producer: confirm và mandatory", "kind": "topic", "children": []}, {"label": "DLX, TTL và delayed message", "kind": "topic", "children": []}, {"label": "Độ bền và các loại queue", "kind": "topic", "children": []}, {"label": "Khi nào RabbitMQ mất message", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 SQS và SNS", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Trên AWS, SQS là lựa chọn mặc định vì không phải vận hành gì, và Laravel có sẵn driver SQS. Bug kinh điển là job chạy lâu hơn visibility timeout nên bị xử lý hai lần, ví dụ gọi API thanh toán hai lần. Người phỏng vấn cũng hay hỏi các con số giới hạn và khác biệt giữa Standard và FIFO.", "checks": ["Giải thích được bug \"cùng một đơn bị gọi API hai lần\" khi worker xử lý 2 phút với visibility timeout mặc định", "So sánh được message group id trên FIFO và trên fair queue standard: cùng tên, khác mục đích", "Nói đúng các giới hạn: payload, dedup window, delay, retention"], "children": [{"label": "Hai loại queue", "kind": "topic", "children": []}, {"label": "Visibility timeout", "kind": "topic", "children": []}, {"label": "Polling", "kind": "topic", "children": []}, {"label": "DLQ", "kind": "topic", "children": []}, {"label": "Các con số cần nhớ", "kind": "topic", "children": []}, {"label": "Lambda và SNS", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Redis, NATS, database làm queue, và chọn broker", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Không phải hệ thống nào cũng cần Kafka hay RabbitMQ. Laravel chạy queue trên Redis hoặc ngay trên bảng MySQL, và với vài nghìn job mỗi ngày thì như vậy là đủ. Người phỏng vấn muốn thấy bạn chọn broker theo nhu cầu, không theo độ nổi tiếng: \"khi nào Kafka, khi nào RabbitMQ, khi nào SQS\", và red flag là \"Kafka nhanh hơn nên chọn Kafka\".", "checks": ["Chọn được broker cho 4 bối cảnh (vài nghìn job/ngày; task queue trên AWS; CDC sang search; định tuyến theo vùng) và bảo vệ lựa chọn", "Giải thích được vì sao Redis Pub/Sub không dùng cho việc cần tin cậy, còn Streams thì tạm được"], "children": [{"label": "Redis làm queue: ba cách", "kind": "topic", "children": []}, {"label": "NATS", "kind": "topic", "children": []}, {"label": "Database làm queue", "kind": "topic", "children": []}, {"label": "Chọn broker", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Transactional outbox và inbox", "kind": "module", "file": "12-messaging.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Luồng \"tạo đơn xong thì phát event cho kho và email\" có mặt ở mọi hệ thống. Viết ngây thơ \"lưu DB rồi publish\" thì thỉnh thoảng mất event hoặc sinh event ma, và bug này rất khó tái hiện. Transactional outbox là câu trả lời chuẩn, và câu \"làm sao ghi DB và gửi message luôn đi cùng nhau\" là câu mid/senior rất hay gặp.", "checks": ["Giải thích được vì sao cả ba thứ tự dual write đều sai", "Viết được relay polling chạy 2 instance mà không đảo thứ tự của cùng aggregate (bài tập 1)", "Giải thích được bug \"relay thỉnh thoảng bỏ sót event dù dòng vẫn trong bảng\""], "children": [{"label": "Dual write: vì sao mọi thứ tự đều sai", "kind": "topic", "children": []}, {"label": "Transactional outbox", "kind": "topic", 13-concurrency.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đây là phần quan trọng nhất với backend PHP. Bài \"hai request cùng trừ tồn kho\", \"coupon bị dùng hai lần\", \"đăng ký trùng email\" gần như chắc chắn gặp. Người phỏng vấn muốn nghe ít nhất 4 cách sửa kèm nhược điểm của từng cách, và muốn thấy bạn biết đặt chốt chặn cuối ở DB.", "checks": ["Viết được luồng trừ tồn kho theo 4 cách và nói khi nào dùng cách nào", "Sửa được luồng \"đăng ký bằng email\" để hai request song song không tạo hai user", "Giải thích được vì sao \"đã bọc trong transaction\" vẫn bán quá tồn kho"], "children": [{"label": "Code sai kinh điển", "kind": "topic", "children": []}, {"label": "Check-then-act", "kind": "topic", "children": []}, {"label": "Các cách trừ tồn kho", "kind": "topic", "children": []}, {"label": "Unique constraint làm lưới an toàn", "kind": "topic", "children": []}, {"label": "Lock trong bộ nhớ không đủ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Atomic, CAS và optimistic lock", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "CAS là một ý tưởng duy nhất nằm sau ba thứ bạn gặp hằng ngày: biến atomic trong Java/Go, optimistic lock trong DB (cột <code>version<\/code>), và <code>ETag<\/code> ở tầng API. Hiểu một lần là dùng được cả ba. Câu hay gặp: \"optimistic lock và pessimistic lock, khi nào dùng cái nào\".", "checks": ["Viết được vòng lặp CAS tăng một bộ đếm và giải thích vì sao phải lặp", "Thiết kế được luồng sửa sản phẩm của admin có optimistic lock, trả 409 cho UI"], "children": [{"label": "CAS", "kind": "topic", "children": []}, {"label": "Biến atomic trong Java và Go", "kind": "topic", "children": []}, {"label": "Optimistic lock là CAS ở mức dữ liệu", "kind": "topic", "children": []}, {"label": "Chọn optimistic hay pessimistic", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Lost update và isolation level", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Lost update là bug âm thầm: không có lỗi, không có log, chỉ là dữ liệu của một người biến mất. Câu vặn nổi tiếng ở vòng mid/senior là \"MySQL và Postgres cùng ở REPEATABLE READ, hai transaction đọc-sửa-ghi cùng một dòng thì sao\". Trả lời sai câu này là mất điểm nặng.", "checks": ["Tái hiện được bằng hai terminal: lost update ở MySQL RR (không lỗi) và lỗi <code>40001<\/code> ở Postgres RR", "Giải thích được vì sao <code>UPDATE t SET stock = stock - 1<\/code> an toàn ở InnoDB RR còn \"đọc rồi ghi <code>stock = 4<\/code>\" thì không"], "children": [{"label": "Lost update", "kind": "topic", "children": []}, {"label": "Nhắc lại isolation level", "kind": "topic", "children": []}, {"label": "Cùng REPEATABLE READ, hai DB khác nhau", "kind": "topic", "children": []}, {"label": "Write skew", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Double submit, idempotency key", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Khách bị trừ tiền hai lần\" là sự cố nghiêm trọng nhất của mọi hệ thống thanh toán, và nguyên nhân thường là cùng một request được gửi hai lần. Câu \"chống double submit thế nào\" hay gặp ở mức mid. Câu trả lời \"disable nút bấm\" bị coi là red flag.", "checks": ["Thiết kế được bảng idempotency và luồng xử lý đúng khi hai request cùng key đến cùng lúc (bài tập 4)", "Nói được bản ghi idempotency phải tạo trong cùng transaction với việc gì, và khi nào thì không thể"], "children": [{"label": "Vì sao request bị gửi trùng", "kind": "topic", "children": []}, {"label": "Idempotency key", "kind": "topic", "children": []}, {"label": "Hai cạm bẫy", "kind": "topic", "children": []}, {"label": "Mở rộng", "kind": "topic", "children": []}, {"label": "Queue worker cũng cần idempotency", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Thread pool, connection pool, Little's law", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đặt <code>pm.max_children<\/code> bao nhiêu, pool DB bao nhiêu connection là việc bạn làm thật khi vận hành PHP-FPM và Laravel. Làm sai theo hướng \"cứ tăng lên\" thường làm hệ thống chậm hơn. Người phỏng vấn muốn thấy bạn tính bằng công thức và nêu giả định, không đưa ra một con số cố định.", "checks": ["Tính được kích thước thread pool và connection pool cho một service cụ thể và nêu giả định (bài tập 3)", "Giải thích được vì sao tăng <code>pm.max_children<\/code> có thể làm hệ thống <strong>chậm hơn<\/strong>"], "children": [{"label": "Vì sao cần pool", "kind": "topic", "children": []}, {"label": "Chọn kích thước pool", "kind": "topic", "children": []}, {"label": "Little's law", "kind": "topic", "children": []}, {"label": "Nhìn cả chuỗi", "kind": "topic", "children": []}, {"label": "Queue chờ và chính sách từ chối", "kind": "topic", "children": []}, {"label": "Pool dùng chung và bulkhead", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Pattern concurrency trong Go (và đối chiếu Java)", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Nếu bạn phỏng vấn vị trí Go, hoặc viết service phụ bằng Go cạnh hệ PHP, thì worker pool và <code>errgroup<\/code> là thứ dùng hằng ngày. Goroutine rẻ nên rất dễ tạo quá nhiều và làm sập dependency. Câu hay gặp: \"viết worker pool có giới hạn và huỷ được\".", "checks": ["Viết được worker pool có giới hạn, huỷ bằng <code>context<\/code>, trả lỗi đầu tiên bằng <code>errgroup<\/code>", "Chỉ ra được goroutine leak trong một pipeline khi consumer thoát sớm, và sửa được"], "children": [{"label": "Worker pool", "kind": "topic", "children": []}, {"label": "Giới hạn concurrency", "kind": "topic", "children": []}, {"label": "Fan-out/fan-in và pipeline", "kind": "topic", "children": []}, {"label": "Bẫy thường gặp", "kind": "topic", "children": []}, {"label": "Channel hay mutex", "kind": "topic", "children": []}, {"label": "Đối chiếu Java", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Mô hình chạy: process, thread, event loop, goroutine, virtual thread", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Mô hình chạy quyết định một request chậm ảnh hưởng tới các request khác thế nào, và quyết định bạn tính RAM, số worker ra sao. Câu \"PHP-FPM, Node.js, Go khác nhau thế nào khi xử lý nhiều request\" và \"event loop bị chặn thì sao\" hay gặp. Ứng viên có nền Java còn hay bị hỏi về virtual thread.", "checks": ["So sánh được chi phí bộ nhớ và cách chặn I/O của 5 mô hình trong bảng", "Giải thích được chuyện gì xảy ra khi một request làm việc CPU 2 giây trong event loop, và trong PHP-FPM", "Nói đúng trạng thái pinning của virtual thread theo phiên bản JDK"], "children": [{"label": "Các khái niệm cần biết trước", "kind": "topic", "children": []}, {"label": "So sánh năm mô hình", "kind": "topic", "children": []}, {"label": "Virtual thread chi tiết", "kind": "topic", "children": []}, {"label": "Ý chính", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Tầng PHP: FPM, Laravel, Octane, async", "kind": "module", "file": "13-concurrency.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Câu \"PHP có race condition không?\" gần như chắc chắn bị hỏi, và câu trả lời \"không, vì PHP không có thread\" là red flag. Laravel có sẵn nhiều công cụ chống race; biết dùng đúng cái nào cho việc nào là điều phân biệt mid với junior.", "checks": ["Viết được luồng áp coupon bằng <code>lockForUpdate()<\/code> và bằng unique constraint, nói cách nào là chốt chặn cuối", "Phân biệt được <code>ShouldBeUnique<\/code> và <code>WithoutOverlapping<\/code> bằng một ví dụ job mỗi cái chặn được", "Chỉ ra được 2 bug chỉ xuất hiện khi chuyển app Laravel sang Octane"], "children": [{"label": "PHP-FPM share-nothing", "kind": "topic", "children": []}, {"label": "Công cụ chống race trong Laravel", "kind": "topic", "children": []}, {"label": "Session và file", "kind": "topic", "children": []}, {"label": "Octane: khi PHP có state dùng chung", "kind": "topic", "children": []}, {"label": "Concurrency trong một process PHP", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Memory model", "kind": "module", "file": "13-concurrency.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Người phỏng vấn có nền Java/Go hay hỏi \"<code>volatile<\/code> đảm bảo gì\" hoặc \"vì sao vòng lặp này không bao giờ dừng\". Với PHP-FPM bạn không gặp chuyện này, nhưng ở Octane, Swoole, hay khi viết service Go thì có. Đây là phần giải thích <em>vì sao<\/em> data race nguy hiểm hơn bạn nghĩ.", "checks": ["Viết được ví dụ vòng lặp <code>while (!stop)<\/code> không bao giờ dừng và sửa bằng <code>volatile<\/code> / <code>atomic.Bool<\/code>", "Giải thích được vì sao double-checked locking thiếu <code>volatile<\/code> có thể trả object chưa khởi tạo xong"], "children": [{"label": "Vấn đề: thread không tự thấy ghi của nhau", "kind": "topic", "children": []}, {"label": "Happens-before", "kind": "topic", "children": []}, {"label": "Java Memory Model (JMM)", "kind": "topic", "children": []}, {"label": "Go memory model", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Lock-free, ABA, spinlock", "kind": "module", "file": "13-concurrency.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Backend hiếm khi tự viết code lock-free, nhưng vấn đề ABA có bản sao ở tầng DB: optimistic lock so sánh sai cột sẽ gặp đúng lỗi này. Câu \"CAS là gì, ABA là gì\" hay xuất hiện ở vòng senior Java/Go.", "checks": ["Vẽ được kịch bản ABA trên lock-free stack và trên cột <code>status<\/code> của một đơn hàng", "Giải thích được vì sao <code>LongAdder<\/code> nhanh hơn <code>AtomicLong<\/code> khi tranh chấp cao"], "children": [{"label": "Lock-free và wait-free", "kind": "topic", "children": []}, {"label": "Vấn đề ABA", "kind": "topic", "children": []}, {"label": "Spinlock", "kind": "topic", "children": []}, {"label": "Ví dụ thực tế trong Java", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Priority inversion, bulkhead, actor model", "kind": "module", "file": "13-concurrency.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Câu chuyện Mars Pathfinder là ví dụ kinh điển, nhưng điều người phỏng vấn senior muốn nghe là bản ở tầng hệ thống: job batch chiếm hết connection pool làm request thanh toán phải chờ, SMS OTP đứng sau chiến dịch marketing. Actor model giải thích vì sao \"mỗi entity một writer\" loại bỏ được tranh chấp.", "checks": ["Kể được một \"priority inversion\" ở mức hệ thống backend và cách tách tài nguyên để chặn"], "children": [{"label": "Priority inversion", "kind": "topic", "children": []}, {"label": "Bản ở tầng backend và bulkhead", "kind": "topic", "children": []}, {"label": "Actor model (đại ý)", "kind": "topic", "children": []}, {"label": "\"Một writer cho mỗi entity\" ở quy mô hệ thống", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Tranh chấp cực cao: flash sale, hot row", "kind": "module", "file": "13-concurrency.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Flash sale là bài system design rất hay gặp ở công ty thương mại điện tử Việt Nam. Nó gom mọi thứ ở các module trước: atomic update, Redis, queue, unique constraint. Người phỏng vấn muốn thấy bạn chặn ở nhiều tầng, không dồn hết vào DB.", "checks": ["Vẽ được luồng flash sale 100 sản phẩm / 10.000 người và chỉ ra chốt chặn ở từng tầng", "Nói được Redis lệch DB theo hướng nào thì chấp nhận được, hướng nào không"], "children": [{"label": "Vì sao cách thông thường sập", "kind": "topic", "children": []}, {"label": "Chặn sớm", "kind": "topic", "children": []}, {"label": "Luồng trừ tồn kho nhiều tầng", "kind": "topic", "children": []}, {"label": "Giữ chỗ và đối soát", "kind": "topic", "children": []}, {"label": "Chia nhỏ điểm nóng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Kiểm thử và điều tra lỗi concurrency", "kind": "module", "file": "13-concurrency.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Bug concurrency hiếm khi hiện ra khi test bằng tay, và chạy test nhiều lần thấy pass không chứng minh gì. Senior phải biết công cụ của từng ngôn ngữ, biết cách tái hiện race trong app web, và hiểu giới hạn của công cụ. Câu \"Java có race detector như Go không\" là câu bẫy hay gặp.", "checks": ["Tạo và bắt được data race bằng <code>-race<\/code>, rồi sửa bằng ba cách (bài tập 1)", "Viết được test dùng <code>synctest<\/code> cho một hàm có timeout 5 giây mà test chạy dưới 1 giây", "Tái hiện được race coupon trên app Laravel bằng 20 request song song"], "children": [{"label": "Go", "kind": "topic", "children": []}, {"label": "Java", "kind": "topic", "children": []}, {"label": "Database", "kind": "topic", "children": []}, {"label": "Tái hiện race trong app web", "kind": "topic", "children": []}, {"label": "Giới hạn của test", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 26, "knowledge": "", "prio": "★★★"}, {"label": "Hệ phân tán", "kind": "file", "file": "14-distributed-systems.md", "children": [{"label": "1.1 Bản chất: partial failure và \"không biết request có thành công không\"", "kind": "module", "file": "14-distributed-systems.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Một app Laravel gọi cổng thanh toán (PSP), API vận chuyển, dịch vụ SMS đã là một hệ phân tán. Mọi bug kiểu \"khách bị trừ tiền mà không có đơn\" hay \"đơn bị tạo hai lần\" đều bắt nguồn từ việc bên gọi không biết request có thành công hay không. Câu \"gọi PSP bị timeout, bạn làm gì\" rất hay gặp, và trả lời \"retry 3 lần\" là red flag.", "checks": ["Với mỗi fallacy, kể được một bug cụ thể trong code PHP/Laravel", "Liệt kê được 3 khả năng khi gọi PSP bị timeout, và việc phải làm cho từng khả năng"], "children": [{"label": "Hệ phân tán và tám giả định sai", "kind": "topic", "children": []}, {"label": "Partial failure", "kind": "topic", "children": []}, {"label": "Timeout: bên gọi không thể biết", "kind": "topic", "children": []}, {"label": "Two generals", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Timeout, retry, backoff, jitter, idempotency", "kind": "module", "file": "14-distributed-systems.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đặt timeout và retry là việc bạn làm mỗi lần viết <code>Http::get()<\/code> hay cấu hình queue job. Làm sai theo một hướng thì một dependency chậm kéo sập cả site; sai theo hướng kia thì retry dồn dập làm dependency đang yếu chết hẳn. Câu \"exponential backoff là gì, vì sao cần jitter\" rất hay gặp ở mức junior.", "checks": ["Viết được pseudo-code HTTP client có timeout, full jitter, chỉ retry lỗi tạm thời (bài tập 2)", "Tính được số request dồn xuống DB khi 3 tầng mỗi tầng retry 3 lần, và nói nên giữ retry ở tầng nào"], "children": [{"label": "Timeout", "kind": "topic", "children": []}, {"label": "Retry cái gì", "kind": "topic", "children": []}, {"label": "Backoff và jitter", "kind": "topic", "children": []}, {"label": "Retry ở nhiều tầng", "kind": "topic", "children": []}, {"label": "Idempotency là điều kiện để retry an toàn", "kind": "topic", "children": []}, {"label": "Trong Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 CAP và PACELC", "kind": "module", "file": "14-distributed-systems.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "CAP là câu gần như chắc chắn bị hỏi, và là câu mà phần lớn ứng viên trả lời sai bằng \"chọn 2 trong 3\". Hiểu đúng CAP giúp bạn nói rõ khi chọn DB hay thiết kế multi-region: khi mạng đứt thì hệ thống nên từ chối hay trả dữ liệu cũ.", "checks": ["Giải thích được CAP trong 2 phút bằng ví dụ hai data center mất kết nối, không dùng câu \"chọn 2 trong 3\"", "Nói được vì sao \"MongoDB là CP, Cassandra là AP\" là cách nói quá đơn giản"], "children": [{"label": "Định nghĩa chặt", "kind": "topic", "children": []}, {"label": "Hiểu đúng CAP", "kind": "topic", "children": []}, {"label": "Không có DB nào thuần CP hay AP", "kind": "topic", "children": []}, {"label": "PACELC", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Replication cơ bản và replication lag", "kind": "module", "file": "14-distributed-systems.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "App Laravel lớn gần như luôn có MySQL primary kèm vài replica để đọc. Bug \"đăng bài xong F5 thì bài biến mất\" là do replication lag, và là câu phỏng vấn rất hay gặp. Nguy hiểm hơn là đọc tồn kho từ replica rồi quyết định bán, hoặc mất đơn đã xác nhận sau khi failover.", "checks": ["Thiết kế được read-your-writes cho app Laravel 1 primary + 3 replica", "Giải thích được vì sao sau failover async, khách đã nhận xác nhận mà đơn biến mất"], "children": [{"label": "Primary–replica", "kind": "topic", "children": []}, {"label": "Sync, async, semi-sync", "kind": "topic", "children": []}, {"label": "Replication lag gây ra gì", "kind": "topic", "children": []}, {"label": "Read-your-writes", "kind": "topic", "children": []}, {"label": "Monotonic reads", "kind": "topic", "children": []}, {"label": "Eventual không có nghĩa là nhanh", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Consistency model, linearizability và serializability", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi chọn cache, replica hay DB phân tán, câu hỏi thật là \"người dùng có thể thấy dữ liệu sai theo kiểu nào\". Consistency model là từ vựng để trả lời câu đó. Câu vặn kinh điển ở vòng senior: \"linearizability và serializability khác nhau thế nào\".", "checks": ["Phân biệt được linearizability và serializability bằng một ví dụ hệ thống có cái này mà không có cái kia", "Đọc bản đồ trên jepsen.io và chỉ ra model nào mạnh hơn model nào"], "children": [{"label": "Consistency model là gì", "kind": "topic", "children": []}, {"label": "Linearizability khác serializability", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Ba kiểu replication và quorum", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi đánh giá Cassandra, DynamoDB hay một hệ multi-region, bạn cần biết ai được ghi và xung đột được xử lý ra sao. Câu \"<code>R + W &gt; N<\/code> có đảm bảo đọc mới nhất không\" và \"DynamoDB có leaderless như Cassandra không\" là hai câu bẫy hay gặp.", "checks": ["Liệt kê được các cặp (R, W) với N=3 và số node chết chịu được (bài tập 3)", "Nêu được 3 kịch bản <code>R + W &gt; N<\/code> vẫn đọc ra dữ liệu cũ", "Giải thích được khác biệt kiến trúc giữa Dynamo (paper) và DynamoDB (dịch vụ)"], "children": [{"label": "Ba kiểu replication", "kind": "topic", "children": []}, {"label": "DynamoDB không phải leaderless", "kind": "topic", "children": []}, {"label": "Quorum", "kind": "topic", "children": []}, {"label": "Sửa dữ liệu lệch giữa các replica", "kind": "topic", "children": []}, {"label": "R + W > N vẫn không đảm bảo linearizable", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Partitioning, consistent hashing, rebalancing", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Redis Cluster, Kafka, Elasticsearch, và sharding MySQL đều chia dữ liệu theo một key. Chọn sai key thì một shard nóng rực còn các shard khác ngồi chơi. Câu \"consistent hashing là gì, vì sao không dùng <code>hash % N<\/code>\" rất hay gặp trong bài system design.", "checks": ["Vẽ được vòng consistent hashing, thêm một node và chỉ ra key nào di chuyển", "Chọn được partition key cho bảng đơn hàng và nói nó hot ở đâu"], "children": [{"label": "Range và hash", "kind": "topic", "children": []}, {"label": "Vì sao không dùng hash(key) % N", "kind": "topic", "children": []}, {"label": "Consistent hashing", "kind": "topic", "children": []}, {"label": "Số partition cố định", "kind": "topic", "children": []}, {"label": "Hot key", "kind": "topic", "children": []}, {"label": "Secondary index trên dữ liệu đã chia", "kind": "topic", "children": []}, {"label": "Rebalance tự động", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Distributed transaction: 2PC, saga, outbox, TCC", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi tách monolith Laravel thành nhiều service, luồng \"đặt hàng, trừ tiền, trừ kho\" không còn nằm trong một <code>DB::transaction()<\/code> được nữa. Câu \"làm sao nhất quán giữa ba service\" gần như chắc chắn gặp ở vòng mid/senior. Trả lời \"dùng distributed transaction\" mà không biết cái giá của nó là red flag.", "checks": ["Vẽ được sơ đồ trạng thái saga có compensation, bước pivot, và xử lý compensation lỗi (bài tập 1)", "Giải thích được chính xác thời điểm 2PC bị kẹt và ai đang giữ khoá"], "children": [{"label": "2PC (two-phase commit)", "kind": "topic", "children": []}, {"label": "Saga", "kind": "topic", "children": []}, {"label": "Outbox", "kind": "topic", "children": []}, {"label": "Đào sâu (🔴): TCC", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Distributed lock", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "<code>Cache::lock()<\/code> trên Redis là thứ dev Laravel dùng rất nhiều cho job đồng bộ, chống chạy trùng. Nhưng lock có TTL có thể hết hạn giữa chừng, và hai pod cùng chạy một việc. Câu \"làm distributed lock bằng Redis thế nào cho đúng\" hay gặp ở mức mid, còn fencing token và Redlock là phần đào sâu ở vòng senior.", "checks": ["Vẽ được timeline GC pause làm hai process cùng ghi, và chỉ ra fencing token chặn ở đâu", "Phân loại được 3 use case trong hệ thống của mình: lock cho hiệu quả hay cho đúng đắn", "Viết được Lua release lock và giải thích vì sao không dùng <code>GET<\/code> + <code>DEL<\/code>"], "children": [{"label": "Lock bằng Redis", "kind": "topic", "children": []}, {"label": "Lease", "kind": "topic", "children": []}, {"label": "Lock hết hạn khi việc chưa xong", "kind": "topic", "children": []}, {"label": "Lock bằng DB và ZooKeeper", "kind": "topic", "children": []}, {"label": "Kết luận thực dụng", "kind": "topic", "children": []}, {"label": "Đào sâu (🔴): fencing token và Redlock", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Resilience: circuit breaker, bulkhead, rate limit, load shedding", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Sự cố \"service gợi ý chậm làm cả trang chủ timeout\" là kiểu sự cố hay gặp nhất khi hệ thống có nhiều dependency. Các pattern ở module này là cách chặn một chỗ hỏng lan ra toàn hệ thống. Câu \"circuit breaker hoạt động thế nào\" hay gặp ở mức mid.", "checks": ["Vẽ được state machine của circuit breaker và nói ngưỡng nào mình sẽ chọn cho một dependency cụ thể", "Vẽ được chuỗi cascading failure \"service gợi ý chậm làm trang chủ timeout\" và chặn ở từng bước"], "children": [{"label": "Cascading failure: vấn đề cần giải", "kind": "topic", "children": []}, {"label": "Circuit breaker", "kind": "topic", "children": []}, {"label": "Bulkhead", "kind": "topic", "children": []}, {"label": "Rate limiting", "kind": "topic", "children": []}, {"label": "Load shedding", "kind": "topic", "children": []}, {"label": "Graceful degradation và fallback", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Sinh ID phân tán", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi có nhiều service hoặc nhiều shard cùng tạo bản ghi, auto-increment của một DB không còn đủ. Chọn sai kiểu ID làm chậm insert (UUIDv4 trong InnoDB), lộ thông tin kinh doanh, hoặc gây hot partition. Câu \"Snowflake gồm những phần nào\" hay gặp ở mức mid.", "checks": ["Thiết kế được bộ sinh Snowflake cho 1.000 pod: cấp machine id, xử lý đồng hồ lùi, chọn epoch (bài tập 4)", "Tranh luận được UUIDv7 hay Snowflake cho bảng orders MySQL"], "children": [{"label": "Các loại ID", "kind": "topic", "children": []}, {"label": "Snowflake", "kind": "topic", "children": []}, {"label": "Lộ thông tin", "kind": "topic", "children": []}, {"label": "ID tăng dần và partition", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Service discovery, health check, graceful shutdown", "kind": "module", "file": "14-distributed-systems.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Deploy app Laravel lên Kubernetes mà cấu hình probe sai là nguồn sự cố phổ biến: pod bị restart hàng loạt khi DB chậm, hoặc rớt request mỗi lần deploy. Câu \"liveness và readiness khác nhau thế nào\" hay gặp ở mức mid.", "checks": ["Viết được endpoint liveness và readiness cho app Laravel, nói mỗi cái kiểm tra gì và không kiểm tra gì", "Kể được từng bước từ lúc pod nhận SIGTERM tới lúc thoát mà không rớt request"], "children": [{"label": "Service discovery", "kind": "topic", "children": []}, {"label": "Liveness, readiness, startup", "kind": "topic", "children": []}, {"label": "Graceful shutdown", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Consensus và Raft", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "etcd (nơi Kubernetes lưu state), ZooKeeper, Kafka KRaft, và mọi DB phân tán đều dựa trên consensus. Bạn không tự cài Raft, nhưng senior phải giải thích được vì sao cluster cần số node lẻ, split brain là gì, và leader cũ bị cô lập có ghi được không. Đây là nơi người phỏng vấn senior đào sâu nhất.", "checks": ["Vẽ được một lần bầu leader và một lần commit entry với 5 node, có một node chết giữa chừng", "Giải thích được vì sao leader cũ bị cô lập không thể commit, và pre-vote chặn vấn đề gì", "Nói được FLP nghĩa là gì trong thực tế, không nói \"consensus là bất khả thi\""], "children": [{"label": "Consensus là gì", "kind": "topic", "children": []}, {"label": "FLP impossibility", "kind": "topic", "children": []}, {"label": "Raft: vai trò, term và bầu leader", "kind": "topic", "children": []}, {"label": "Raft: replicate log và pre-vote", "kind": "topic", "children": []}, {"label": "Quorum, số node và đánh đổi", "kind": "topic", "children": []}, {"label": "Split brain", "kind": "topic", "children": []}, {"label": "etcd, ZooKeeper, Paxos", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Thời gian và thứ tự sự kiện", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Dùng <code>created_at<\/code> hay <code>now()<\/code> để quyết định \"cái nào xảy ra trước\" giữa nhiều server là bug phổ biến: bản ghi mới bị bản cũ đè, log hiện response trước request. Câu \"vì sao không dùng timestamp để sắp thứ tự sự kiện giữa nhiều máy\" hay gặp ở vòng senior.", "checks": ["Tính được Lamport timestamp cho một chuỗi message giữa 3 node, và chỉ ra cặp sự kiện đồng thời mà Lamport không phân biệt được", "Giải thích được vì sao Spanner cần commit wait"], "children": [{"label": "Đồng hồ không tin được", "kind": "topic", "children": []}, {"label": "LWW sai vì đồng hồ lệch", "kind": "topic", "children": []}, {"label": "Lamport clock", "kind": "topic", "children": []}, {"label": "Vector clock", "kind": "topic", "children": []}, {"label": "Đồng hồ trong DB phân tán", "kind": "topic", "children": []}, {"label": "Thực dụng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Transaction xuyên shard", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi MySQL đã shard, hoặc khi dùng TiDB, CockroachDB, Spanner, sẽ có lúc một transaction chạm hai shard. Senior cần hiểu các DB này làm việc đó thế nào, và vì sao 2PC ở đây không bị kẹt như 2PC giữa microservice. Ở tầng ứng dụng, câu trả lời tốt nhất thường là chọn shard key để tránh hẳn chuyện này.", "checks": ["Vẽ được luồng Percolator: prewrite primary/secondary, commit primary, và cách transaction khác xử lý lock bỏ dở", "Giải thích được vì sao 2PC trong Spanner không blocking theo kiểu 2PC cổ điển"], "children": [{"label": "Bài toán", "kind": "topic", "children": []}, {"label": "Vì sao 2PC trong DB phân tán không bị kẹt", "kind": "topic", "children": []}, {"label": "Percolator", "kind": "topic", "children": []}, {"label": "Spanner và CockroachDB", "kind": "topic", "children": []}, {"label": "Ở tầng ứng dụng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Conflict resolution", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Hệ multi-region cho ghi ở nhiều nơi, app offline-first, hay collaborative editing đều phải trả lời \"hai bản ghi đồng thời thì giữ bản nào\". Chọn LWW mà không biết nó âm thầm mất dữ liệu là lỗi hay gặp. Câu \"vì sao không dùng CRDT cho số dư\" là câu kiểm tra hiểu giới hạn.", "checks": ["Mô phỏng được giỏ hàng hai DC với version vector, chỉ ra lúc nào sinh sibling", "Giải thích được vì sao không dùng CRDT cho số dư tài khoản"], "children": [{"label": "LWW", "kind": "topic", "children": []}, {"label": "Version vector", "kind": "topic", "children": []}, {"label": "CRDT", "kind": "topic", "children": []}, {"label": "Thực dụng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Failure mode nâng cao", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Sự cố lớn nhất thường không đến từ một máy chết, mà từ vòng phản hồi: retry làm tải tăng, tải tăng làm thêm lỗi, lỗi lại sinh thêm retry. Senior được kỳ vọng nhận ra kiểu sự cố này và biết cách cắt vòng. Câu tình huống \"xoá cache xong hệ thống không hồi phục\" hay gặp.", "checks": ["Vẽ được vòng phản hồi của một metastable failure và chỉ ra điểm cắt", "Đọc postmortem GitHub 2018 và chỉ ra chỗ nào là partition, split brain, mất ghi"], "children": [{"label": "Retry storm và retry budget", "kind": "topic", "children": []}, {"label": "Hedged requests", "kind": "topic", "children": []}, {"label": "Metastable failure", "kind": "topic", "children": []}, {"label": "Shuffle sharding", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Membership, leader election, exactly-once", "kind": "module", "file": "14-distributed-systems.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Scheduler Laravel chạy trên nhiều pod, consumer chỉ được chạy một bản, là bài toán leader election thật. Còn \"exactly-once\" là từ hay bị dùng sai: người phỏng vấn senior muốn nghe bạn phân biệt giao đúng một lần (không làm được) với hiệu ứng đúng một lần (làm được).", "checks": ["Thiết kế được leader election cho một scheduler Laravel chạy trên 3 pod, có xử lý leader cũ chưa biết mình mất quyền", "Giải thích được bằng end-to-end argument vì sao Kafka EOS không giúp gì khi consumer ghi vào MySQL"], "children": [{"label": "Leader election", "kind": "topic", "children": []}, {"label": "Gossip và failure detector", "kind": "topic", "children": []}, {"label": "Exactly-once", "kind": "topic", "children": []}, {"label": "End-to-end argument", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 27, "knowledge": "", "prio": "★★★"}, {"label": "Kiến trúc phần mềm", "kind": "file", "file": "15-architecture.md", "children": [{"label": "1.1 Layered, MVC và nơi đặt logic nghiệp vụ", "kind": "module", "file": "15-architecture.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "\"Logic nghiệp vụ đặt ở đâu\" là tranh cãi có mặt trong gần như mọi code review của dự án Laravel. Khi controller hay model phình tới vài nghìn dòng thì sửa một chỗ vỡ ba chỗ và rất khó viết test. Phỏng vấn thường hỏi \"controller, service, repository mỗi tầng làm gì\", rồi hỏi tiếp \"có phải lúc nào cũng cần tầng service không\".", "checks": ["Lấy một controller dày trong dự án, tách được thành FormRequest + Action + Event mà hành vi không đổi", "Gọi được cùng một use case từ controller, job và Artisan command mà không copy code", "Giải thích được vì sao \"MVC\" không đủ làm kiến trúc cho một app nghiệp vụ lớn"], "children": [{"label": "Kiến trúc phân tầng", "kind": "topic", "children": []}, {"label": "Controller làm gì, không làm gì", "kind": "topic", "children": []}, {"label": "MVC không phải là kiến trúc cho nghiệp vụ", "kind": "topic", "children": []}, {"label": "Application service và domain service", "kind": "topic", "children": []}, {"label": "Công cụ của Laravel cho từng việc", "kind": "topic", "children": []}, {"label": "Khi nào không cần nhiều tầng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Monolith, 12-factor và app stateless", "kind": "module", "file": "15-architecture.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Đa số dự án PHP đang chạy là monolith, và câu \"monolith có gì tốt\" dùng để kiểm tra bạn có nghĩ bằng trade-off hay chỉ theo trào lưu. Khi đưa app lên nhiều server hoặc lên Kubernetes, các lỗi kiểu \"đăng nhập xong bị đá ra\" hay \"file upload lúc có lúc không\" đều bắt nguồn từ việc app chưa stateless. Octane và queue worker thêm một loại bug mà PHP-FPM không có.", "checks": ["Chỉ ra được 3 chỗ trong app Laravel của mình vi phạm stateless và cách sửa", "Tái hiện được một bug rò state giữa request khi chạy Octane (singleton giữ user hiện tại)", "Kể được 5 ưu điểm thật của monolith mà không dùng từ \"đơn giản\""], "children": [{"label": "Monolith là gì và tốt ở đâu", "kind": "topic", "children": []}, {"label": "12-factor app", "kind": "topic", "children": []}, {"label": "Stateless", "kind": "topic", "children": []}, {"label": "Process sống lâu: Octane và queue worker", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Configuration và feature flag", "kind": "module", "file": "15-architecture.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Bug \"chạy local được, lên production thì <code>env()<\/code> trả <code>null<\/code>\" là bug kinh điển của Laravel. Feature flag là cách các team deploy hằng ngày mà vẫn kiểm soát được rủi ro, và là công cụ chính khi migrate dần từ hệ cũ sang hệ mới. Câu hỏi thường gặp: \"deploy khác release thế nào\", \"flag service chết thì sao\".", "checks": ["Giải thích được vì sao <code>env('X')<\/code> trong controller trả <code>null<\/code> sau khi deploy", "Thiết kế được rollout một tính năng theo 1% → 10% → 100% bằng Pennant, có kill switch và kế hoạch xoá flag"], "children": [{"label": "Config và secret", "kind": "topic", "children": []}, {"label": "Bẫy env() của Laravel", "kind": "topic", "children": []}, {"label": "Config động", "kind": "topic", "children": []}, {"label": "Feature flag", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Hexagonal, Clean, Onion, vertical slice", "kind": "module", "file": "15-architecture.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi nghiệp vụ phức tạp dần (thanh toán, tính giá, đối soát), bạn cần test quy tắc nghiệp vụ mà không phải dựng DB hay gọi Stripe thật. Hexagonal và clean architecture giải quyết đúng việc đó. Câu hỏi hay gặp: \"hexagonal khác layered ở đâu\" và \"có nên dùng Clean Architecture cho Laravel không\", với đáp án tốt phải nói được cái giá.", "checks": ["Vẽ được hexagon cho module thanh toán: các port vào/ra và adapter tương ứng", "Viết được test cho một use case chỉ dùng adapter in-memory, không cần DB", "Phản biện được đề xuất \"hexagonal cho toàn bộ admin CRUD 40 màn hình\" bằng chi phí/lợi ích"], "children": [{"label": "Hexagonal (ports & adapters)", "kind": "topic", "children": []}, {"label": "Clean và Onion", "kind": "topic", "children": []}, {"label": "Vertical slice", "kind": "topic", "children": []}, {"label": "So sánh", "kind": "topic", "children": []}, {"label": "Cái giá", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 DDD tactical và DDD trong Laravel", "kind": "module", "file": "15-architecture.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "DDD tactical cho bạn bộ từ vựng để thiết kế phần nghiệp vụ lõi: gom dữ liệu nào vào một transaction, đặt quy tắc ở đâu, phát event lúc nào. Trong Laravel, các lỗi như \"event đã gửi mail nhưng transaction rollback\" hay \"khoá tranh chấp liên tục trên bảng khách hàng\" đều liên quan tới phần này. Câu hỏi hay gặp: \"entity khác value object thế nào\", \"aggregate là gì\".", "checks": ["Mô hình hoá được aggregate <code>Order<\/code>: invariant, entity, value object, domain event (bài tập 3)", "Giải thích được vì sao <code>Order<\/code> không nên chứa object <code>Customer<\/code> mà chỉ <code>customer_id<\/code>", "Viết được <code>Money<\/code> làm custom cast Eloquent và một method trên model bảo vệ invariant"], "children": [{"label": "Entity và value object", "kind": "topic", "children": []}, {"label": "Aggregate", "kind": "topic", "children": []}, {"label": "Bốn quy tắc aggregate của Vaughn Vernon", "kind": "topic", "children": []}, {"label": "Domain event", "kind": "topic", "children": []}, {"label": "Repository theo nghĩa DDD", "kind": "topic", "children": []}, {"label": "Anemic và rich domain model", "kind": "topic", "children": []}, {"label": "DDD trong Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Modular monolith", "kind": "module", "file": "15-architecture.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Modular monolith là bước đi thực tế nhất cho một monolith Laravel đang rối: có ranh giới rõ như microservices nhưng vẫn giữ chi phí vận hành của monolith. Câu \"monolith 5 năm tuổi, nên tách microservices không\" ở vòng senior thường có đáp án tốt bắt đầu từ đây.", "checks": ["Cấu hình được Deptrac cấm module <code>Billing<\/code> dùng class nội bộ của <code>Order<\/code>, và CI fail khi vi phạm", "Liệt kê được mọi chỗ JOIN chéo module trong dự án mình và kế hoạch gỡ từng chỗ", "Viết được RFC chuyển một monolith (Order, Payment, Notification) sang modular monolith (bài tập 4)"], "children": [{"label": "Modular monolith là gì", "kind": "topic", "children": []}, {"label": "Quy tắc giữa các module", "kind": "topic", "children": []}, {"label": "Cưỡng chế bằng công cụ", "kind": "topic", "children": []}, {"label": "Tổ chức module trong Laravel", "kind": "topic", "children": []}, {"label": "Lợi ích và case study", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Microservices và giao tiếp giữa service", "kind": "module", "file": "15-architecture.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Lợi ích và cái giá của microservices\" là câu gần như chắc chắn gặp ở vòng mid trở lên, và red flag lớn nhất là trả lời \"vì scale tốt, hiện đại\". Khi làm việc với nhiều service, bạn cần biết chọn gọi sync hay async, vì sao cần timeout, và các thành phần như gateway, service mesh làm gì.", "checks": ["Tính được availability của một chuỗi gọi sync và đề xuất chỗ chuyển sang async", "Nêu được điều kiện tiên quyết còn thiếu trong tổ chức mình trước khi tách service", "So sánh được sidecar và ambient mode về tài nguyên, cách nâng cấp và phạm vi L4/L7"], "children": [{"label": "Lợi ích và cái giá", "kind": "topic", "children": []}, {"label": "Sync và async", "kind": "topic", "children": []}, {"label": "Orchestration và choreography", "kind": "topic", "children": []}, {"label": "Gateway, BFF, service discovery", "kind": "topic", "children": []}, {"label": "Service mesh", "kind": "topic", "children": []}, {"label": "Database per service", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Multi-tenancy", "kind": "module", "file": "15-architecture.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Hầu hết sản phẩm SaaS B2B đều là multi-tenant, và lỗi nặng nhất có thể xảy ra là khách hàng A nhìn thấy dữ liệu của khách hàng B. Trong Laravel, lỗi này thường đến từ một raw query hoặc một queue job quên lọc <code>tenant_id<\/code>. Câu hỏi hay gặp: so sánh ba mô hình, và \"khách enterprise đòi dữ liệu riêng thì làm sao\".", "checks": ["Thiết kế được lớp cưỡng chế <code>tenant_id<\/code> ở ORM, DB, cache key, queue job, và danh sách test (bài tập 5)", "Chỉ ra được 4 cách global scope bị bỏ qua trong Laravel", "Lập được kế hoạch chuyển một tenant lớn từ pool sang DB riêng không downtime"], "children": [{"label": "Ba mô hình", "kind": "topic", "children": []}, {"label": "Row per tenant: chống rò dữ liệu", "kind": "topic", "children": []}, {"label": "Noisy neighbor", "kind": "topic", "children": []}, {"label": "Hybrid và định danh tenant", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 DDD strategic: tìm ranh giới", "kind": "module", "file": "15-architecture.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Trước khi tách module hay service, phải biết ranh giới nằm ở đâu. Vẽ sai ranh giới thì mọi thứ phía sau đều đắt: module gọi chéo liên tục, service phải deploy cùng nhau. Senior hay bị hỏi \"bounded context là gì, xác định thế nào\" và \"anticorruption layer dùng khi nào\".", "checks": ["Liệt kê được bounded context của dự án mình và vẽ context map (bài tập 1)", "Phân loại được subdomain của công ty mình thành core/supporting/generic và nói hệ quả đầu tư", "Thiết kế được ACL khi tích hợp một hệ thống kế toán cũ có model xấu"], "children": [{"label": "Ubiquitous language", "kind": "topic", "children": []}, {"label": "Bounded context", "kind": "topic", "children": []}, {"label": "Context map", "kind": "topic", "children": []}, {"label": "Subdomain", "kind": "topic", "children": []}, {"label": "Event Storming", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Tách service, strangler fig và dữ liệu xuyên service", "kind": "module", "file": "15-architecture.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Đây là phần senior được hỏi nhiều nhất trong chủ đề kiến trúc: khi nào tách, tách thế nào mà không dừng kinh doanh, và làm gì với dữ liệu khi không còn JOIN được. Sai lầm hay gặp nhất ngoài thực tế là tạo ra một distributed monolith: tách xong mà vẫn phải deploy cùng nhau.", "checks": ["Lập được kế hoạch strangler fig thay hệ thanh toán cũ: từng bước, cách so kết quả, cách rollback", "Thiết kế được trang \"Đơn hàng của tôi\" cần dữ liệu từ Catalog, Shipping, Payment mỗi service một DB, và nói độ trễ đồng bộ chấp nhận được", "Nhận ra được 4 dấu hiệu distributed monolith trong một sơ đồ cho sẵn"], "children": [{"label": "Tách theo gì, tách dữ liệu thế nào", "kind": "topic", "children": []}, {"label": "Strangler fig", "kind": "topic", "children": []}, {"label": "Distributed monolith", "kind": "topic", "children": []}, {"label": "Kích thước service", "kind": "topic", "children": []}, {"label": "\"JOIN\" xuyên service", "kind": "topic", "children": []}, {"label": "Distributed transaction", "kind": "topic", "children": []}, {"label": "Góc Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Tài liệu kiến trúc và ra quyết định", "kind": "module", "file": "15-architecture.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Senior được đánh giá qua cách ra quyết định và để lại dấu vết cho người sau, không chỉ qua code. Một năm sau không ai nhớ vì sao chọn Postgres cho Billing nếu không có ADR. Câu hỏi hay gặp: \"bạn quyết định một thay đổi kiến trúc lớn thế nào, viết tài liệu gì\", với red flag là \"team lead quyết\".", "checks": ["Viết được một ADR thật đủ context, decision, consequences, alternatives (bài tập 2)", "Vẽ được C4 mức 1 và 2 cho dự án mình", "Phân loại được 5 quyết định gần đây của team thành one-way/two-way và nói có quyết định nào đã xử lý sai loại"], "children": [{"label": "ADR", "kind": "topic", "children": []}, {"label": "C4 và RFC", "kind": "topic", "children": []}, {"label": "Quyết định đảo ngược được và không đảo ngược được", "kind": "topic", "children": []}, {"label": "Quality attributes và fitness function", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Tổ chức: Conway's law và Team Topologies", "kind": "module", "file": "15-architecture.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Kiến trúc và cơ cấu team luôn ảnh hưởng lẫn nhau. Tách service mà không đổi cách chia team thì ranh giới sẽ trượt về lại hình dạng cũ. Senior và lead hay bị hỏi \"Conway's law ảnh hưởng kiến trúc thế nào\", và trích sai câu gốc là điểm trừ dễ thấy.", "checks": ["Trích đúng câu của Conway và phân biệt được với bản diễn giải trong Jargon File", "Vẽ được sơ đồ team hiện tại cạnh sơ đồ kiến trúc và chỉ ra chỗ lệch", "Đề xuất được cách tổ chức team khi tách monolith thành 4 bounded context"], "children": [{"label": "Conway's law", "kind": "topic", "children": []}, {"label": "Inverse Conway maneuver", "kind": "topic", "children": []}, {"label": "Team Topologies", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 25, "knowledge": "", "prio": "★★"}, {"label": "System design", "kind": "file", "file": "16-system-design.md", "children": [{"label": "1.1 Phương pháp làm bài 45–60 phút", "kind": "module", "file": "16-system-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Vòng system design không chấm đáp án đúng, vì đề nào cũng có nhiều đáp án. Người chấm chấm <strong>cách bạn đi tới<\/strong> thiết kế: có hỏi rõ đề không, có ước lượng không, có nói được vì sao chọn cái này mà không chọn cái kia không. Không có quy trình thì rất dễ sa vào vẽ hộp 30 phút rồi hết giờ mà chưa đi qua được một luồng nào.", "checks": ["Làm được một bài 45 phút đúng bảy bước, ghi giờ từng bước, không bước nào lố quá 50%", "Liệt kê được 6 câu hỏi requirement cho một đề bất kỳ trong 1 phút"], "children": [{"label": "Bảy bước và thời gian", "kind": "topic", "children": []}, {"label": "Hỏi gì ở bước requirement", "kind": "topic", "children": []}, {"label": "Người chấm đánh giá gì", "kind": "topic", "children": []}, {"label": "Lỗi hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Ước lượng back-of-envelope", "kind": "module", "file": "16-system-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Ước lượng là thứ biến \"hệ này cần cache không, cần shard không\" từ cảm tính thành con số. Trong phỏng vấn, người chấm muốn thấy bạn tính nhanh và biết con số nào làm đổi thiết kế. Ngoài công việc, câu \"cần bao nhiêu server PHP-FPM cho đợt khuyến mãi\" dùng đúng các công thức ở đây.", "checks": ["Ước lượng xong QPS, storage, cache của URL shortener trong 4 phút không cần giấy nháp dài", "Tính được số server PHP-FPM cho một hệ 3.000 QPS peak khi biết latency, RSS mỗi worker, RAM và số core, và kiểm tra lại với <code>max_connections<\/code>", "Nói được con số ước lượng nào làm thay đổi thiết kế, con số nào không"], "children": [{"label": "Các con số cần thuộc", "kind": "topic", "children": []}, {"label": "QPS, storage, bandwidth", "kind": "topic", "children": []}, {"label": "Số server theo QPS", "kind": "topic", "children": []}, {"label": "Riêng PHP-FPM", "kind": "topic", "children": []}, {"label": "Cache", "kind": "topic", "children": []}, {"label": "Ví dụ mẫu: URL shortener", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Building blocks và scale từ một server", "kind": "module", "file": "16-system-design.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi bài system design đều được ráp từ cùng một bộ khối: load balancer, cache, DB, queue, object storage. Biết khối nào dùng khi nào, và khi nào <strong>không<\/strong> nên dùng, là nền của mọi bài phía sau. Câu \"hệ thống một server, traffic tăng 10 lần thì làm gì\" là câu mở màn rất phổ biến.", "checks": ["Trả lời được bài \"traffic tăng 10 lần\" theo 8 bước, mỗi bước nói được chỉ số nào cho thấy cần bước đó", "Với mỗi block trong bảng, nói được một trường hợp <strong>không<\/strong> nên dùng"], "children": [{"label": "Scale dọc và scale ngang", "kind": "topic", "children": []}, {"label": "Building block và khi nào dùng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Availability", "kind": "module", "file": "16-system-design.md", "level": "🟢"
