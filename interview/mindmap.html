, "stage": "Chặng 1: Nền 🟢", "why": "Con số \"99,9%\" xuất hiện trong mọi SLA và mọi cuộc bàn về kiến trúc, nhưng ít người đổi được nó ra số phút downtime hay biết mỗi số 9 thêm vào tốn gì. Câu hỏi hay gặp: \"99,9% là bao nhiêu phút mỗi tháng\" (junior) và \"cần 99,99% thì bạn thay đổi gì\" (senior).", "checks": ["Tính được availability của một chuỗi LB → app → Redis → MySQL với số liệu tự giả định, và chỉ ra chỗ nên thêm dự phòng", "Liệt kê được mọi SPOF trong hệ thống mình đang làm"], "children": [{"label": "Bảng số 9", "kind": "topic", "children": []}, {"label": "Tính availability của nhiều thành phần", "kind": "topic", "children": []}, {"label": "SPOF và redundancy", "kind": "topic", "children": []}, {"label": "Active-passive và active-active", "kind": "topic", "children": []}, {"label": "AZ và region", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 URL shortener", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "URL shortener là bài nhập môn kinh điển, gần như chắc gặp ở vòng mid. Bài nhỏ nhưng có đủ các ý người chấm muốn thấy: ước lượng dẫn tới quyết định, cách sinh mã không trùng, và hiểu hệ quả của một chi tiết HTTP (<code>301<\/code> hay <code>302<\/code>).", "checks": ["Làm trọn bài trong 45 phút và bảo vệ được cách sinh mã đã chọn", "Trả lời được \"traffic đọc tăng 100 lần\" mà không phải vẽ lại từ đầu (câu 21)"], "children": [{"label": "Ước lượng, API và data model", "kind": "topic", "children": []}, {"label": "Độ dài mã", "kind": "topic", "children": []}, {"label": "Sinh mã (deep dive chính)", "kind": "topic", "children": []}, {"label": "Redirect: 301 hay 302", "kind": "topic", "children": []}, {"label": "Đường redirect phải nhẹ", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Rate limiter", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Rate limiter vừa là bài phỏng vấn phổ biến vừa là thứ bạn cấu hình thật trong Laravel (<code>throttle<\/code>). Bài này kiểm tra bạn có hiểu race condition trên Redis không, và biết đánh đổi giữa độ chính xác và bộ nhớ của từng thuật toán.", "checks": ["Viết được Lua token bucket cho Redis (bài tập 3)", "Vẽ được ví dụ fixed window cho qua gấp đôi limit trong 2 giây quanh ranh giới"], "children": [{"label": "Các thuật toán", "kind": "topic", "children": []}, {"label": "Đặt ở đâu", "kind": "topic", "children": []}, {"label": "Counter trong Redis phải atomic", "kind": "topic", "children": []}, {"label": "Response khi bị chặn", "kind": "topic", "children": []}, {"label": "Deep dive", "kind": "topic", "children": []}, {"label": "Góc Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Notification system", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Hệ nào cũng gửi email, SMS, push, và ở PHP đây là việc chạy queue nhiều nhất. Hai sự cố hay gặp là gửi trùng cho khách và OTP đến chậm vì bị kẹt sau một campaign marketing. Bài này kiểm tra bạn thiết kế queue, retry và chống trùng có bài bản không.", "checks": ["Vẽ được luồng từ service nghiệp vụ tới provider, chỉ ra chỗ dedup và chỗ ưu tiên OTP", "Nói được chuyện gì xảy ra khi worker gửi xong nhưng chết trước khi ghi \"đã gửi\""], "children": [{"label": "Yêu cầu", "kind": "topic", "children": []}, {"label": "Vì sao queue là bắt buộc", "kind": "topic", "children": []}, {"label": "Chống gửi trùng", "kind": "topic", "children": []}, {"label": "Ưu tiên", "kind": "topic", "children": []}, {"label": "Retry, DLQ, rate limit", "kind": "topic", "children": []}, {"label": "Góc Laravel", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 News feed", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "News feed là bài kinh điển để nói về đánh đổi giữa chi phí ghi và chi phí đọc. Câu hỏi then chốt luôn là \"người có 10 triệu follower đăng bài thì sao\". Ý tưởng \"cache chỉ lưu id\" dùng lại được ở rất nhiều hệ khác.", "checks": ["Tính được số lần ghi khi một người 10 triệu follower đăng bài theo push, và thiết kế ngưỡng hybrid", "Giải thích được vì sao feed cache chỉ nên lưu id"], "children": [{"label": "Ước lượng", "kind": "topic", "children": []}, {"label": "Fan-out on write và fan-out on read", "kind": "topic", "children": []}, {"label": "Feed cache chỉ lưu id", "kind": "topic", "children": []}, {"label": "Phân trang", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Chat / messenger", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Chat là bài về kết nối lâu dài (<em>stateful<\/em>), thứ tự tin nhắn và giao tin tin cậy, khác hẳn kiểu request/response quen thuộc của PHP. Với dev PHP, bài này còn kiểm tra bạn có biết giới hạn của PHP-FPM và cách Laravel làm real-time không.", "checks": ["Vẽ được đường đi một tin từ A (server 1) tới B (server 2) và tới B khi offline", "Xử lý được tình huống một chat server chết làm 50.000 kết nối rớt cùng lúc (câu 25)"], "children": [{"label": "Ước lượng", "kind": "topic", "children": []}, {"label": "Kết nối", "kind": "topic", "children": []}, {"label": "Lưu trữ", "kind": "topic", "children": []}, {"label": "Thứ tự và giao tin tin cậy", "kind": "topic", "children": []}, {"label": "Nhóm và presence", "kind": "topic", "children": []}, {"label": "Vận hành", "kind": "topic", "children": []}, {"label": "Góc PHP", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Đặt vé / đặt phòng", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Double booking là lỗi tiền thật và khách thật: hai người cùng mua một ghế. Bài này kiểm tra bạn có viết được thao tác \"kiểm tra và giữ\" nguyên tử ngay trong DB không, thay vì kiểm tra ở app rồi mới ghi. Đây cũng là nền của flash sale (module 3.2).", "checks": ["Viết được câu UPDATE giữ ghế và giải thích vì sao không cần job dọn hold để đảm bảo đúng", "Mô tả được luồng xử lý thanh toán về muộn (bài tập 5)"], "children": [{"label": "Hai kiểu tồn kho", "kind": "topic", "children": []}, {"label": "Không double booking", "kind": "topic", "children": []}, {"label": "Giữ chỗ tạm", "kind": "topic", "children": []}, {"label": "Lúc mở bán", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Leaderboard", "kind": "module", "file": "16-system-design.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Leaderboard là bài ngắn để kiểm tra bạn có biết dùng đúng cấu trúc dữ liệu của Redis không. Sorted set còn dùng cho rất nhiều việc khác như xếp hạng bài viết hay hàng đợi có độ ưu tiên.", "checks": ["Viết được các lệnh Redis cho: cộng điểm, top 10, hạng của một user, leaderboard theo tuần", "Thiết kế được cách phá hoà bằng thời điểm trong một score kiểu double"], "children": [{"label": "Redis sorted set", "kind": "topic", "children": []}, {"label": "Hạng bằng nhau", "kind": "topic", "children": []}, {"label": "Theo kỳ", "kind": "topic", "children": []}, {"label": "Nguồn sự thật", "kind": "topic", "children": []}, {"label": "Quy mô rất lớn", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Thanh toán / ví điện tử", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Bài có tiền là nơi người chấm senior soi kỹ nhất, vì sai một chút là mất tiền thật hoặc trừ tiền khách hai lần. Điểm then chốt không nằm ở chọn công nghệ mà ở ledger, idempotency và cách xử lý khi không biết giao dịch thành công hay chưa. Red flag kinh điển: chỉ có một cột <code>balance<\/code> và <code>UPDATE<\/code>.", "checks": ["Thiết kế được schema ledger và câu SQL kiểm tra ledger cân bằng (bài tập 4)", "Kể được từng bước xử lý khi gọi PSP bị timeout, tới lúc tiền được xác nhận hoặc hoàn"], "children": [{"label": "Nguyên tắc và ledger bút toán kép", "kind": "topic", "children": []}, {"label": "Chuyển tiền nội bộ", "kind": "topic", "children": []}, {"label": "Idempotency ở mọi tầng", "kind": "topic", "children": []}, {"label": "Luồng với PSP", "kind": "topic", "children": []}, {"label": "Webhook", "kind": "topic", "children": []}, {"label": "Reconciliation", "kind": "topic", "children": []}, {"label": "Hot account", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Flash sale", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Flash sale là bài gộp của rate limit, cache, queue và chống oversell dưới tải cực đỉnh. Các sàn thương mại điện tử ở Việt Nam chạy flash sale thường xuyên, và sự cố \"bán vượt số lượng\" là câu hỏi tình huống rất hay gặp.", "checks": ["Vẽ được các tầng lọc và ước lượng số request còn lại sau mỗi tầng cho 1 triệu người", "Điều tra được sự cố \"bán 1.012 trên 1.000\" (câu 24)"], "children": [{"label": "Mục tiêu: từ chối rẻ", "kind": "topic", "children": []}, {"label": "Các tầng lọc", "kind": "topic", "children": []}, {"label": "Trừ kho", "kind": "topic", "children": []}, {"label": "DB vẫn là nguồn sự thật", "kind": "topic", "children": []}, {"label": "Cô lập và chuẩn bị", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Distributed ID generator và key-value store", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Hai bài hạ tầng này hay xuất hiện ở vòng senior vì chúng buộc bạn nói về các khái niệm của hệ phân tán: phân vùng, replication, quorum, xung đột. Snowflake và UUIDv7 cũng là lựa chọn thật khi thiết kế primary key cho hệ nhiều service.", "checks": ["Vẽ được đường ghi và đường đọc của KV store với N=3, W=2, R=2, có một node chết", "Giải thích được vai trò bloom filter trong đường đọc của LSM"], "children": [{"label": "Distributed ID", "kind": "topic", "children": []}, {"label": "Key-value store (hướng Dynamo/Cassandra)", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Web crawler và search autocomplete", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Crawler và autocomplete là hai bài có cấu trúc dữ liệu riêng (hàng đợi theo host, trie) và phần xử lý offline. Autocomplete còn có góc riêng cho tiếng Việt: người dùng gõ không dấu nhưng vẫn phải ra kết quả có dấu.", "checks": ["Thiết kế được frontier đảm bảo mỗi host tối đa 1 request/giây với 1.000 worker", "Giải thích được vì sao lưu top-k ở mỗi node trie, và cái giá khi cập nhật"], "children": [{"label": "Web crawler", "kind": "topic", "children": []}, {"label": "Search autocomplete", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 File storage (Drive/Dropbox) và video streaming", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Upload và phục vụ file lớn là việc dev PHP gặp thường xuyên, và cách làm sai phổ biến là cho file đi xuyên qua app server. Bài Dropbox kiểm tra bạn tách metadata khỏi dữ liệu, chia chunk và đồng bộ. Bài video chủ yếu kiểm tra bạn biết pipeline và chỗ tốn tiền.", "checks": ["Vẽ được luồng sửa 1 byte giữa file 1 GB và chỉ ra bao nhiêu dữ liệu phải upload lại với chunk cố định so với content-defined", "Thiết kế được luồng upload file 5 GB từ app Laravel mà app server không chạm vào nội dung"], "children": [{"label": "File storage: tách block và metadata", "kind": "topic", "children": []}, {"label": "Chunking", "kind": "topic", "children": []}, {"label": "Dedup", "kind": "topic", "children": []}, {"label": "Upload thẳng lên object storage", "kind": "topic", "children": []}, {"label": "Sync", "kind": "topic", "children": []}, {"label": "Video (đại ý)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Ride-hailing / nearby search", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Grab, Be, các app giao đồ ăn đều dựa trên bài toán \"tìm điểm gần nhất\". Bài này kiểm tra hai thứ: xử lý lượng ghi vị trí rất lớn, và hiểu geo index hoạt động ra sao, nhất là bẫy ranh giới ô của geohash.", "checks": ["Giải thích được bằng hình vì sao phải tìm 8 ô lân cận khi dùng geohash", "Chọn được geohash hay quadtree cho một app giao đồ ăn một thành phố và bảo vệ lựa chọn"], "children": [{"label": "Ước lượng và lưu vị trí", "kind": "topic", "children": []}, {"label": "Geo index", "kind": "topic", "children": []}, {"label": "Ghép chuyến và lưu lộ trình", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.7 Distributed job scheduler", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Mọi app Laravel đều có scheduler và queue. Khi scale từ 1 lên 2 instance, bug \"cron chạy hai lần\" xuất hiện gần như chắc chắn. Bài này kiểm tra bạn hiểu lease, idempotency và vì sao exactly-once là ảo tưởng.", "checks": ["Viết được query lấy job và luồng xử lý worker chết giữa chừng", "Sửa được sự cố \"báo cáo gửi hai lần từ khi scale lên 2 instance\" bằng hai lớp chặn (câu 26)"], "children": [{"label": "Yêu cầu", "kind": "topic", "children": []}, {"label": "Bản cơ bản trên DB", "kind": "topic", "children": []}, {"label": "Cron chạy trùng", "kind": "topic", "children": []}, {"label": "At-least-once và idempotency", "kind": "topic", "children": []}, {"label": "Retry và job dài", "kind": "topic", "children": []}, {"label": "Quy mô lớn", "kind": "topic", "children": []}, {"label": "Hỏi tiếp hay gặp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.8 Metrics / logging system", "kind": "module", "file": "16-system-design.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Metrics và log là thứ bạn dùng hằng ngày để vận hành, và thiết kế sai (label <code>user_id<\/code>, log không lọc thông tin cá nhân) gây tốn tiền hoặc sự cố thật. Bài này kiểm tra bạn hiểu workload ghi rất nhiều, bài toán cardinality và đánh đổi chi phí giữa các hệ lưu log.", "checks": ["Tính được số time series khi thêm label <code>user_id<\/code> cho 1 triệu user và giải thích vì sao không được", "Vẽ được pipeline log từ app Laravel trên Kubernetes tới Loki, chỉ ra chỗ lọc PII"], "children": [{"label": "Metrics", "kind": "topic", "children": []}, {"label": "Logging", "kind": "topic", "children": []}, {"label": "Alerting", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 28, "knowledge": "", "prio": "★★★"}, {"label": "Performance và scalability", "kind": "file", "file": "17-performance.md", "children": [{"label": "1.1 Latency, throughput, percentile", "kind": "module", "file": "17-performance.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Mọi cuộc nói chuyện về hiệu năng, từ SLO tới báo cáo load test, đều dùng các từ latency, throughput, p99. Dùng sai (nói \"trung bình 60 ms\" khi người dùng đang chờ 5 giây, hay lấy trung bình p99 của nhiều server) là red flag ngay trong phỏng vấn. Câu mở đầu hay gặp: \"p99 nghĩa là gì, vì sao không dùng trung bình\".", "checks": ["Giải thích được vì sao trung bình p99 của nhiều server là con số sai và cách tính đúng", "Viết được SLO dạng \"p99 &lt; 300 ms ở 500 RPS\" cho một endpoint mình đang làm, kèm lý do chọn con số"], "children": [{"label": "Ba khái niệm đo", "kind": "topic", "children": []}, {"label": "Percentile", "kind": "topic", "children": []}, {"label": "Latency gồm cả thời gian chờ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Quy trình tối ưu: đo trước, sửa sau", "kind": "module", "file": "17-performance.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Sai lầm tốn thời gian nhất khi tối ưu là sửa chỗ mình đoán là chậm thay vì chỗ thật sự chậm. Người phỏng vấn senior thường hỏi \"kể một lần bạn tối ưu hiệu năng\" và chấm quy trình: có mục tiêu không, có đo trước sau không, có biết thời gian nằm ở đâu không.", "checks": ["Kể được một lần tối ưu thật theo đủ 6 bước, có số trước và sau", "Mở một trace của request chậm và chỉ ra span nào chiếm nhiều thời gian nhất"], "children": [{"label": "Quy trình 6 bước", "kind": "topic", "children": []}, {"label": "Anti-pattern", "kind": "topic", "children": []}, {"label": "Công cụ để thấy thời gian nằm ở đâu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Nguyên nhân chậm thường gặp: DB và cache", "kind": "module", "file": "17-performance.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Phần lớn \"app chậm\" ở backend là do vài nguyên nhân lặp đi lặp lại, và đa số nằm ở DB. Biết thứ tự hay gặp giúp bạn tìm đúng chỗ nhanh, và nhận ra ngay các mẫu như N+1 khi nhìn trace. Phỏng vấn hay hỏi \"endpoint chậm, bạn nghi gì đầu tiên\".", "checks": ["Viết một endpoint N+1, đo số query và thời gian với 1.000 bản ghi, sửa và đo lại (bài tập 1)", "Nhìn một trace có 200 query giống nhau, nói được ngay đó là gì và sửa ở đâu"], "children": [{"label": "Thứ tự nguyên nhân hay gặp ở backend", "kind": "topic", "children": []}, {"label": "DB", "kind": "topic", "children": []}, {"label": "Cache", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Scale cơ bản", "kind": "module", "file": "17-performance.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "\"Thêm server\" là câu trả lời đầu tiên ai cũng nghĩ tới, nhưng app Laravel chỉ chạy được trên nhiều server khi không giữ state trên máy. Module này giúp bạn biết khi nào nên mua máy to hơn, khi nào thêm máy, và những chỗ nào trong app sẽ vỡ khi thêm máy.", "checks": ["Liệt kê được mọi chỗ trong một app Laravel thật cần sửa trước khi chạy trên 3 server", "Nói được khi nào scale dọc DB vẫn là lựa chọn đúng dù \"không scale được mãi\""], "children": [{"label": "Hai cách scale", "kind": "topic", "children": []}, {"label": "PHP-FPM khi thêm server", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Little's law, Amdahl, queueing", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Ba công thức này cho phép tính trước thay vì đoán: cần bao nhiêu worker, thêm máy được lợi bao nhiêu, vì sao hệ thống ở 90% tải lại chậm hẳn. Phỏng vấn senior thường cho con số (\"1.000 RPS, 200 ms, cần bao nhiêu connection?\") và chờ bạn áp Little's law ngay.", "checks": ["Tính được số DB connection tối thiểu cho bài tập 3, cả khi DB chậm gấp 5", "Từ <code>pm.max_children<\/code> và p50 latency, tính được throughput tối đa của một server PHP-FPM", "Vẽ được đồ thị latency theo utilization và giải thích vì sao chạy ở 95% nguy hiểm"], "children": [{"label": "Little's law", "kind": "topic", "children": []}, {"label": "Amdahl's law", "kind": "topic", "children": []}, {"label": "Utilization và hàng đợi", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Profiling, flame graph, công cụ theo ngôn ngữ", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "APM cho biết endpoint nào chậm, còn profiler cho biết <strong>dòng code nào<\/strong> chậm. Biết đọc flame graph và biết profiler nào thấy được gì giúp bạn không mất công tối ưu nhầm chỗ. Câu hay gặp: \"request 2 giây mà profile chỉ thấy 50 ms, phần còn lại ở đâu\".", "checks": ["Lấy được CPU profile của một chương trình Go hoặc Java nhỏ có hàm nóng, vẽ flame graph và chỉ ra hàm tốn nhất (bài tập 4)", "Nhìn một flame graph lạ, trong 1 phút nói được 2 chỗ đáng xem", "Giải thích được vì sao request 2 giây chỉ có 50 ms trên CPU profile, và dùng công cụ gì tìm 1,95 giây còn lại"], "children": [{"label": "Các loại profile", "kind": "topic", "children": []}, {"label": "Đọc flame graph", "kind": "topic", "children": []}, {"label": "Công cụ theo ngôn ngữ", "kind": "topic", "children": []}, {"label": "Đối chiếu PHP với Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Tầng PHP: profiling, OPcache/JIT, tuning PHP-FPM", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Phần lớn \"PHP chậm\" là do cấu hình runtime hoặc chờ I/O, không phải do ngôn ngữ. Biết profile một request Laravel, đọc trạng thái OPcache và chọn cấu hình <code>pm<\/code> là những việc sẽ làm thật, và là câu hỏi gần như chắc chắn gặp khi phỏng vấn vị trí PHP senior.", "checks": ["Profile được một request Laravel bằng SPX hoặc Xdebug, chỉ ra 3 hàm/khối tốn nhất và phần nào là bootstrap framework", "Đọc được <code>opcache_get_status()<\/code> của production và nói OPcache có đang đủ bộ nhớ, đủ slot không", "Chọn được <code>pm<\/code> và tính được <code>max_children<\/code> cho một server cụ thể, bảo vệ được bằng cả RAM và Little's law", "Đo được JIT bật/tắt trên một endpoint I/O-bound và một script CPU-bound, giải thích kết quả"], "children": [{"label": "Profiling PHP", "kind": "topic", "children": []}, {"label": "OPcache", "kind": "topic", "children": []}, {"label": "JIT (PHP 8.0+)", "kind": "topic", "children": []}, {"label": "Laravel và Composer", "kind": "topic", "children": []}, {"label": "Tuning PHP-FPM", "kind": "topic", "children": []}, {"label": "Xử lý việc chậm", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Checklist tầng network, app code, serialization", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Sau DB, thời gian của một request thường nằm ở mạng (gọi API tuần tự, không tái dùng kết nối), ở code có độ phức tạp ẩn, và ở việc chuyển đổi dữ liệu lớn. Đây là checklist để rà một endpoint chậm khi DB đã ổn, và hay được hỏi dưới dạng \"export 1 triệu dòng thế nào\".", "checks": ["Viết lại một endpoint gọi 3 API tuần tự thành song song bằng <code>Http::pool()<\/code> và đo latency trước/sau", "Thiết kế được luồng export 1 triệu dòng không làm treo server (câu 13)"], "children": [{"label": "Network", "kind": "topic", "children": []}, {"label": "App code", "kind": "topic", "children": []}, {"label": "Serialization", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Connection pool", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Connection pool là nơi hai sự cố hay gặp nhất xảy ra: pool cạn làm request chờ dù DB không chậm, và tổng số kết nối vượt giới hạn của DB khi scale app. Với PHP-FPM, cách tính khác Java/Go vì không có pool trong process. Phỏng vấn hay hỏi \"pool size bao nhiêu là đủ\".", "checks": ["Tính được tổng connection tối đa của hệ thống mình đang làm và so với <code>max_connections<\/code>", "Giải thích được vì sao pool nhỏ hơn đôi khi cho throughput cao hơn"], "children": [{"label": "Pool là gì, vì sao cần", "kind": "topic", "children": []}, {"label": "Tính tổng kết nối", "kind": "topic", "children": []}, {"label": "Pool cạn", "kind": "topic", "children": []}, {"label": "PHP-FPM không có pool trong process", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Load testing", "kind": "module", "file": "17-performance.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Load test là cách duy nhất biết hệ thống chịu được bao nhiêu trước khi người dùng thật cho bạn biết. Nhưng load test làm sai rất dễ cho kết quả đẹp mà vô nghĩa. Người phỏng vấn hay hỏi \"bạn load test thế nào\" để xem bạn có biết các bẫy đó không.", "checks": ["Viết được script k6 open model có threshold p99 và tỉ lệ lỗi (bài tập 2)", "Chạy một stress test lên app Laravel, tìm được điểm gãy và chỉ ra tài nguyên bão hoà (FPM worker, CPU, hay DB)", "Liệt kê được 5 lý do một load test đẹp nhưng production vẫn chậm"], "children": [{"label": "Các loại test", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}, {"label": "Thiết kế bài test", "kind": "topic", "children": []}, {"label": "Đọc kết quả", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Tail latency, fan-out, USL", "kind": "module", "file": "17-performance.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi một request gọi tới nhiều service hoặc nhiều shard, phần đuôi latency của từng service cộng dồn thành trải nghiệm chậm của người dùng. USL giải thích vì sao thêm node đôi khi làm hệ thống chậm đi. Đây là kiến thức phân biệt senior với mid trong câu hỏi system design.", "checks": ["Tính được xác suất một request chạm đuôi khi fan-out 10, 50, 100 backend", "Giải thích được bằng USL vì sao thêm node làm hệ thống chậm đi, cho một ví dụ thật", "Thiết kế được hedged request có giới hạn cho một lời gọi đọc"], "children": [{"label": "Fan-out và tail latency", "kind": "topic", "children": []}, {"label": "Cách giảm tail", "kind": "topic", "children": []}, {"label": "USL: vì sao thêm node lại chậm đi", "kind": "topic", "children": []}, {"label": "Metastable failure", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 GC và lock contention", "kind": "module", "file": "17-performance.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Hai nguyên nhân phổ biến của p99 có đỉnh bất thường mà profile CPU thông thường khó thấy là GC và tranh chấp lock. Với PHP, lock gần như luôn nằm ở tầng dưới (MySQL, Redis, session file), còn Java/Go thì cả trong app. Câu hỏi hay gặp: \"thêm CPU mà throughput không tăng, vì sao\".", "checks": ["Phân biệt được đỉnh p99 do GC và do lock bằng dữ liệu (GC log, thread dump, profile)", "Thiết kế được sharded counter cho \"lượt xem bài viết\" 10.000 lượt/giây trên MySQL"], "children": [{"label": "GC", "kind": "topic", "children": []}, {"label": "Lock contention", "kind": "topic", "children": []}, {"label": "Cách giảm contention", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Load test không tự lừa mình: open/closed model, coordinated omission", "kind": "module", "file": "17-performance.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Phần lớn công cụ load test mặc định đo sai theo cách làm kết quả đẹp hơn thực tế, đôi khi đẹp hơn hàng chục lần ở p99. Biết open/closed model và coordinated omission là dấu hiệu rõ của người đã load test nghiêm túc. Câu hỏi hay gặp: \"load test p99 200 ms mà production 3 giây, vì sao\".", "checks": ["Chạy cùng một endpoint có pause ngẫu nhiên bằng closed và open model, so p99 và giải thích chênh lệch", "Giải thích được coordinated omission cho người chưa biết trong 2 phút"], "children": [{"label": "Closed model và open model", "kind": "topic", "children": []}, {"label": "Coordinated omission", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Scale nâng cao: precompute và đánh đổi", "kind": "module", "file": "17-performance.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi query và index đã tối ưu mà vẫn chậm, phải chọn giữa cache, queue, replica, sharding, precompute, mỗi cái có cái giá riêng. Người phỏng vấn senior chấm việc bạn chọn theo thứ tự hợp lý và nói được cái giá, không phải kể tên kỹ thuật.", "checks": ["Thiết kế được bảng tổng hợp doanh thu theo ngày cho MySQL: cập nhật thế nào, sửa sai thế nào khi đơn bị hoàn", "Với dashboard chạy query 8 giây, nêu được 3 phương án theo thứ tự và cái giá của mỗi cái"], "children": [{"label": "Bảng kỹ thuật và cái giá", "kind": "topic", "children": []}, {"label": "Precompute", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Capacity planning, autoscaling, load shedding", "kind": "module", "file": "17-performance.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Flash sale, chiến dịch marketing, mùa cao điểm: đều cần trả lời \"cần bao nhiêu máy\" trước khi sự kiện xảy ra. Autoscaling nghe như giải pháp tự động, nhưng làm sai thì chính nó đánh sập DB. Đây là chủ đề hay gặp ở vòng system design senior, dưới dạng \"chuẩn bị cho flash sale gấp 10 lần tải thường\".", "checks": ["Viết được kế hoạch capacity cho flash sale (bài tập 5) có số instance, headroom, nút thắt chung, kế hoạch dự phòng", "Chọn được metric autoscale đúng cho API Laravel chờ I/O và cho queue worker", "Giải thích được vì sao load shedding làm hệ thống phục vụ <strong>nhiều<\/strong> request thành công hơn"], "children": [{"label": "Capacity planning", "kind": "topic", "children": []}, {"label": "Autoscaling", "kind": "topic", "children": []}, {"label": "Load shedding", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 24, "knowledge": "", "prio": "★★"}]}, {"label": "Vận hành và chất lượng", "kind": "group", "children": [{"label": "Reliability và observability", "kind": "file", "file": "18-reliability-observability.md", "children": [{"label": "1.1 SLI, SLO, SLA", "kind": "module", "file": "18-reliability-observability.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "SLO là ngôn ngữ chung để dev, ops và product cùng trả lời câu \"hệ thống đã đủ ổn định chưa\". Error budget và burn rate alert ở các module sau đều xây trên nó. Câu mở đầu kinh điển là \"SLI, SLO, SLA khác nhau thế nào\", và thường bị hỏi tiếp \"SLO của hệ thống bạn là gì, đo ở đâu\".", "checks": ["Viết được 3 SLO cho hệ thống đang làm, mỗi SLO ghi rõ SLI, nơi đo, cửa sổ, mục tiêu", "Tính nhẩm được downtime cho phép của 99,9% và 99,99% trong một tháng", "Giải thích được vì sao SLI \"CPU &lt; 80%\" là SLI tồi"], "children": [{"label": "Ba khái niệm", "kind": "topic", "children": []}, {"label": "Chọn SLI thế nào", "kind": "topic", "children": []}, {"label": "Mục tiêu bao nhiêu là đủ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Redundancy và health check", "kind": "module", "file": "18-reliability-observability.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Hệ thống chỉ chịu được hỏng hóc khi mọi thành phần có bản dự phòng, và khi LB biết bản nào còn dùng được. Health check viết sai là nguyên nhân phổ biến biến một sự cố nhỏ thành sập toàn bộ. \"Liveness khác readiness thế nào\" gần như luôn được hỏi khi nói tới Kubernetes.", "checks": ["Liệt kê được 5 SPOF trong hệ thống mình đang làm, kể cả SPOF không phải máy chủ", "Kể được từng bước vì sao liveness gọi DB biến một lần DB chậm 5 giây thành outage vài phút"], "children": [{"label": "Redundancy và failure domain", "kind": "topic", "children": []}, {"label": "SPOF", "kind": "topic", "children": []}, {"label": "Liveness và readiness", "kind": "topic", "children": []}, {"label": "Hai bẫy kinh điển", "kind": "topic", "children": []}, {"label": "Viết endpoint health", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Log có cấu trúc", "kind": "module", "file": "18-reliability-observability.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Khi có sự cố, log là nơi đầu tiên để tìm \"vì sao\". Log dạng chuỗi tự do thì chỉ grep được, không lọc được theo user hay theo request. Hay bị hỏi: log có cấu trúc là gì, correlation id dùng làm gì, và những gì không được ghi vào log.", "checks": ["Viết được middleware sinh/nhận request id và gắn vào mọi log của request (bài tập 2)", "Lấy một dòng log thật trong project, chỉ ra thiếu field gì để debug được mà không cần hỏi người viết"], "children": [{"label": "Structured log", "kind": "topic", "children": []}, {"label": "Log level", "kind": "topic", "children": []}, {"label": "Correlation id", "kind": "topic", "children": []}, {"label": "Log đi đâu", "kind": "topic", "children": []}, {"label": "Không được log gì", "kind": "topic", "children": []}, {"label": "Đối chiếu Java/Go", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Quy trình sự cố cơ bản", "kind": "module", "file": "18-reliability-observability.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "\"Production lỗi, bạn làm gì\" và \"kể một sự cố bạn đã xử lý\" gần như luôn xuất hiện. Người phỏng vấn nghe thứ tự ưu tiên của bạn: cứu hệ thống trước, hay lao vào tìm nguyên nhân trước.", "checks": ["Kể được 15 phút đầu của sự cố \"500 hàng loạt ngay sau deploy\" theo đúng thứ tự", "Kể được một sự cố thật của mình trong 3 phút, có phần phòng ngừa lâu dài"], "children": [{"label": "Các bước xử lý sự cố", "kind": "topic", "children": []}, {"label": "Mitigate trước, root cause sau", "kind": "topic", "children": []}, {"label": "Giữ bằng chứng", "kind": "topic", "children": []}, {"label": "Khi rollback không cứu được", "kind": "topic", "children": []}, {"label": "Câu chuyện sự cố của chính mình", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Error budget", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Error budget biến SLO thành công cụ ra quyết định: khi nào được deploy mạnh tay, khi nào phải dừng để sửa độ ổn định. Câu \"làm sao cân bằng tốc độ ra tính năng và độ ổn định\" hay được hỏi ở mức mid trở lên, và error budget là câu trả lời chuẩn.", "checks": ["Viết được error budget policy một trang: ai quyết định, hết budget thì dừng gì, ngoại lệ nào", "Tính được còn bao nhiêu budget khi tháng này đã có một sự cố 20 phút và 0,03% request lỗi rải rác"], "children": [{"label": "Error budget là gì", "kind": "topic", "children": []}, {"label": "Dùng budget để ra quyết định", "kind": "topic", "children": []}, {"label": "Error budget policy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Metric", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Metric là thứ vẽ dashboard và kích hoạt alert. Chọn sai loại metric thì số liệu sai, đặt sai label thì có thể làm sập chính hệ thống monitoring. Hay bị hỏi: counter, gauge, histogram khác nhau thế nào, RED và USE là gì, vì sao không dùng <code>user_id<\/code> làm label.", "checks": ["Viết được PromQL cho tỉ lệ lỗi 5xx và p99 latency theo route trong 5 phút", "Nhìn danh sách label của một metric, chỉ ra label nào gây nổ cardinality và sửa được", "Liệt kê được metric RED cho API và USE cho queue worker của hệ thống mình (bài tập 5)"], "children": [{"label": "Metric, label và time series", "kind": "topic", "children": []}, {"label": "Bốn loại metric của Prometheus", "kind": "topic", "children": []}, {"label": "Cardinality", "kind": "topic", "children": []}, {"label": "Chọn đo gì: RED, USE, four golden signals", "kind": "topic", "children": []}, {"label": "Hai bẫy khi đọc latency", "kind": "topic", "children": []}, {"label": "Pull và push", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Tracing và OpenTelemetry", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Một request đặt hàng có thể đi qua API, DB, Redis, queue, worker và vài service khác. Khi nó chậm, metric chỉ nói \"chậm\", còn log thì rải rác nhiều nơi. Trace cho thấy chậm ở chặng nào. Hay bị hỏi: trace id được truyền qua các service thế nào, và chỗ nào hay làm đứt trace.", "checks": ["Đọc được một header <code>traceparent<\/code> và chỉ ra trace id, span id cha, cờ sampled", "Vẽ được trace của request \"đặt hàng\" đi qua API → DB → queue → worker, chỉ ra chỗ dễ bị đứt trace", "Kể được luồng điều tra từ alert tới dòng log gây lỗi mà không cần grep toàn bộ log"], "children": [{"label": "Trace và span", "kind": "topic", "children": []}, {"label": "Context propagation", "kind": "topic", "children": []}, {"label": "OpenTelemetry", "kind": "topic", "children": []}, {"label": "Ba tín hiệu bổ trợ nhau", "kind": "topic", "children": []}, {"label": "Error tracking", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Alerting và on-call", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Alert quyết định ai bị đánh thức lúc 3 giờ sáng. Alert tồi hoặc để lọt sự cố, hoặc làm team kiệt sức rồi bỏ qua mọi alert. Hay bị hỏi: vì sao alert theo triệu chứng chứ không theo nguyên nhân, và xử lý thế nào khi alert kêu quá nhiều.", "checks": ["Phân loại được 10 alert hiện có của team thành: page, ticket, xoá", "Viết được runbook cho alert \"5xx của API thanh toán &gt; 2% trong 5 phút\" (bài tập 4)", "Viết được một alert rule Prometheus có <code>for:<\/code> và label severity, giải thích vì sao chọn ngưỡng đó"], "children": [{"label": "Page khi nào", "kind": "topic", "children": []}, {"label": "Alert fatigue", "kind": "topic", "children": []}, {"label": "Runbook", "kind": "topic", "children": []}, {"label": "On-call", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 High availability và graceful degradation", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Câu thiết kế nào rồi cũng dẫn tới \"nếu X chết thì sao\". Cần biết failover hoạt động thế nào và nó có thể làm mất gì, và làm sao để một dependency phụ chết không kéo sập cả hệ thống. Với PHP-FPM, một API bên ngoài bỗng chậm là kịch bản sập kinh điển.", "checks": ["Giải thích được bằng Little's law vì sao API vận chuyển chậm từ 200 ms lên 30 giây làm sập cả trang chủ", "Liệt kê được tính năng nào của hệ thống mình tắt được khi dependency phụ chết, và cơ chế tắt"], "children": [{"label": "Failover tự động và thủ công", "kind": "topic", "children": []}, {"label": "Cái giá của failover", "kind": "topic", "children": []}, {"label": "Multi-AZ", "kind": "topic", "children": []}, {"label": "Cascading failure", "kind": "topic", "children": []}, {"label": "Graceful degradation", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Backup, RPO và RTO", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Backup là lớp bảo vệ cuối cùng trước xoá nhầm, ransomware và bug làm hỏng dữ liệu. \"Replica có phải backup không\" và \"RPO/RTO của hệ thống bạn là bao nhiêu\" rất hay gặp. Trả lời bằng con số đo được khác hẳn trả lời bằng con số mong muốn.", "checks": ["Nói được RPO và RTO thực tế (không phải mong muốn) của hệ thống mình, và dựa vào số đo nào", "Kể được cách một kẻ tấn công có quyền admin tài khoản cloud vẫn không xoá được backup"], "children": [{"label": "RPO và RTO", "kind": "topic", "children": []}, {"label": "Các cách backup", "kind": "topic", "children": []}, {"label": "Để backup sống sót", "kind": "topic", "children": []}, {"label": "Hai bẫy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Tầng PHP: quan sát PHP-FPM và Laravel", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. Mô hình <em>shared-nothing<\/em> của PHP-FPM (mỗi request chạy trong một worker, không giữ gì lại sau request) làm nhiều thứ khác với Java/Go: không có process sống lâu để giữ counter trong RAM, và worker là tài nguyên hữu hạn. Câu \"APM báo nhanh mà người dùng thấy chậm\" là câu đặc trưng của hệ thống PHP.", "checks": ["Bật được status page của FPM, đọc được từng field và nói field nào dùng để alert", "Gắn được request id vào log của cả request HTTP lẫn queue job mà nó dispatch", "Giải thích được vì sao APM báo p99 = 200 ms trong khi người dùng thấy 5 giây, khi <code>listen queue<\/code> đang cao", "Thiết kế được alert cho queue: metric nào, ngưỡng nào, vì sao không dùng độ dài queue"], "children": [{"label": "PHP-FPM là tài nguyên cần đo theo USE", "kind": "topic", "children": []}, {"label": "Metric trong PHP", "kind": "topic", "children": []}, {"label": "Log", "kind": "topic", "children": []}, {"label": "Trace và error tracking", "kind": "topic", "children": []}, {"label": "Công cụ trong hệ Laravel", "kind": "topic", "children": []}, {"label": "Queue và cron", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Postmortem", "kind": "module", "file": "18-reliability-observability.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Postmortem biến một sự cố thành bài học để nó không lặp lại. Ở mức senior, bạn được kỳ vọng dẫn postmortem và viết action item thật sự có tác dụng. Hay bị hỏi: blameless là gì, postmortem gồm những phần nào, 5 whys có ing", "kind": "topic", "children": []}, {"label": "Metric", "kind": "topic", "children": []}, {"label": "Chọn backend log", "kind": "topic", "children": []}, {"label": "Hướng mới", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Disaster recovery và DR drill", "kind": "module", "file": "18-reliability-observability.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "<em>DR<\/em> (disaster recovery) trả lời câu \"cả region cloud hoặc cả datacenter mất thì sao\". Senior được hỏi chọn mức DR cho một yêu cầu RPO/RTO cụ thể và bảo vệ được chi phí. Kế hoạch DR trên giấy mà chưa diễn tập thường hỏng đúng lúc cần.", "checks": ["Chọn được mức DR cho hệ thống thanh toán RPO 1 phút, RTO 30 phút và bảo vệ được chi phí", "Viết được checklist một buổi DR drill, kể cả tiêu chí \"đạt\""], "children": [{"label": "Bốn mức DR", "kind": "topic", "children": []}, {"label": "DR drill", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Điều phối sự cố lớn", "kind": "module", "file": "18-reliability-observability.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Sự cố lớn thường thất bại vì hỗn loạn nhiều hơn vì thiếu kỹ năng debug: năm người cùng sửa một chỗ, không ai báo khách, không ai ghi lại đã làm gì. Senior được kỳ vọng biết vai trò incident commander và cách giao tiếp trong sự cố.", "checks": ["Viết được một bản cập nhật sự cố cho khách hàng và một bản cho nội bộ, cùng một sự cố", "Nói được IC làm gì trong 10 phút đầu, và khi nào IC phải chuyển giao vai"], "children": [{"label": "Mức SEV", "kind": "topic", "children": []}, {"label": "Vai trò", "kind": "topic", "children": []}, {"label": "Giao tiếp", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Resilience testing", "kind": "module", "file": "18-reliability-observability.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Chỉ biết chắc hệ thống chịu được lỗi khi đã thử gây ra lỗi đó. Hay bị hỏi \"bắt đầu chaos engineering thế nào cho an toàn\", và red flag là trả lời như thể cứ tắt bừa server production.", "checks": ["Thiết kế được thí nghiệm chaos đầu tiên cho hệ thống mình: giả thuyết, blast radius, tiêu chí dừng", "Dùng Toxiproxy thêm 5 giây latency vào Redis và quan sát app hành xử thế nào"], "children": [{"label": "Chaos engineering là gì", "kind": "topic", "children": []}, {"label": "Quy trình", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}, {"label": "Game day", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Công cụ và kiến trúc observability stack", "kind": "module", "file": "18-reliability-observability.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Senior thường phải chọn hoặc sắp xếp lại stack observability: tự host hay SaaS, dùng vendor nào. Quyết định sai tốn tiền nhiều năm, hoặc buộc phải migrate khi vendor ngừng sản phẩm.", "checks": ["Vẽ được observability stack cho một hệ thống Laravel 10 service: app → Collector → backend, alert → on-call", "Nói được hệ thống sẽ biết thế nào nếu chính Prometheus hoặc Alertmanager chết"], "children": [{"label": "Bảng công cụ", "kind": "topic", "children": []}, {"label": "OTel Collector làm lớp trung gian", "kind": "topic", "children": []}, {"label": "Giám sát chính hệ thống giám sát", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 28, "knowledge": "", "prio": "★★"}, {"label": "DevOps và Cloud", "kind": "file", "file": "19-devops-cloud.md", "children": [{"label": "1.1 Container và Docker cơ bản", "kind": "module", "file": "19-devops-cloud.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Hầu hết hệ thống PHP hiện nay chạy trong container, từ docker compose ở máy dev tới Kubernetes trên production. Hiểu layer và build cache quyết định một lần build mất 30 giây hay 10 phút. Hay bị hỏi: container khác VM thế nào, viết Dockerfile tốt cần lưu ý gì.", "checks": ["Giải thích được vì sao đổi một dòng code PHP mà <code>composer install<\/code> không chạy lại", "Viết được Dockerfile multi-stage và so kích thước trước/sau (bài tập 1)", "Nói được 3 khác biệt thực tế giữa container và VM, kể cả về bảo mật"], "children": [{"label": "Image và container", "kind": "topic", "children": []}, {"label": "Container không phải VM", "kind": "topic", "children": []}, {"label": "Layer và build cache", "kind": "topic", "children": []}, {"label": "Multi-stage và image base", "kind": "topic", "children": []}, {"label": "Dữ liệu và mạng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Dockerfile an toàn và chạy đúng", "kind": "module", "file": "19-devops-cloud.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Dockerfile sai thường không làm app lỗi ngay, mà gây hậu quả âm thầm: secret nằm vĩnh viễn trong image, hoặc mỗi lần deploy cắt ngang request vì app không nhận được tín hiệu tắt. Hay bị hỏi: shell form khác exec form thế nào, vì sao <code>docker stop<\/code> mất đúng 10 giây.", "checks": ["Chứng minh được bằng <code>docker stop<\/code> và đo thời gian: shell form bị kill sau 10 giây, exec form tắt ngay", "Tìm được secret trong một image bằng <code>docker history<\/code> hoặc giải nén layer", "Viết được entrypoint script chạy vài bước chuẩn bị rồi chuyển PID 1 cho app"], "children": [{"label": "Không chạy bằng root", "kind": "topic", "children": []}, {"label": "Secret và .dockerignore", "kind": "topic", "children": []}, {"label": "ENTRYPOINT, CMD và PID 1", "kind": "topic", "children": []}, {"label": "HEALTHCHECK và depends_on", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 CI/CD và chiến lược deploy", "kind": "module", "file": "19-devops-cloud.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Pipeline quyết định team deploy được mấy lần một ngày, và mỗi lần deploy có đáng sợ không. Hay bị hỏi: so sánh rolling, blue-green, canary và cách rollback của từng loại, cùng tiêu chí để dừng một canary.", "checks": ["Vẽ được pipeline của project mình và chỉ ra bước nào chậm nhất, bước nào thiếu", "Với mỗi chiến lược deploy, nói được cách rollback và thời gian rollback", "Nêu được tiêu chí dừng canary cụ thể (metric, ngưỡng, thời gian quan sát)"], "children": [{"label": "Pipeline", "kind": "topic", "children": []}, {"label": "CI và CD", "kind": "topic", "children": []}, {"label": "Build một lần, promote nhiều nơi", "kind": "topic", "children": []}, {"label": "Chiến lược deploy", "kind": "topic", "children": []}, {"label": "Feature flag", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Môi trường, config, 12-factor", "kind": "module", "file": "19-devops-cloud.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Bug kiểu \"chạy ở staging, lên production thì hỏng\" thường đến từ khác biệt giữa môi trường và từ config. 12-factor là bộ nguyên tắc nền cho app chạy trên container, và Laravel vốn đi theo nó (<code>.env<\/code>, log ra stderr). Hay bị hỏi: project của bạn vi phạm 12-factor ở đâu.", "checks": ["Chỉ ra được 3 chỗ project hiện tại vi phạm 12-factor và cách sửa", "Liệt kê được mọi khác biệt giữa staging và production của hệ thống mình, và bug nào có thể lọt qua mỗi khác biệt"], "children": [{"label": "Staging", "kind": "topic", "children": []}, {"label": "12-factor, các ý hay hỏi", "kind": "topic", "children": []}, {"label": "Config và secret", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Workload trên Kubernetes", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Kubernetes là nền chạy container phổ biến nhất. Pod, Deployment, Job là các khối cơ bản mà manifest nào cũng dùng, và debug pod lỗi là việc hàng ngày. Hay bị hỏi: debug <code>CrashLoopBackOff<\/code> thế nào, sidecar là gì.", "checks": ["Debug được một pod <code>CrashLoopBackOff<\/code> chỉ bằng <code>describe<\/code> và <code>logs --previous<\/code>", "Giải thích được vì sao sidecar kiểu cũ (container thường) làm Job không bao giờ <code>Complete<\/code>, và native sidecar sửa thế nào", "Viết được CronJob chạy lúc 2 giờ sáng giờ Việt Nam, không chạy chồng"], "children": [{"label": "Pod", "kind": "topic", "children": []}, {"label": "ReplicaSet và Deployment", "kind": "topic", "children": []}, {"label": "Init container và sidecar", "kind": "topic", "children": []}, {"label": "Job và CronJob", "kind": "topic", "children": []}, {"label": "Tổ chức và đóng gói", "kind": "topic", "children": []}, {"label": "Debug", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Service, Ingress, Gateway API", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Pod đổi IP liên tục, nên mọi traffic, dù từ trong cluster hay từ Internet, đều đi qua Service và Ingress/Gateway. Mảng này đang thay đổi: ingress-nginx đã retire và Gateway API là hướng chính, nên nhiều cluster cũ có việc phải chuyển. Hay bị hỏi: pod đang chạy mà không nhận được traffic thì kiểm tra gì.", "checks": ["Viết được <code>Gateway<\/code> + <code>HTTPRoute<\/code> chia 90/10 traffic giữa hai Service", "Giải thích được vì sao pod đang chạy mà Service không gửi traffic tới (readiness, selector sai, port sai)", "Lập được kế hoạch chuyển một cluster đang dùng ingress-nginx sang Gateway API, kể cả annotation không có tương đương"], "children": [{"label": "Service", "kind": "topic", "children": []}, {"label": "Ingress", "kind": "topic", "children": []}, {"label": "Gateway API", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 ConfigMap và Secret", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "App Laravel nào cũng cần config và secret (DB password, API key). Hiểu sai Secret của Kubernetes dẫn tới tưởng đã mã hoá, trong khi ai có quyền đọc cũng thấy. Hay bị hỏi: Secret có an toàn không, đổi ConfigMap thì app có nhận không.", "checks": ["Đọc được nội dung một Secret bằng một lệnh <code>kubectl<\/code> và nói được ai trong team đang có quyền đó", "Thiết kế được luồng secret DB password từ AWS Secrets Manager tới app Laravel, kể cả lúc xoay vòng"], "children": [{"label": "Cách dùng", "kind": "topic", "children": []}, {"label": "Secret không phải mã hoá", "kind": "topic", "children": []}, {"label": "Đổi config", "kind": "topic", "children": []}, {"label": "Credential cloud cho pod", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Probes", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Probe quyết định khi nào Kubernetes restart pod và khi nào gửi traffic tới pod. Cấu hình sai là nguyên nhân kinh điển của restart hàng loạt, tức sự cố do chính hệ thống tự gây ra. Module này là phần thực hành trên Kubernetes của health check ở module 1.2 của <a href=\"18-reliability-observability.md\" target=\"_blank\" rel=\"noopener\">18-reliability-observability.md<\/a>.", "checks": ["Viết được bộ ba probe cho một pod PHP-FPM + Nginx và giải thích từng tham số thời gian", "Tái hiện được trên cluster local: liveness gọi DB, tắt DB, quan sát restart hàng loạt"], "children": [{"label": "Ba loại probe", "kind": "topic", "children": []}, {"label": "Các bẫy", "kind": "topic", "children": []}, {"label": "Endpoint probe", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Resource, QoS và autoscaling", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đặt resource sai gây ra những sự cố khó hiểu: pod bị OOMKilled, pod chậm bất thường vì bị throttle, hoặc hoá đơn cloud phình to. Với PHP-FPM còn phải tính <code>pm.max_children<\/code> cho khớp memory limit. Hay bị hỏi: request khác limit thế nào, HPA scale theo gì.", "checks": ["Tính được <code>pm.max_children<\/code> hợp lý cho pod có memory limit 1Gi, dựa trên bộ nhớ đo được của một worker", "Giải thích được vì sao pod chưa chạm CPU limit trung bình mà latency vẫn tăng (throttle theo chu kỳ CFS)", "Nói được HPA scale theo CPU có vấn đề gì với queue worker, và vì sao KEDA theo độ dài queue hợp hơn"], "children": [{"label": "Request và limit", "kind": "topic", "children": []}, {"label": "QoS", "kind": "topic", "children": []}, {"label": "Runtime phải biết limit", "kind": "topic", "children": []}, {"label": "HPA", "kind": "topic", "children": []}, {"label": "Node autoscaling", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Rolling update và graceful shutdown", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Deploy không downtime\" là yêu cầu mặc định, nhưng rất nhiều hệ thống vẫn có vài lỗi 502 mỗi lần deploy mà không ai hiểu vì sao. Nguyên nhân nằm ở trình tự tắt pod. Hay bị hỏi: vẽ dòng thời gian từ lúc xoá pod tới lúc process thoát.", "checks": ["Vẽ được dòng thời gian từ <code>kubectl delete pod<\/code> tới lúc process exit, có cả LB và kube-proxy", "Tái hiện được lỗi 502 khi rollout không có preStop (chạy <code>hey<\/code>/<code>wrk<\/code> trong lúc rollout), rồi sửa", "Tính được <code>terminationGracePeriodSeconds<\/code> cho service có request dài nhất 20 giây"], "children": [{"label": "Rolling update", "kind": "topic", "children": []}, {"label": "Chuyện gì xảy ra khi xoá pod", "kind": "topic", "children": []}, {"label": "Tắt êm đúng cách", "kind": "topic", "children": []}, {"label": "Zero-downtime cần đủ cả năm thứ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Tầng PHP: PHP-FPM, queue và runtime trong container", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. PHP-FPM có mô hình process và signal khác app Go/Java chỉ gồm một binary, nên nhiều mặc định của Kubernetes không tự đúng. Đa số lỗi deploy Laravel trên Kubernetes (request bị cắt, config sai môi trường, job chạy hai lần) nằm ở module này.", "checks": ["Chứng minh được bằng thí nghiệm: gửi <code>SIGTERM<\/code> và <code>SIGQUIT<\/code> cho PHP-FPM đang có request 10 giây, kết quả khác nhau thế nào", "Viết được manifest cho app Laravel gồm: pod web (Nginx + FPM), Deployment queue worker, scheduler, Job migration", "Giải thích được vì sao <code>config:cache<\/code> trong Dockerfile làm staging đọc DB của môi trường build", "Tính được grace period cho queue worker có job dài nhất 5 phút, kèm <code>retry_after<\/code>"], "children": [{"label": "Một hay hai container", "kind": "topic", "children": []}, {"label": "Image và OPcache", "kind": "topic", "children": []}, {"label": "Laravel optimize", "kind": "topic", "children": []}, {"label": "Graceful shutdown của PHP-FPM", "kind": "topic", "children": []}, {"label": "Queue worker, scheduler, migration", "kind": "topic", "children": []}, {"label": "Health check và log", "kind": "topic", "children": []}, {"label": "Runtime chạy lâu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 CI nâng cao: cache, secret, quality gate", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Pipeline CI có quyền deploy lên production, nên nó là mục tiêu tấn công hấp dẫn. Ở mức mid trở lên, bạn được hỏi cách giữ CI nhanh (cache), an toàn (secret, OIDC), và cách đặt quality gate mà mọi người không tìm cách lách.", "checks": ["Cấu hình được GitHub Actions deploy lên AWS bằng OIDC, không có access key nào trong repo", "Chỉ ra được trong pipeline hiện tại chỗ nào một PR độc hại có thể đọc được secret"], "children": [{"label": "Cache", "kind": "topic", "children": []}, {"label": "Secret trong CI", "kind": "topic", "children": []}, {"label": "Quality gate", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.9 Terraform và Ansible", "kind": "module", "file": "19-devops-cloud.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Hạ tầng tạo bằng tay trên console thì không tái tạo được và không review được. <em>IaC<\/em> (infrastructure as code) là nền cho nhiều môi trường giống nhau và cho DR. Terraform là công cụ phổ biến nhất, và state là phần hay bị hỏi cũng như hay gây sự cố nhất.", "checks": ["Đọc một <code>plan<\/code> và chỉ ra ngay dòng nào nguy hiểm", "Chuyển được một backend S3 từ DynamoDB lock sang <code>use_lockfile<\/code> mà không có lúc nào không có lock", "Giải thích được vì sao tách state production khỏi staging"], "children": [{"label": "Terraform làm việc thế nào", "kind": "topic", "children": []}, {"label": "State", "kind": "topic", "children": []}, {"label": "Tổ chức code", "kind": "topic", "children": []}, {"label": "Ansible", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Bảo mật Kubernetes", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Mặc định Kubernetes khá \"mở\": pod chạy root được, mọi pod gọi được mọi pod, token gọi API server được mount sẵn vào pod. Một pod bị chiếm có thể thành bàn đạp để chiếm cả cluster. Senior được hỏi các lớp phòng thủ và các đường leo quyền.", "checks": ["Chạy được app Laravel ở namespace <code>restricted<\/code> với <code>readOnlyRootFilesystem: true<\/code>", "Viết được bộ NetworkPolicy default-deny cho namespace có web, worker, Redis, và chứng minh DNS vẫn chạy", "Kể được 3 đường một pod bị chiếm quyền có thể leo sang toàn cluster, và cách chặn mỗi đường"], "children": [{"label": "securityContext", "kind": "topic", "children": []}, {"label": "Pod Security Admission", "kind": "topic", "children": []}, {"label": "NetworkPolicy", "kind": "topic", "children": []}, {"label": "RBAC", "kind": "topic", "children": []}, {"label": "Secret và admission policy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 PodDisruptionBudget, StatefulSet, scheduling", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Nâng cấp cluster và drain node là việc định kỳ. Không có PDB và topology spread thì một lần drain có thể tắt mọi replica cùng lúc. StatefulSet gắn với câu hỏi hay gặp \"có nên chạy DB trên Kubernetes không\".", "checks": ["Đặt được PDB và topology spread cho Deployment 3 replica chạy trên 3 AZ, và giải thích điều gì xảy ra khi drain một node", "Bảo vệ được quyết định dùng RDS thay vì MySQL trên StatefulSet"], "children": [{"label": "Gián đoạn tự nguyện và không tự nguyện", "kind": "topic", "children": []}, {"label": "PodDisruptionBudget", "kind": "topic", "children": []}, {"label": "Rải replica", "kind": "topic", "children": []}, {"label": "StatefulSet", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Migration khi deploy và rollback dữ liệu", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Code rollback thì dễ, dữ liệu thì không. Mọi chiến lược deploy không downtime đều có lúc bản cũ và bản mới cùng chạy trên một DB, nên migration phải được thiết kế cho lúc đó. Hay bị hỏi: đổi tên cột thế nào mà không downtime.", "checks": ["Lập được kế hoạch tách <code>address<\/code> text thành bảng <code>addresses<\/code> (bài tập 3), mỗi bước ghi rollback thế nào", "Liệt kê được 3 thay đổi không rollback được trong một lần deploy bình thường và cách giảm rủi ro"], "children": [{"label": "Vì sao migration là vấn đề", "kind": "topic", "children": []}, {"label": "Expand/contract", "kind": "topic", "children": []}, {"label": "Migration nguy hiểm trên bảng lớn", "kind": "topic", "children": []}, {"label": "Chạy migration ở đâu", "kind": "topic", "children": []}, {"label": "Rollback dữ liệu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 GitOps và supply chain", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Câu \"production đang chạy đúng commit nào\" nghe đơn giản, nhưng nhiều team không trả lời được. GitOps giúp trả lời câu đó, còn supply chain security chứng minh image đang chạy đúng là image team đã build, không bị ai chèn gì vào.", "checks": ["So sánh được CI push deploy với GitOps pull theo 4 tiêu chí: credential, audit, rollback, drift", "Trả lời được \"production đang chạy đúng commit nào\" trong 1 phút với hệ thống của mình"], "children": [{"label": "GitOps", "kind": "topic", "children": []}, {"label": "Tag image", "kind": "topic", "children": []}, {"label": "Supply chain", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Dịch vụ cloud (AWS làm ví dụ)", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Phỏng vấn system design gần như luôn có phần \"chạy trên cloud thế nào\". Cần gọi đúng tên dịch vụ, biết điểm khác nhau giữa các dịch vụ gần giống nhau, và biết các bẫy gây tốn tiền hoặc rò dữ liệu. AWS làm ví dụ vì phổ biến nhất, bảng dưới giúp chuyển sang GCP/Azure.", "checks": ["Vẽ được kiến trúc AWS cho app Laravel: ALB, ECS/EKS ở 2 AZ, RDS Multi-AZ, ElastiCache, SQS, S3 + CloudFront", "Viết được IAM policy cho worker chỉ đọc/xoá message của một queue SQS và ghi vào một prefix S3", "Giải thích được RDS Multi-AZ và read replica khác nhau ở mục đích và ở RPO"], "children": [{"label": "Tương đương giữa các cloud", "kind": "topic", "children": []}, {"label": "Region, AZ và compute", "kind": "topic", "children": []}, {"label": "S3", "kind": "topic", "children": []}, {"label": "Database", "kind": "topic", "children": []}, {"label": "Queue và DNS", "kind": "topic", "children": []}, {"label": "IAM", "kind": "topic", "children": []}, {"label": "Mạng và log", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.6 Serverless trade-off", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Serverless hấp dẫn vì không phải quản server, nhưng có những giới hạn làm nó không hợp với mọi loại tải. Hay bị hỏi: cold start là gì, và vì sao một đợt spike trên Lambda có thể đánh sập DB.", "checks": ["Tính được điểm hoà vốn giữa Lambda và container cho một API ở 50 request/giây đều đặn", "Giải thích được một đợt spike trên Lambda đánh sập RDS thế nào và 2 cách chặn"], "children": [{"label": "Ưu điểm", "kind": "topic", "children": []}, {"label": "Cold start", "kind": "topic", "children": []}, {"label": "Giới hạn", "kind": "topic", "children": []}, {"label": "Concurrency và DB", "kind": "topic", "children": []}, {"label": "Chi phí và các đánh đổi khác", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.7 Cost awareness", "kind": "module", "file": "19-devops-cloud.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Senior được kỳ vọng biết kiến trúc mình đề xuất tốn bao nhiêu tiền, và điều tra được khi hoá đơn tăng bất thường. Nhiều khoản lớn nằm ở chỗ ít ai để ý, như data transfer và NAT gateway.", "checks": ["Ước lượng được hoá đơn tháng cho kiến trúc ở bài tập 5 và chỉ ra khoản lớn nhất", "Kể được quy trình điều tra \"hoá đơn tăng 40% mà traffic không đổi\""], "children": [{"label": "Các khoản hay bị bỏ qua", "kind": "topic", "children": []}, {"label": "Ví dụ kinh điển: S3 qua NAT gateway", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}, {"label": "Mô hình giá", "kind": "topic", "children": []}, {"label": "Góc senior", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 29, "knowledge": "", "prio": "★★"}, {"label": "Testing và chất lượng code", "kind": "file", "file": "20-testing-quality.md", "children": [{"label": "1.1 Các loại test và chiến lược", "kind": "module", "file": "20-testing-quality.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Trong dự án Laravel thật, thời gian viết test luôn có hạn, nên câu hỏi thật là \"viết loại test nào, cho chỗ nào\". Người phỏng vấn hay mở đầu bằng \"unit khác integration thế nào\", rồi hỏi tiếp \"vậy với service của bạn, bạn viết loại nào nhiều hơn, vì sao\". Trả lời \"theo test pyramid\" mà không nói được lý do là điểm trừ.", "checks": ["Với một service tính giá và một service CRUD admin, chọn được tỉ lệ loại test và bảo vệ lựa chọn", "Phân loại được 10 test có sẵn trong dự án của mình vào đúng cột của bảng trên", "Nói được một ca e2e là lựa chọn đúng và một ca e2e là lãng phí"], ode về"], "children": [{"label": "Merge, rebase, squash", "kind": "topic", "children": []}, {"label": "Cherry-pick", "kind": "topic", "children": []}, {"label": "Revert và reset", "kind": "topic", "children": []}, {"label": "Conflict", "kind": "topic", "children": []}, {"label": "Commit message", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Code review và PR", "kind": "module", "file": "20-testing-quality.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Code review là nơi senior tạo ảnh hưởng lớn nhất lên chất lượng của cả team, không chỉ code của mình. Câu \"khi review bạn nhìn vào đâu\" rất hay gặp. Người chỉ nói về đặt tên và format bị đánh giá là chưa đủ tầm, còn tình huống \"PR 3000 dòng, deadline mai\" là câu hỏi senior kinh điển.", "checks": ["Viết được checklist review 10 dòng cho team mình, sắp theo mức quan trọng (bài tập 4)", "Viết lại được 3 comment review \"cộc\" thành dạng câu hỏi có lý do", "Tách được một PR 1500 dòng thành 3–4 PR có thể merge độc lập"], "children": [{"label": "Review cái gì, theo thứ tự quan trọng", "kind": "topic", "children": []}, {"label": "Cách góp ý", "kind": "topic", "children": []}, {"label": "Khi bị review", "kind": "topic", "children": []}, {"label": "Kích thước PR", "kind": "topic", "children": []}, {"label": "Definition of Done", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Test isolation, DB và flaky test", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Suite test Laravel nào có DB cũng sớm gặp hai vấn đề: test ảnh hưởng lẫn nhau qua dữ liệu, và test lúc xanh lúc đỏ. Nặng hơn, test trỏ nhầm DB dev dùng chung có thể xoá sạch dữ liệu của cả team. Người phỏng vấn hay hỏi \"cô lập DB trong test thế nào\" và \"flaky test do đâu\", kèm tình huống sự cố thật.", "checks": ["Viết được guard trong <code>setUp<\/code> chặn test chạy trên DB không phải DB test", "Chỉ ra được 3 thứ transaction rollback không dọn được trong một test Laravel có queue và Redis", "Cho một test flaky thật, phân loại được nguyên nhân theo bảng và sửa tận gốc"], "children": [{"label": "Test isolation là gì", "kind": "topic", "children": []}, {"label": "Cách cô lập DB", "kind": "topic", "children": []}, {"label": "Không bao giờ nối vào DB dùng chung", "kind": "topic", "children": []}, {"label": "SQLite in-memory và Testcontainers", "kind": "topic", "children": []}, {"label": "Flaky test", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Test những thứ khó", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Phần lớn bug khó chịu nhất trong backend PHP nằm ở những chỗ khó test: thời gian (bug cuối tháng), API thanh toán bên ngoài, job trong queue, migration. \"Bạn test hàm gọi API thanh toán thế nào?\" và \"test hàm phụ thuộc thời gian hiện tại thế nào?\" là hai câu kinh điển ở mức mid.", "checks": ["Đổi được một hàm gọi <code>now()<\/code> trực tiếp sang inject clock và liệt kê 5 ca thời gian cần test (bài tập 1)", "Liệt kê được 6 ca cần test cho adapter gọi cổng thanh toán, và ca nào test ở tầng nào", "Viết được hai test riêng cho \"đặt hàng thì dispatch job gửi email\" và \"job gửi email làm đúng\""], "children": [{"label": "Thời gian", "kind": "topic", "children": []}, {"label": "Code gọi API ngoài", "kind": "topic", "children": []}, {"label": "Queue và async (🟡)", "kind": "topic", "children": []}, {"label": "Migration (🟡)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Testing trong PHP và Laravel", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Đây là bộ công cụ bạn dùng hằng ngày nếu làm Laravel, nên người phỏng vấn kỳ vọng bạn biết cả cạm bẫy của nó chứ không chỉ cú pháp. Hay gặp: \"PHPUnit hay Pest?\", \"<code>Event::fake()<\/code> có bẫy gì?\", và viết một feature test cho endpoint tạo đơn.", "checks": ["Viết được feature test cho endpoint tạo đơn: kiểm response, DB, job đã dispatch, email chưa gửi khi thanh toán fail", "Chỉ ra được một test dùng <code>Event::fake()<\/code> pass sai vì observer không chạy, rồi sửa bằng fake một phần", "Chạy được suite song song với DB riêng mỗi process và đo thời gian trước/sau"], "children": [{"label": "PHPUnit", "kind": "topic", "children": []}, {"label": "Pest", "kind": "topic", "children": []}, {"label": "Mockery", "kind": "topic", "children": []}, {"label": "Helper của Laravel: HTTP và DB", "kind": "topic", "children": []}, {"label": "Fakes của Laravel", "kind": "topic", "children": []}, {"label": "Chạy song song và browser test", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Contract testing", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi hệ thống tách thành nhiều service (ví dụ app Laravel gọi service thanh toán của team khác), lỗi hay gặp là bên kia đổi API và bên này vỡ mà không ai biết cho tới production. Câu hỏi thường là \"contract test giải quyết vấn đề gì\" và \"khi nào không đáng làm\".", "checks": ["Vẽ được luồng consumer → pact → broker → provider verify, và chỉ ra bước nào chặn deploy", "Nói được khi nào contract test không đáng công"], "children": [{"label": "Vấn đề cần giải", "kind": "topic", "children": []}, {"label": "Consumer-driven contract", "kind": "topic", "children": []}, {"label": "Giới hạn", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Static analysis, linter và CI", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Với PHP, static analysis bắt được cả loạt bug mà các ngôn ngữ có compiler tự bắt, trước khi code chạy. CI là nơi mọi kiểm tra này thành bắt buộc. Câu hỏi senior hay gặp: \"đưa PHPStan vào codebase cũ có hàng nghìn lỗi thế nào\" và \"test suite chạy 40 phút, dev không chờ CI nữa, bạn làm gì\".", "checks": ["Mô tả được lộ trình đưa PHPStan vào dự án chưa từng dùng, gồm baseline và nâng level (bài tập 5)", "Viết được pipeline CI cho Laravel: Pint, PHPStan, test song song với MySQL service, thời gian dưới 10 phút", "Giải thích được vì sao level cao bắn lỗi nhiều ở code dùng magic của Eloquent và Larastan giúp gì"], "children": [{"label": "Static analysis là gì", "kind": "topic", "children": []}, {"label": "Đưa vào codebase cũ", "kind": "topic", "children": []}, {"label": "Linter và formatter", "kind": "topic", "children": []}, {"label": "Test trong CI", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Git nâng cao và quy trình nhóm", "kind": "module", "file": "20-testing-quality.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Các lệnh Git nâng cao cứu bạn trong lúc sự cố: tìm lại code sau khi reset nhầm, tìm commit gây lỗi trong hàng trăm commit. Chọn branching strategy ảnh hưởng tới tốc độ release của cả team. Hay bị hỏi: \"Git flow hay trunk-based?\" và \"tìm commit gây chậm API trong 200 commit thế nào\".", "checks": ["Dùng được <code>git bisect run<\/code> với một script trả exit code để tìm commit gây lỗi (bài tập 6)", "Cứu được một nhánh sau khi <code>reset --hard<\/code> nhầm, chỉ bằng reflog", "Tư vấn được git flow hay trunk-based cho một team cụ thể dựa trên 4 câu hỏi"], "children": [{"label": "Ba lệnh cứu hộ", "kind": "topic", "children": []}, {"label": "Branching strategy", "kind": "topic", "children": []}, {"label": "Feature flag", "kind": "topic", "children": []}, {"label": "Agile và Scrum cơ bản", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 TDD, BDD và chọn phương pháp", "kind": "module", "file": "20-testing-quality.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Câu \"bạn có dùng TDD không\" gần như chắc chắn xuất hiện, và nó kiểm độ trung thực nhiều hơn kiến thức. Người phỏng vấn muốn nghe bạn dùng khi nào, không dùng khi nào, vì sao. BDD và test ở quy mô lớn là chủ đề senior khi bàn chiến lược test cho cả hệ thống.", "checks": ["Kể được một lần dùng TDD có lợi và một lần không, kèm lý do", "Viết được một kịch bản Given–When–Then cho luồng hoàn tiền mà PO đọc hiểu được"], "children": [{"label": "TDD", "kind": "topic", "children": []}, {"label": "BDD", "kind": "topic", "children": []}, {"label": "Test lớn ở quy mô lớn (🔴)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Đo chất lượng test: coverage, mutation, property-based", "kind": "module", "file": "20-testing-quality.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Quản lý hay đặt KPI \"coverage 80%\" và senior phải giải thích được vì sao con số đó không nói lên test tốt hay dở. Mutation testing và property-based testing là hai công cụ đo và tăng chất lượng test thật sự, rất hợp với code tính tiền. Hay bị hỏi: \"coverage 90% có nghĩa là test tốt không?\" và \"mutation testing là gì\".", "checks": ["Chạy Infection trên một module tiền, đọc được danh sách mutant sống và viết test giết ít nhất 3 mutant", "Viết được ba tính chất cho hàm chia tiền thành n phần có làm tròn (bài tập 3)", "Giải thích được cho quản lý vì sao không đặt KPI coverage 90%"], "children": [{"label": "Coverage", "kind": "topic", "children": []}, {"label": "Mutation testing", "kind": "topic", "children": []}, {"label": "Property-based testing", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Test concurrency", "kind": "module", "file": "20-testing-quality.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Bug concurrency (bán quá tồn kho, rút tiền hai lần) là loại bug đắt nhất và khó tái hiện nhất, vì chỉ xảy ra khi hai request trùng thời điểm. Test thường chạy tuần tự nên không bao giờ bắt được. Câu \"test chống rút tiền hai lần thế nào\" là câu senior hay gặp, và bẫy nằm ở việc dùng <code>RefreshDatabase<\/code>.", "checks": ["Viết được test chứng minh luồng trừ tồn kho cũ bị bán quá, rồi pass sau khi sửa bằng update có điều kiện", "Giải thích được vì sao test dùng transaction rollback không thể kiểm được deadlock"], "children": [{"label": "Race condition và
