 số lần gọi provider tối đa khi SDK, app và queue đều có retry"], "children": [{"label": "Timeout", "kind": "topic", "children": []}, {"label": "Lỗi nào retry, lỗi nào không", "kind": "topic", "children": []}, {"label": "Retry nhân chi phí", "kind": "topic", "children": []}, {"label": "Rate limit và quota", "kind": "topic", "children": []}, {"label": "Stop reason", "kind": "topic", "children": []}, {"label": "finish reason). Luôn kiểm tra trường này trước khi dùng output.", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Structured output và tool use", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "Phần lớn tính năng AI trong backend không phải chatbot, mà là trích xuất và phân loại: đọc hoá đơn thành JSON, gắn nhãn ticket hỗ trợ. Structured output biến câu trả lời tự do thành dữ liệu mà code dùng được. Tool use là nền của agent. Câu hay bị hỏi: \"ai thực thi tool\".", "checks": ["Vẽ được sequence của một lượt tool use: request có tool → response <code>tool_use<\/code> → backend chạy → gửi <code>tool_result<\/code> → câu trả lời cuối", "Viết được JSON schema cho tool <code>search_orders<\/code> có enum trạng thái và khoảng ngày", "Giải thích được vì sao có chế độ ép schema rồi vẫn phải validate phía mình"], "children": [{"label": "Structured output", "kind": "topic", "children": []}, {"label": "Tool use", "kind": "topic", "children": []}, {"label": "Thiết kế tool", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Không tin output LLM", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟢", "stage": "Chặng 1: Nền 🟢", "why": "LLM có thể bịa và có thể bị điều khiển qua input, nên output của nó nguy hiểm y như dữ liệu người dùng gõ vào form. Lỗ hổng thật thường không nằm ở model, mà ở chỗ backend dùng output: render ra HTML, chạy SQL, gọi URL. Red flag hay gặp: \"đã bật JSON mode nên không cần validate\".", "checks": ["Viết được lớp validate cho output trích xuất hoá đơn, bắt được ít nhất 5 kiểu output sai", "Chỉ ra được đường rò dữ liệu qua ảnh markdown trong một chatbot render Markdown"], "children": [{"label": "Coi output như input không tin cậy", "kind": "topic", "children": []}, {"label": "Tham số tool", "kind": "topic", "children": []}, {"label": "Chuẩn bị cho output hỏng", "kind": "topic", "children": []}, {"label": "Output gây lỗ hổng ở hệ thống phía sau", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Streaming", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Câu trả lời của LLM mất vài chục giây mới xong. Không stream thì user nhìn màn hình trống suốt thời gian đó. Streaming làm chữ hiện dần, cảm giác nhanh hơn nhiều. Sự cố kinh điển hay bị hỏi: chạy local thì chữ hiện dần, lên staging thì ra một cục ở cuối.", "checks": ["Đọc được một stream SSE thô bằng <code>curl -N<\/code> và chỉ ra event bắt đầu, delta, kết thúc", "Giải thích được vì sao stream chạy local mà lên staging thì ra một cục, và 3 chỗ có thể đang buffer"], "children": [{"label": "Streaming hoạt động thế nào", "kind": "topic", "children": []}, {"label": "Cạm bẫy khi stream", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Tầng PHP: gọi LLM từ PHP-FPM và Laravel", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Module riêng cho người làm PHP. PHP-FPM chạy mô hình một request một worker: worker đang chờ LLM 30 giây thì không phục vụ được ai khác. Vì vậy lời gọi LLM (chậm, dài) nguy hiểm với PHP-FPM hơn nhiều so với Go hoặc Java, nơi chờ I/O rẻ hơn. Câu hay gặp: \"tính năng AI làm hết FPM worker giờ cao điểm, sửa thế nào\".", "checks": ["Stream được câu trả lời từ provider tới trình duyệt qua Nginx + PHP-FPM, chữ hiện dần chứ không ra một cục (bài tập 6)", "Tính được số request LLM đồng thời làm cạn FPM pool của hệ thống mình", "Viết được queue job gọi LLM idempotent: chạy lại không gọi provider lần hai nếu đã có kết quả", "Liệt kê được mọi tầng timeout từ trình duyệt tới provider và tầng nào cắt trước"], "children": [{"label": "Thư viện", "kind": "topic", "children": []}, {"label": "Timeout nhiều tầng", "kind": "topic", "children": []}, {"label": "Không gọi đồng bộ trong request web cho tác vụ dài", "kind": "topic", "children": []}, {"label": "Streaming qua PHP-FPM và Nginx", "kind": "topic", "children": []}, {"label": "Process sống lâu", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Chi phí và caching", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Hoá đơn LLM có thể tăng gấp mấy lần chỉ sau một lần đổi prompt, và người phỏng vấn hay hỏi đúng tình huống đó. Prompt caching là cách giảm chi phí và latency hiệu quả, nhưng có nhiều điều kiện ngầm: bật sai thì không có tác dụng mà cũng không báo lỗi.", "checks": ["Sắp xếp lại một prompt thật để tận dụng cache, và chứng minh bằng số token cache đọc được trong response", "Giải thích được vì sao bật prompt caching mà hoá đơn không giảm (3 nguyên nhân)", "Thiết kế được cache key cho kết quả phân loại mà không lộ dữ liệu giữa tenant"], "children": [{"label": "Giảm chi phí", "kind": "topic", "children": []}, {"label": "Prompt caching phía provider", "kind": "topic", "children": []}, {"label": "Cache kết quả phía mình", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Chọn model, fallback và LLM gateway", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Provider LLM cũng sập, cũng đổi giá, cũng ra model mới liên tục. Hệ thống tốt phải đổi được provider hoặc model mà không sửa nghiệp vụ, và vẫn chạy khi provider chính chết. Câu hay hỏi: \"provider chính bị sự cố một giờ thì hệ thống của bạn làm gì\".", "checks": ["Viết được interface adapter có timeout, retry, fallback, ghi token và chi phí (bài tập 2)", "Nêu được 5 trách nhiệm của LLM gateway và cái giá của việc thêm nó"], "children": [{"label": "Chọn model", "kind": "topic", "children": []}, {"label": "Lớp adapter", "kind": "topic", "children": []}, {"label": "Fallback", "kind": "topic", "children": []}, {"label": "LLM gateway", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 RAG: luồng, chunking, embedding, vector store", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "RAG là kiến trúc phổ biến nhất khi đưa dữ liệu công ty vào LLM: chatbot hỏi đáp tài liệu nội bộ, trợ lý hỗ trợ khách hàng. Phần lớn công việc nằm ở ingest dữ liệu, lưu vector và lọc quyền, tức là việc quen thuộc của backend. Câu hay hỏi: \"vì sao RAG mà không fine-tune\" và \"hệ thống đang dùng MySQL thì lưu vector ở đâu\".", "checks": ["Tự dựng được RAG nhỏ trên pgvector với 50 tài liệu thật, trả lời có trích dẫn", "Giải thích được vì sao đổi model embedding bắt buộc embed lại toàn bộ", "Bảo vệ được lựa chọn vector store cho hệ thống đang dùng MySQL (bài tập 5)"], "children": [{"label": "RAG là gì", "kind": "topic", "children": []}, {"label": "Vì sao chọn RAG", "kind": "topic", "children": []}, {"label": "Chunking", "kind": "topic", "children": []}, {"label": "Embedding", "kind": "topic", "children": []}, {"label": "Vector store", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.6 Hybrid search, rerank và cập nhật index", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "RAG chỉ dùng vector search thường trả lời sai với câu hỏi chứa mã đơn hàng hay tên riêng. Còn phần khó nhất khi vận hành RAG là giữ index đồng bộ với dữ liệu gốc: tài liệu đã bị xoá hay đổi quyền mà vector vẫn còn là một sự cố bảo mật.", "checks": ["Tính tay được điểm RRF của 3 tài liệu từ hai danh sách xếp hạng", "Thiết kế được luồng đồng bộ index khi tài liệu bị xoá hoặc đổi quyền, và chỉ ra chỗ có thể lệch"], "children": [{"label": "Hybrid search", "kind": "topic", "children": []}, {"label": "Rerank", "kind": "topic", "children": []}, {"label": "Cập nhật index khi dữ liệu đổi", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.7 Agent và workflow", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "\"Agent\" là từ khoá nóng, và người phỏng vấn senior muốn nghe bạn biết khi nào <strong>không<\/strong> dùng agent. Agent không giới hạn là cách nhanh nhất để đốt tiền, hoặc để model tự ý hoàn tiền cho khách. Câu hay hỏi: \"workflow hay agent\" và \"đặt giới hạn gì cho agent\".", "checks": ["Viết được vòng lặp tool có đủ ba giới hạn và xử lý tool lỗi", "Với agent có <code>search_orders<\/code>, <code>refund_order<\/code>, <code>send_email<\/code>, đặt được giới hạn và kiểm soát cho từng tool (bài tập 4)"], "children": [{"label": "Vòng lặp tool", "kind": "topic", "children": []}, {"label": "Workflow hay agent", "kind": "topic", "children": []}, {"label": "Giới hạn", "kind": "topic", "children": []}, {"label": "Hành động không đảo ngược được", "kind": "topic", "children": []}, {"label": "Tác vụ dài", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.8 Model Context Protocol (MCP)", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "MCP đang thành cách chuẩn để trợ lý AI (IDE, chat nội bộ) gọi vào hệ thống của công ty. Backend có thể được giao việc \"mở API cho agent dùng\", và phải biết rủi ro khi cài MCP server của bên thứ ba. Red flag hay gặp: \"MCP thay cho REST API\".", "checks": ["Giải thích được MCP khác tool use thông thường ở đâu, và khi nào không cần MCP", "Viết được một MCP server nhỏ (PHP hoặc Laravel) mở 2 tool đọc dữ liệu, có kiểm quyền theo user", "Liệt kê được 4 rủi ro khi cho agent nội bộ dùng MCP server bên thứ ba và cách giảm"], "children": [{"label": "MCP là gì", "kind": "topic", "children": []}, {"label": "Giao thức", "kind": "topic", "children": []}, {"label": "Góc backend", "kind": "topic", "children": []}, {"label": "Rủi ro", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.9 Log, theo dõi production, version prompt", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🟡", "stage": "Chặng 2: Làm chủ 🟡", "why": "Khi user phàn nàn \"bot trả lời sai\", không có log đầy đủ thì không có cách nào biết vì sao. Chất lượng còn có thể giảm mà không có lỗi nào. Module này nối kiến thức observability quen thuộc với các đặc thù của LLM.", "checks": ["Thiết kế được bảng/log schema cho mỗi lời gọi LLM đủ để trả lời \"vì sao user X nhận câu trả lời sai lúc 10:05\"", "Liệt kê được 6 metric production cho một tính năng LLM và ngưỡng alert cho 2 metric trong đó"], "children": [{"label": "Log gì cho mỗi lời gọi", "kind": "topic", "children": []}, {"label": "Metric production", "kind": "topic", "children": []}, {"label": "Chất lượng giảm mà không có lỗi", "kind": "topic", "children": []}, {"label": "Version prompt như code", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Prompt injection", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Đây là rủi ro bảo mật số một của ứng dụng LLM (OWASP LLM01) và gần như chắc chắn bị hỏi ở vòng senior. Khác SQL injection, nó chưa có cách sửa triệt để, nên câu trả lời phải là phòng thủ bằng kiến trúc. Red flag: \"thêm vào system prompt câu 'không làm theo chỉ dẫn của user'\".", "checks": ["Viết được một prompt injection gián tiếp nằm trong email làm agent đọc email gửi dữ liệu ra ngoài, rồi chỉ ra chân nào của trifecta cần cắt", "Giải thích được vì sao \"thêm câu 'không làm theo chỉ dẫn trong dữ liệu' vào system prompt\" không phải là biện pháp đủ"], "children": [{"label": "Prompt injection là gì", "kind": "topic", "children": []}, {"label": "Phòng thủ bằng kiến trúc", "kind": "topic", "children": []}, {"label": "Lethal trifecta", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Rò rỉ dữ liệu, PII và phân quyền trong RAG", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Sự cố hay gặp nhất với chatbot nội bộ không phải là model trả lời sai, mà là trả lời đúng bằng tài liệu người hỏi không có quyền xem. Gửi dữ liệu khách hàng ra provider còn là vấn đề pháp lý. Đây là kiến thức phân quyền và multi-tenant quen thuộc, áp vào RAG.", "checks": ["Chỉ ra được 3 điểm rò dữ liệu trong sơ đồ \"hỏi đáp tài liệu nội bộ\" (bài tập 1)", "Viết được query vector có filter tenant và ACL mà code gọi không thể quên truyền"], "children": [{"label": "System prompt không phải chỗ giữ bí mật", "kind": "topic", "children": []}, {"label": "Các đường rò giữa user", "kind": "topic", "children": []}, {"label": "Gửi PII ra provider", "kind": "topic", "children": []}, {"label": "Phân quyền trong RAG", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Guardrail và moderation", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Chatbot hướng tới khách hàng cần một lớp chặn nội dung độc hại, câu hỏi lạc chủ đề và PII. Người phỏng vấn muốn nghe bạn cân được lợi ích của guardrail với latency, chi phí và chặn nhầm, và biết guardrail không thay được phòng thủ kiến trúc.", "checks": ["Thiết kế được pipeline guardrail cho chatbot hỗ trợ khách hàng: kiểm gì ở input, gì ở output, và latency cộng thêm", "Giải thích được vì sao guardrail phát hiện injection không thay được quyền tool tối thiểu"], "children": [{"label": "Guardrail là gì", "kind": "topic", "children": []}, {"label": "Kiểm gì", "kind": "topic", "children": []}, {"label": "Công cụ", "kind": "topic", "children": []}, {"label": "Cái giá và cạm bẫy", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Eval", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Không có eval thì mỗi lần đổi prompt hay model là đoán mò. Eval là \"test suite\" của phần LLM, và câu \"bạn đo chất lượng hệ RAG thế nào\" rất hay gặp ở vòng senior. Đây cũng là chỗ kỹ năng testing sẵn có của dev backend dùng được ngay.", "checks": ["Viết được eval set 10 câu cho chatbot hỗ trợ khách hàng, mỗi câu có tiêu chí chấm (bài tập 3)", "Đo được recall@5 của hệ RAG ở module 2.5 trước và sau khi thêm hybrid search", "Viết được unit test cho adapter với fake trả JSON hỏng và <code>max_tokens<\/code>"], "children": [{"label": "Vì sao không assert chuỗi", "kind": "topic", "children": []}, {"label": "Cách chấm", "kind": "topic", "children": []}, {"label": "Khi nào chạy", "kind": "topic", "children": []}, {"label": "Eval RAG: tách hai tầng", "kind": "topic", "children": []}, {"label": "Test code quanh LLM", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.5 Bên trong vector search", "kind": "module", "file": "23-ai-llm-backend.md", "level": "🔴", "stage": "Chặng 3: Senior 🔴", "why": "Khi RAG chậm hoặc trả thiếu kết quả, nguyên nhân thường nằm trong index vector. Senior cần giải thích được đánh đổi recall lấy tốc độ và bẫy khi lọc theo tenant, giống như cần hiểu B+tree để tối ưu SQL.", "checks": ["Vẽ được cách HNSW tìm một vector qua ba tầng", "Đo được recall và latency của pgvector HNSW khi đổi <code>ef_search<\/code>, trên tập dữ liệu của chính mình", "Giải thích được vì sao query có filter tenant trả về 2 kết quả dù <code>LIMIT 10<\/code>"], "children": [{"label": "Vì sao cần tìm xấp xỉ", "kind": "topic", "children": []}, {"label": "HNSW", "kind": "topic", "children": []}, {"label": "IVF", "kind": "topic", "children": []}, {"label": "Lọc metadata kết hợp ANN", "kind": "topic", "children": []}, {"label": "Quantization", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 29, "knowledge": "", "prio": "★ đọc qua; ôn sâu khi JD có AI/LLM"}]}, {"label": "Ngoài kỹ thuật", "kind": "group", "children": [{"label": "Kỹ năng senior: ra quyết định, giao hàng, dẫn dắt", "kind": "file", "file": "24-senior-leadership.md", "children": [{"label": "1.1 Senior là gì, ownership", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 1: Ra quyết định và kỹ thuật", "why": "Vòng behavioral cho vị trí senior gần như luôn có câu kiểu \"vì sao bạn nghĩ mình đã là senior\" hoặc \"kể về một việc bạn tự nhận trách nhiệm\". Người phỏng vấn không chấm số năm kinh nghiệm mà chấm phạm vi bạn tự gánh. Hiểu khác biệt giữa các level giúp bạn chọn đúng câu chuyện để kể, và đọc ra công ty đang tuyển kiểu senior nào.", "checks": ["Viết xong một đoạn 5 câu mô tả phạm vi hiện tại của bạn theo 5 dòng của bảng trên, kèm ví dụ cho từng dòng", "Có một câu chuyện \"việc tôi làm không nằm trong task được giao nhưng tôi nhận trách nhiệm\", kể trong 2 phút"], "children": [{"label": "Level khác nhau ở phạm vi, không ở tốc độ code", "kind": "topic", "children": []}, {"label": "Ownership", "kind": "topic", "children": []}, {"label": "Các kiểu vai trò khi lên cao hơn", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 Khung trade-off và loại quyết định", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 1: Ra quyết định và kỹ thuật", "why": "Câu \"vì sao chọn X\" xuất hiện ở mọi vòng: hỏi đáp kỹ thuật, system design, behavioral. Trong công việc, đây cũng là cách bạn bảo vệ một đề xuất như \"Laravel queue hay RabbitMQ\", \"tách service hay giữ monolith\". Ở level senior, người phỏng vấn chấm <strong>cách bạn cân nhắc<\/strong>, không chấm bạn chọn đáp án nào.", "checks": ["Chọn một quyết định kỹ thuật thật trong dự án, viết ra đủ 4 phần của khung trade-off trên nửa trang", "Liệt kê 3 quyết định trong dự án hiện tại, xếp vào \"đảo ngược được\" hoặc \"khó đảo ngược\", và nói bạn đã dành bao lâu cho mỗi cái"], "children": [{"label": "Trade-off là gì", "kind": "topic", "children": []}, {"label": "Khung trade-off 4 bước", "kind": "topic", "children": []}, {"label": "Quyết định đảo ngược được và khó đảo ngược", "kind": "topic", "children": []}, {"label": "Disagree and commit", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Build vs buy, chọn công nghệ mới", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 1: Ra quyết định và kỹ thuật", "why": "Trong dự án PHP, câu hỏi build vs buy xuất hiện liên tục: dùng dịch vụ auth ngoài hay tự làm login, dùng Amazon SES hay tự dựng mail server, thêm service Go hay giữ Laravel. Quyết định sai ở đây tốn tiền và công sức nhiều năm. Senior hay bị hỏi \"vì sao không tự viết\" hoặc \"vì sao lại tự viết\", và \"tiêu chí chọn công nghệ mới của bạn là gì\".", "checks": ["Viết xong câu chuyện một lần bạn chọn dùng dịch vụ ngoài hoặc tự xây, có con số chi phí hoặc thời gian", "Trả lời được trong 2 phút \"vì sao team bạn chọn stack hiện tại\", nêu cả cái giá"], "children": [{"label": "Build vs buy là gì", "kind": "topic", "children": []}, {"label": "Tính đủ chi phí", "kind": "topic", "children": []}, {"label": "Trước khi đưa công nghệ mới vào", "kind": "topic", "children": []}, {"label": "Góc PHP", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Design doc/RFC và ADR", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 1: Ra quyết định và kỹ thuật", "why": "Ở công ty có quy trình tốt, thay đổi lớn phải qua design doc trước khi code. Người phỏng vấn senior hay hỏi \"team bạn ra quyết định kiến trúc thế nào\" hoặc \"kể một lần tài liệu thiết kế giúp phát hiện vấn đề sớm\". Có design doc và ADR thật để kể là bằng chứng mạnh nhất cho kỹ năng ra quyết định.", "checks": ["Viết xong một design doc tối đa 2 trang cho một tính năng đã làm, có mục phương án đã loại (bài tập 1)", "Viết xong 2 ADR cho hai quyết định có thật (bài tập 2)", "Kể được trong 2 phút một lần design doc giúp phát hiện vấn đề trước khi code"], "children": [{"label": "Design doc và RFC là gì", "kind": "topic", "children": []}, {"label": "Cấu trúc design doc", "kind": "topic", "children": []}, {"label": "Khi nào cần viết", "kind": "topic", "children": []}, {"label": "ADR", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.5 Chất lượng dài hạn: tech debt, code review, chuẩn hoá, chi phí", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 1: Ra quyết định và kỹ thuật", "why": "Câu \"bạn xử lý tech debt thế nào khi vẫn phải làm tính năng\" gần như chắc chắn được hỏi ở vòng mid và senior. Trong công việc, senior là người quyết khi nào trả nợ kỹ thuật, giữ chất lượng code review cho cả team, và ở mức 🔴 thì biết hệ thống đang tốn bao nhiêu tiền mỗi tháng.", "checks": ["Lập xong danh sách 5 khoản tech debt của dự án, xếp theo lãi suất, có đoạn thuyết phục bằng hệ quả kinh doanh (bài tập 4)", "Kể được trong 2 phút một lần bạn đưa một chuẩn/tool vào team và số liệu trước/sau", "Nói được con số chi phí hạ tầng hằng tháng (ước lượng) của hệ thống đang làm và phần tốn nhất"], "children": [{"label": "Tech debt là gì", "kind": "topic", "children": []}, {"label": "Ưu tiên và thuyết phục", "kind": "topic", "children": []}, {"label": "Code review", "kind": "topic", "children": []}, {"label": "Đào sâu (🔴)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Chia việc và ước lượng", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 2: Giao hàng và rủi ro", "why": "\"Bạn ước lượng thế nào, sai thì làm gì\" là câu hỏi chuẩn cho mid và senior. Trong công việc, ước lượng sai rồi báo muộn là lý do phổ biến nhất khiến product mất niềm tin vào team kỹ thuật. Cách chia việc tốt còn giúp release sớm, phát hiện vấn đề sớm, và luôn có thứ để giao khi hết thời gian.", "checks": ["Chia xong một tính năng sắp làm thành các phần dưới 1 ngày, ước lượng theo khoảng, sau khi làm so với thực tế (bài tập 3)", "Có một câu chuyện ước lượng sai: sai bao nhiêu, phát hiện lúc nào, báo ai, sửa quy trình thế nào; kể trong 2 phút"], "children": [{"label": "Chia việc theo lát dọc", "kind": "topic", "children": []}, {"label": "MVP và làm phần rủi ro trước", "kind": "topic", "children": []}, {"label": "Ước lượng", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.2 Rủi ro, dependency, cắt phạm vi, cập nhật tiến độ", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 2: Giao hàng và rủi ro", "why": "Deadline cố định mà không kịp làm hết là tình huống thật gần như tháng nào cũng gặp, và \"deadline cố định, không kịp, bạn làm gì\" là câu behavioral kinh điển. Người phỏng vấn muốn thấy ba thứ: bạn báo sớm, bạn đưa lựa chọn chứ không chỉ từ chối, và bạn không lặng lẽ cắt chất lượng.", "checks": ["Viết xong câu chuyện STAR \"deadline cố định, tôi cắt phạm vi\", có con số phạm vi ban đầu và phạm vi đã giao", "Viết mẫu một bản cập nhật tiến độ 5 dòng cho dự án đang làm, có mục rủi ro"], "children": [{"label": "Rủi ro", "kind": "topic", "children": []}, {"label": "Dependency", "kind": "topic", "children": []}, {"label": "Cắt phạm vi khi deadline cố định", "kind": "topic", "children": []}, {"label": "Cập nhật tiến độ", "kind": "topic", "children": []}, {"label": "Nhận ra dự án đi chệch", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.3 Làm việc với product và business", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 2: Giao hàng và rủi ro", "why": "Phần lớn việc của backend bắt đầu từ một yêu cầu của product, và yêu cầu thường mơ hồ. Câu \"kể về một lần làm việc với yêu cầu không rõ ràng\" có mặt ở hầu hết vòng behavioral. Senior còn phải giải thích việc kỹ thuật (refactor, nâng cấp) cho người không làm kỹ thuật để xin được thời gian làm.", "checks": ["Có một câu chuyện \"yêu cầu mơ hồ → tôi làm rõ thế nào → kết quả\", kể trong 2 phút", "Viết lại xong một vấn đề kỹ thuật của dự án thành 3 câu cho người không làm kỹ thuật, có con số hệ quả"], "children": [{"label": "Hỏi vấn đề trước giải pháp", "kind": "topic", "children": []}, {"label": "Làm rõ yêu cầu mơ hồ", "kind": "topic", "children": []}, {"label": "Yêu cầu phi chức năng", "kind": "topic", "children": []}, {"label": "Nói bằng hệ quả kinh doanh", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.4 Legacy và migration lớn", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 2: Giao hàng và rủi ro", "why": "Dự án PHP lâu năm nào cũng có legacy: code không test, framework cũ, chạy PHP 5 hoặc 7. Senior được kỳ vọng thay đổi những hệ thống này an toàn, không làm gián đoạn kinh doanh. \"Kể về một migration lớn\" là câu hỏi senior phổ biến, và câu tình huống \"chuyển bảng 500 triệu dòng không downtime\" hay xuất hiện.", "checks": ["Viết xong kế hoạch migration 6 bước cho một bảng hoặc service có thật trong dự án, mỗi bước có tiêu chí đi tiếp và rollback", "Có một câu chuyện làm việc với legacy code không test, kể trong 2 phút, nói rõ đã giảm rủi ro thế nào"], "children": [{"label": "Làm việc với legacy code", "kind": "topic", "children": []}, {"label": "Góc PHP: nâng cấp nhiều major version", "kind": "topic", "children": []}, {"label": "Strangler fig (🔴)", "kind": "topic", "children": []}, {"label": "Đổi nơi lưu dữ liệu (🔴)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.5 Vận hành, sự cố, đo năng lực giao hàng", "kind": "module", "file": "24-senior-leadership.md", "level": "", "stage": "Chặng 2: Giao hàng và rủi ro", "why": "\"Kể về một sự cố production bạn từng xử lý\" có ở hầu hết vòng behavioral. Senior được kỳ vọng không chỉ sửa bug mà còn dẫn dắt xử lý sự cố và làm cho nó không lặp lại. DORA metrics là cách nói về năng lực giao hàng của team bằng số liệu, hay được hỏi ở công ty có văn hoá DevOps.", "checks": ["Viết xong câu chuyện sự cố theo 5 bước (xảy ra gì, phát hiện, root cause, khắc phục, phòng ngừa), có số phút ảnh hưởng và số user bị ảnh hưởng", "Viết xong một postmortem mẫu 1 trang cho sự cố đó", "Nói được ước lượng deployment frequency và change fail rate của team hiện tại"], "children": [{"label": "You build it, you run it", "kind": "topic", "children": []}, {"label": "Postmortem blameless", "kind": "topic", "children": []}, {"label": "DORA metrics", "kind": "topic", "children": []}, {"label": "Incident commander (🔴)", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.1 Mentor, onboarding, giao việc", "kind": "module", "file": "24-senior-leadership.md", "level": "🔴", "stage": "Chặng 3: Con người và ảnh hưởng 🔴", "why": "Ở level senior, câu \"bạn đã giúp ai tiến bộ\" dùng để xem bạn nhân được năng lực của cả team hay chỉ làm tốt phần mình. Trong công việc, senior ôm hết việc khó sẽ thành nút thắt, và khi senior nghỉ phép thì team đứng lại.", "checks": ["Viết xong câu chuyện STAR mentor một người cụ thể, có kết quả đo được (thời gian onboard, việc họ tự làm được sau N tháng)", "Viết xong một kế hoạch onboarding 2 tuần cho người mới vào team hiện tại"], "children": [{"label": "Onboarding", "kind": "topic", "children": []}, {"label": "Mentor bằng câu hỏi", "kind": "topic", "children": []}, {"label": "Giao việc", "kind": "topic", "children": []}, {"label": "Đo tiến bộ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.2 Góp ý và nhận góp ý", "kind": "module", "file": "24-senior-leadership.md", "level": "🔴", "stage": "Chặng 3: Con người và ảnh hưởng 🔴", "why": "Vòng behavioral senior hay có cặp câu \"kể về lần bạn đưa một góp ý khó\" và \"lần bạn nhận một góp ý khó\". Trong công việc, ngày nào bạn cũng góp ý qua code review, và cách góp ý quyết định team có dám nói thật với nhau không.", "checks": ["Có một câu chuyện đưa góp ý khó cho đồng nghiệp và một câu chuyện nhận góp ý khó, mỗi câu kể trong 2 phút, nói rõ thay đổi sau đó"], "children": [{"label": "Đưa góp ý", "kind": "topic", "children": []}, {"label": "Nhận góp ý", "kind": "topic", "children": []}, {"label": "Góp ý trong code review", "kind": "topic", "children": []}, {"label": "Khung Radical Candor", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.3 Đưa quyết định qua nhiều bên, ảnh hưởng khi không có quyền", "kind": "module", "file": "24-senior-leadership.md", "level": "🔴", "stage": "Chặng 3: Con người và ảnh hưởng 🔴", "why": "Senior thường cần team khác làm một việc mà mình không có quyền ra lệnh: team hạ tầng nâng cấp, team mobile đổi API. Câu \"thuyết phục team khác\" và \"bất đồng với manager\" rất hay gặp. Người phỏng vấn tìm dấu hiệu bạn thuyết phục bằng dữ liệu và lợi ích chung, không bằng ép buộc.", "checks": ["Viết xong câu chuyện STAR thuyết phục một team khác (hoặc người không báo cáo cho bạn) thay đổi cách làm, có kết quả đo được", "Viết xong câu chuyện bất đồng với lead/manager, nói rõ bạn đã hiểu thêm gì từ phía họ"], "children": [{"label": "Chuẩn bị trước buổi họp", "kind": "topic", "children": []}, {"label": "Gỡ tranh luận bế tắc", "kind": "topic", "children": []}, {"label": "Thuyết phục team khác", "kind": "topic", "children": []}, {"label": "Bất đồng với manager về ưu tiên", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "3.4 Tuyển người", "kind": "module", "file": "24-senior-leadership.md", "level": "🔴", "stage": "Chặng 3: Con người và ảnh hưởng 🔴", "why": "Senior thường được mời làm người phỏng vấn. Công ty hỏi \"bạn từng tham gia tuyển người chưa\" để xem bạn có góp phần xây team. Ngồi ghế người chấm cũng giúp bạn hiểu người phỏng vấn mình đang tìm gì.", "checks": ["Viết xong bộ tiêu chí chấm cho một vòng phỏng vấn backend mid, mỗi tiêu chí có ví dụ \"đạt\" và \"chưa đạt\"", "Kể được trong 1 phút một lần bạn phỏng vấn hoặc tham gia tuyển người, và điều bạn rút ra"], "children": [{"label": "Phỏng vấn theo tiêu chí", "kind": "topic", "children": []}, {"label": "Viết feedback", "kind": "topic", "children": []}, {"label": "Thiên kiến", "kind": "topic", "children": []}, {"label": "Dùng cho chính mình", "kind": "topic", "children": []}], "knowledge": ""}], "questions": 20, "knowledge": "", "prio": "★★★"}, {"label": "Kỹ năng phỏng vấn", "kind": "file", "file": "25-interview-skills.md", "children": [{"label": "1.1 Đọc JD và hiểu quy trình", "kind": "module", "file": "25-interview-skills.md", "level": "", "stage": "Chặng 1: Hồ sơ và câu chuyện", "why": "JD là đề bài của cả quy trình tuyển dụng. Đọc kỹ JD cho bạn biết sẽ bị hỏi gì và cần chuẩn bị câu chuyện nào. Hỏi recruiter về quy trình từ đầu giúp tránh bất ngờ về format, đặc biệt là chính sách dùng AI, thứ mà năm 2026 mỗi công ty một khác.", "checks": ["Gạch xong 3 JD định nộp thành ba nhóm, mỗi từ khoá \"bắt buộc\" có một câu chuyện hoặc một module đã ôn đi kèm (bài tập 4)", "Có sẵn danh sách 5 câu hỏi về quy trình để hỏi recruiter, gồm câu về chính sách dùng AI"], "children": [{"label": "Phân tích JD", "kind": "topic", "children": []}, {"label": "Từ khoá chưa từng làm", "kind": "topic", "children": []}, {"label": "Hỏi về quy trình", "kind": "topic", "children": []}, {"label": "Cách các vòng được chấm", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.2 CV, LinkedIn, GitHub", "kind": "module", "file": "25-interview-skills.md", "level": "", "stage": "Chặng 1: Hồ sơ và câu chuyện", "why": "CV là thứ người lọc hồ sơ chỉ đọc lướt trước khi quyết định có gọi bạn hay không. Sau đó nó thành đề cương để người phỏng vấn kỹ thuật hỏi sâu. CV viết theo kết quả giúp qua vòng lọc. CV chỉ ghi những gì bạn thật sự làm giúp không bị gãy khi bị hỏi.", "checks": ["Viết lại xong 5 gạch đầu dòng theo khung kết quả, mỗi dòng có một con số hoặc quy mô (bài tập 1)", "Với mỗi công nghệ trong CV, nói được 2 phút về một lần dùng thật và một cạm bẫy đã gặp"], "children": [{"label": "Mỗi gạch đầu dòng là một kết quả", "kind": "topic", "children": []}, {"label": "Ghi gì và không ghi gì", "kind": "topic", "children": []}, {"label": "Hình thức", "kind": "topic", "children": []}, {"label": "LinkedIn và GitHub", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.3 Giới thiệu bản thân", "kind": "module", "file": "25-interview-skills.md", "level": "", "stage": "Chặng 1: Hồ sơ và câu chuyện", "why": "Gần như vòng nào cũng mở đầu bằng \"giới thiệu về bản thân\". Một phút đầu đặt khung cho cả buổi: người phỏng vấn thường hỏi tiếp đúng vào thứ bạn vừa nhắc tới. Chuẩn bị tốt thì bạn tự chọn được chủ đề mình sẽ bị hỏi.", "checks": ["Viết xong và bấm giờ bản 1 phút và bản 3 phút, tiếng Việt; 🟡 thêm bản tiếng Anh (bài tập 3)", "Ghi âm bản 1 phút, nghe lại không có \"ờ\" kéo dài và không vượt 70 giây"], "children": [{"label": "Hai phiên bản", "kind": "topic", "children": []}, {"label": "Câu \"vì sao đổi việc\"", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "1.4 Kho câu chuyện STAR", "kind": "module", "file": "25-interview-skills.md", "level": "", "stage": "Chặng 1: Hồ sơ và câu chuyện", "why": "Vòng behavioral, vòng hiring manager, và cả câu \"kể về dự án\" ở vòng kỹ thuật đều cần câu chuyện. Kể ngẫu hứng thường lan man, dùng \"chúng tôi\" nên không rõ bạn làm gì, và thiếu kết quả. Có sẵn kho 6–8 câu chuyện có cấu trúc thì trả lời được phần lớn câu behavioral.", "checks": ["Viết xong 6 câu chuyện STAR + Learning, mỗi câu kể dưới 3 phút và có ít nhất một con số (bài tập 2)", "Điền xong bảng ánh xạ câu chuyện → câu hỏi cho cả 6 câu chuyện", "Nhờ một người hỏi vặn 3 lớp \"vì sao\" cho câu chuyện sự cố mà bạn vẫn trả lời được bằng chi tiết thật"], "children": [{"label": "Khung STAR + Learning", "kind": "topic", "children": []}, {"label": "Số lượng và độ sâu", "kind": "topic", "children": []}, {"label": "Các câu chuyện cần có", "kind": "topic", "children": []}, {"label": "Bảng ánh xạ", "kind": "topic", "children": []}, {"label": "Câu chuyện sự cố", "kind": "topic", "children": []}, {"label": "Kiểm tra độ phủ", "kind": "topic", "children": []}], "knowledge": ""}, {"label": "2.1 Screening HR, coding test online", "kind": "module", "file": "25-interview-skills.md", "level": "", "stage": "Chặng 2: Từng loại vòng", "why": "Mỗi loại vòng chấm một thứ khác nhau. Luyện sai format (ví dụ chỉ giải LeetCode mà vòng thật là review code) là lãng phí thời gian ôn. HR screening và coding test online là hai vòng lọc đầu tiên: trượt ở đây thì không có cơ hội thể hiện kiến thức sâu.", "checks": ["Làm const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// Chuẩn bị cây: cha, màu nhánh (theo nhóm).
(function prep(n, parent, branch) {

})(DATA, null, 0);
const all = [];
(function walk(n) { all.push(n); n.children.forEach(walk); })(DATA);
const modules = all.filter(n => n.kind === "module");

function keyOf(m) { return "mm:" + m.file + ":" + m.label; }
function doneCount(m) { const s = store.get(keyOf(m), []); return m.checks.filter((_, i) => s[i]).length; }

  (function w(x) { if (x.kind === "module") { done += doneCount(x); total += x.checks.length; } x.children.forEach(w); })(n);

}
function stats() {

}

const ctx = document.createElement("canvas").getContext("2d");
const FAMILY = " -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
function width(s, font) { ctx.font = font + FAMILY; return ctx.measureText(s).width; }
function clip(s, font, max) {
  if (width(s, font) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (width(s.slice(0, mid) + "…", font) <= max) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo).trimEnd() + "…";
}
function wrap(s, font, max, lines) {
  const words = s.split(" "), out = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (width(t, font) <= max || !cur) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (out.length > lines) { const rest = out.slice(lines - 1).join(" "); out.length = lines - 1; out.push(clip(rest, font, max)); }
  return out.map(l => clip(l, font, max));
}

function labelOf(n) { return n.kind === "module" && n.level ? n.level + " " + n.label : n.label; }
function badgeOf(n) {

}

const NS = "http://www.w3.org/2000/svg";

}

const svg = document.getElementById("svg"), view = document.getElementById("view");

// Chọn bố cục: một vòng (các con) hoặc hai vòng (con + cháu) nếu vừa chỗ.
function plan(n, W) {

  const two = W >= 900 && c.length <= 10 && gc.length > 0 && gc.length <= 40 && n.kind !== "module";
  return {inner: two ? c : null, outer: two ? gc : c};

function render() {

  const open = panel.classList.contains("open"), wide = innerWidth > 640;
  const side = open && wide ? panel.offsetWidth + 32 : 0, below = open && !wide ? panel.offsetHeight + 16 : 0;
  const W = innerWidth - side, H = innerHeight - header - below;

  const FO = "12.5px", FI = "600 13px", FC = "700 15px";

  stageEl.style.bottom = below + "px";

  const place = [];

    el("path", {class: "link", d: `M0,0 L${x},${y}`, stroke: color(n)}, gl);
  });

  // Vòng ngoài: nhãn xoay theo hướng toả ra, nửa trái lật lại cho dễ đọc.
  outer.forEach((n, i) => {
    const [x, y] = pos(n._a, rx, ry);
    const deg = Math.atan2(ry * Math.sin(n._a), rx * Math.cos(n._a)) * 180 / Math.PI;
    const left = Math.cos(n._a) < 0;
    const g = node(n, gn, `translate(${x},${y})`);
    const lv = {"🟢": "var(--lv1)", "🟡": "var(--lv2)", "🔴": "var(--lv3)"}[n.level];
    el("circle", {class: "dot" + (n.children.length ? " has" : ""), r: n.kind === "module" ? 5.5 : n.children.length ? 5 : 3.5,
      stroke: color(n), style: `color:${lv || color(n)}`}, g);
    const horiz = !inner && outer.length <= 12;
    const t = el("text", {transform: horiz ? "" : `rotate(${left ? deg + 180 : deg})`, x: left ? -10 : 10, "dominant-baseline": "middle",
      "text-anchor": left ? "end" : "start", "font-size": 12.5}, g);
    el("tspan", {}, t, outerText[i]);
    if (badges[i]) el("tspan", {class: "muted", "font-size": 11, dx: 6}, t, badges[i]);
  });

  // Vòng trong: nhãn nằm ngang trong khung bo góc.
  if (inner) inner.forEach(c => {
    const [x, y] = pos(c._a, r1x, r1y);
    const lines = wrap(c.label, FI, 120, 2);
    pill(node(c, gn, `translate(${x},${y})`), lines, FI, 13, color(c), badgeOf(c));
  });

  // Tâm.
  const cg = node(focus, gn, "translate(0,0)", true);
  const cl = wrap(labelOf(focus), FC, 170, 3);
  pill(cg, cl, FC, 15, color(focus), focus.kind === "root" ? "" : badgeOf(focus), true);
  if (focus.parent) el("title", {}, cg, "Bấm để lùi lại: " + focus.parent.label);

  view.classList.remove("enter"); void view.getBBox(); view.classList.add("enter");
  crumbs();
}

function pill(g, lines, font, size, stroke, badge, isCenter) {
  const lh = size * 1.3;
  const btxt = badge ? badge + " tiêu chí" : "";
  const w = Math.max(...lines.map(l => width(l, font)), btxt ? width(btxt, "11px") : 0) + 24;
  const h = lines.length * lh + (badge ? 16 : 0) + 14;
  el("rect", {class: "pill", x: -w / 2, y: -h / 2, width: w, height: h, rx: isCenter ? h / 2.4 : 10, stroke}, g);
  const t = el("text", {"text-anchor": "middle", "font-size": size, "font-weight": isCenter ? 700 : 600}, g);
  const y0 = -h / 2 + 7 + lh * 0.8;
  lines.forEach((l, i) => el("tspan", {x: 0, y: y0 + i * lh}, t, l));
  if (badge) el("tspan", {x: 0, y: y0 + lines.length * lh + 2, class: "muted", "font-size": 11, "font-weight": 400}, t, btxt);
}

function node(n, parent, transform, isCenter) {
  const g = el("g", {class: "n" + (isCenter ? " center" : ""), transform, tabindex: 0, role: "button", "aria-label": n.label}, parent);
  el("title", {}, g, n.label);
  const act = () => isCenter ? up() : open(n);
  g.addEventListener("click", e => { e.stopPropagation(); act(); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  return g;
}

function open(n) {
  if (n.kind === "topic") { setFocus(n.parent); return; }
  setFocus(n);
}
function up() { if (focus.parent) setFocus(focus.parent); }
function setFocus(n) {
  focus = n;
  if (n.kind === "module") showPanel(n); else panel.classList.remove("open");
  render();
  try { history.replaceState(null, "", "#" + encodeURIComponent(pathOf(n).map(x => x.label).slice(1).join("/"))); } catch (e) {}
}
function pathOf(n) { const p = []; for (let x = n; x; x = x.parent) p.unshift(x); return p; }

function crumbs() {
  const nav = document.getElementById("crumbs");
  nav.textContent = "";
  pathOf(focus).forEach((n, i, arr) => {
    if (i) { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; nav.appendChild(s); }
    const b = document.createElement("button");
    b.textContent = n.kind === "root" ? "Tất cả" : labelOf(n);
    if (i < arr.length - 1) b.onclick = () => setFocus(n); else b.setAttribute("aria-current", "page");
    nav.appendChild(b);
  });
  const hint = document.createElement("span"); hint.className = "hint";
  hint.textContent = (focus.kind === "file" ? "Chấm: 🟢 nền · 🟡 làm chủ · 🔴 senior · " : "")
    + (focus.parent ? "Bấm vào tâm hoặc Esc để lùi lại" : "Bấm vào một nhánh để đi sâu");
  nav.appendChild(hint);
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function showPanel(m) {
  const saved = store.get(keyOf(m), []);
  const done = doneCount(m), total = m.checks.length;
  panel.innerHTML = `
    <button class="close" aria-label="Đóng">×</button>
    <h2>${esc(labelOf(m))}</h2>
    <div class="crumb">${esc(pathOf(m).slice(1, -1).map(x => x.label).concat(m.stage ? [m.stage] : []).join(" › "))}</div>
    ${m.why ? `<h3>Vì sao cần học</h3><p>${m.why}</p>` : ""}
    ${m.children.length ? `<h3>Nhóm kiến thức</h3><ul>${m.children.map(c => `<li>${esc(c.label)}</li>`).join("")}</ul>` : ""}
    ${total ? `<h3>Nắm chắc khi (${done}/${total})</h3>
      <div class="progress"><div style="width:${done / total * 100}%"></div></div>
      ${m.checks.map((c, i) => `<label><input type="checkbox" data-i="${i}" ${saved[i] ? "checked" : ""}><span>${c}</span></label>`).join("")}` : ""}
    <h3>Học chi tiết</h3>
    <p><a href="${encodeURI(m.file)}" target="_blank" rel="noopener">Mở plan ${esc(m.file)}</a>, tìm module “${esc(m.label)}”.</p>
    ${m.knowledge ? `<p><a href="${encodeURI(m.knowledge)}" target="_blank" rel="noopener">📖 Mở bài đọc kiến thức</a>, mục “${esc(m.label)}”.</p>` : ""}`;
  panel.classList.add("open");
  panel.querySelector(".close").onclick = () => { panel.classList.remove("open"); render(); };
  panel.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () => {
    const s = store.get(keyOf(m), []); s[+cb.dataset.i] = cb.checked; store.set(keyOf(m), s);
    stats(); showPanel(m); render();
  });
}

// Tìm kiếm: danh sách kết quả, bấm để nhảy tới.
function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase(); }
const q = document.getElementById("q"), results = document.getElementById("results");
q.addEventListener("input", () => {
  const term = norm(q.value.trim());
  results.textContent = "";
  if (!term) { results.classList.remove("open"); return; }
  const hits = all.filter(n => n.kind !== "root" && norm(n.label).includes(term)).slice(0, 30);
  if (!hits.length) { const d = document.createElement("div"); d.style.padding = "10px 12px"; d.textContent = "Không tìm thấy"; results.appendChild(d); }
  hits.forEach(n => {
    const b = document.createElement("button");
    b.innerHTML = `${esc(labelOf(n))}<small>${esc(pathOf(n).slice(1, -1).map(x => x.label).join(" › "))}</small>`;
    b.onclick = () => { results.classList.remove("open"); q.value = ""; open(n); };
    results.appendChild(b);
  });
  results.classList.add("open");
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (results.classList.contains("open")) { results.classList.remove("open"); return; }
    if (document.activeElement !== q) up();
  }
});

// Theme sáng/tối, nhớ lựa chọn.
const themeSaved = store.get("mm:theme", null);
if (themeSaved) document.documentElement.dataset.theme = themeSaved;
document.getElementById("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("mm:theme", next);
};

// Mở lại đúng chỗ đang xem nếu URL có #đường/dẫn.
(function restore() {
  try {
    const parts = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
    let n = DATA;
    for (const p of parts) { const c = n.children.find(x => x.label === p); if (!c) break; n = c; }
    focus = n; if (n.kind === "module") showPanel(n);
  } catch (e) {}
})();

stats(); render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
</script>
</body>
</html>
